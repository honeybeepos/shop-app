name: Build Android APK

# হাতে চালাতে হয়: GitHub → Actions → "Build Android APK" → Run workflow
on:
  workflow_dispatch:
    inputs:
      app:
        description: "কোন অ্যাপ বানাবেন"
        type: choice
        options:
          - bazar
          - pos
        default: bazar

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: কোন অ্যাপ — নাম, Package ID, শুরুর পাতা ঠিক করা
        run: |
          case "${{ inputs.app }}" in
            pos)
              echo "APP_ID=com.honeybeebazar.pos" >> $GITHUB_ENV
              echo "APP_NAME=Honey Bee POS" >> $GITHUB_ENV
              echo "START_URL=https://honeybeebazar.com/login.html" >> $GITHUB_ENV
              echo "ICON=icon-512.png" >> $GITHUB_ENV
              echo "APK_NAME=honey-bee-pos" >> $GITHUB_ENV ;;
            *)
              echo "APP_ID=com.honeybeebazar.app" >> $GITHUB_ENV
              echo "APP_NAME=Honey Bee Bazar" >> $GITHUB_ENV
              echo "START_URL=https://honeybeebazar.com/honey-bee-bazar.html" >> $GITHUB_ENV
              echo "ICON=bazar-icon-512.png" >> $GITHUB_ENV
              echo "APK_NAME=honey-bee-bazar" >> $GITHUB_ENV ;;
          esac

      - name: Capacitor প্রজেক্টের ফাইল বানানো
        run: |
          mkdir -p native-app/www
          cd native-app
          cat > package.json <<'EOF2'
          {
            "name": "honey-bee-native",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/app": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/push-notifications": "^7.0.0",
              "@capacitor-firebase/authentication": "^7.0.0"
            }
          }
          EOF2
          cat > capacitor.config.json <<EOF2
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": {
              "url": "$START_URL",
              "allowNavigation": ["honeybeebazar.com", "*.honeybeebazar.com", "*.firebaseapp.com", "*.googleapis.com", "*.gstatic.com", "accounts.google.com"]
            },
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["google.com"]
              }
            }
          }
          EOF2
          cat > www/index.html <<EOF2
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=$START_URL"><title>$APP_NAME</title>
          EOF2

      - name: Android প্রজেক্ট তৈরি
        working-directory: native-app
        run: |
          npm install
          npx cap add android
          cp ../google-services.json android/app/google-services.json

      - name: আইকন, নোটিফিকেশন আইকন আর অনুমতি বসানো
        working-directory: native-app
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p $RES/mipmap-$n
            convert ../$ICON -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
            rm -f $RES/mipmap-$n/ic_launcher_foreground.png
          done
          mkdir -p $RES/drawable
          cat > $RES/drawable/ic_stat_hb.xml <<'EOF2'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.89,2 2,2zM18,16v-5c0,-3.07 -1.64,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.63,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
          </vector>
          EOF2
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_hb" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="hb_default" />\n    </application>#' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n    <uses-feature android:name="android.hardware.location" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' $M
          cat $M

      - name: অ্যাপের পর্দা স্ট্যাটাস বারের নিচে আনা (MainActivity)
        working-directory: native-app
        run: |
          F=android/app/src/main/java/${APP_ID//.//}/MainActivity.java
          ls -la $(dirname $F)
          cat > $F <<EOF2
          package $APP_ID;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              // স্ট্যাটাস বার (সময়/ওয়াইফাই/ব্যাটারি) আর নিচের নেভিগেশন বারের নিচে অ্যাপের পর্দা যাতে ঢুকে না যায়
              getWindow().getDecorView().setBackgroundColor(Color.parseColor("#14100A"));
              WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView()).setAppearanceLightStatusBars(false);
              WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView()).setAppearanceLightNavigationBars(false);
              View content = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                v.setPadding(bars.left, bars.top, bars.right, Math.max(bars.bottom, ime.bottom));
                return WindowInsetsCompat.CONSUMED;
              });
            }
          }
          EOF2

      - name: স্থায়ী সাইনিং চাবি বসানো (Google লগইনের SHA-1 যাতে বদলে না যায়)
        run: |
          mkdir -p ~/.android
          cp hb-debug.keystore ~/.android/debug.keystore
          # জোর করে এই চাবিই ব্যবহার করানো (ফোল্ডার যেখানেই থাক)
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("..\/..\/..\/hb-debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' native-app/android/app/build.gradle
          sed -n 1,25p native-app/android/app/build.gradle

      - name: APK বানানো
        working-directory: native-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK-র আসল সাইনিং SHA-1 দেখানো
        run: |
          echo "আশা করা : DD:89:11:98:B1:76:0F:F1:EC:1F:40:9F:BB:D4:77:38:73:66:6F:B4"
          keytool -printcert -jarfile native-app/android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA1|Owner"

      - name: APK ডাউনলোডের লিংক বানানো (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp native-app/android/app/build/outputs/apk/debug/app-debug.apk $APK_NAME.apk
          gh release create "apk-${{ inputs.app }}-${{ github.run_number }}" $APK_NAME.apk \
            --title "$APP_NAME APK #${{ github.run_number }}" \
            --notes "ফোনে বসানোর APK — নিচের $APK_NAME.apk চাপুন।"
