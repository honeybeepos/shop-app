<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Bee Bazar</title>
<script>
  /* 🔗 GitHub Pages স্ট্যাটিক হোস্টিং — /p/{shopId}/{productId}-এর মতো "সুন্দর" URL
     সরাসরি বুঝতে পারে না, তাই অজানা path পেলে GitHub Pages এই 404.html দেখায়।
     এই ছোট্ট স্ক্রিপ্টটা আসল path-টা (query হিসেবে) নিয়ে honey-bee-bazar.html-এ
     পাঠিয়ে দেয় — সেখানে আবার আসল ঠিকানাটা (history.replaceState দিয়ে) ফিরিয়ে
     আনা হয়, তাই ভিজিটর/Facebook সবসময় আসল সুন্দর লিংকটাই (/p/HB123...) দেখে। */
  var path = location.pathname + location.search + location.hash;
  location.replace('/honey-bee-bazar.html?hbRedirect=' + encodeURIComponent(path));
</script>
</head>
<body>
  <p style="font-family:sans-serif; text-align:center; margin-top:40px; color:#888;">লোড হচ্ছে...</p>
</body>
</html>
