<!--
  🤝🐝 Honey Bee Organization — মানুষের পাশে · মানবিক সেবা
  চেহারা ও চলাফেরা মালিকের ডেমো (honey_bee_organization_v1_7.html) অনুযায়ী:
  উপরে লোগো চাপলে বড় মেনু, নিচে ৫ বোতামের বার, আর প্রত্যেকের নিজের হোম —
  সাধারণ মানুষ / অনুমোদিত সদস্য / অ্যাডমিন। রং Honey Bee Bazar-এর কালো-মধু।
  ডেমোর "ডেমো ভিউ" বদলানোর জায়গায় এখানে আসল লগইন — কে সদস্য, কে অ্যাডমিন
  সেটা সার্ভার ঠিক করে (functions/org.js), ফোন থেকে বদলানো যায় না।
-->
<style>
:root{
  --bg1:#1a1206; --bg2:#3d2405; --gold:#ffb703; --amber:#ffd166;
  --card:#241705; --border:rgba(255,209,102,0.22); --ink:#fff8e8;
  --muted:rgba(255,248,232,0.6); --ok:#2fbf71; --danger:#e2543d;
}
*{box-sizing:border-box}
html,body{margin:0} html{background:#1a1206}
body{min-height:100vh; min-height:100dvh; background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%) fixed; color:var(--ink);
  font-family:"Noto Sans Bengali","Hind Siliguri","Nirmala UI",system-ui,sans-serif; -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:var(--amber)}
.app{max-width:1080px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
/* ---- উপরের অংশ (ডেমোর সবুজ হেডারের জায়গায় মধু-রঙা) ---- */
.top{background:linear-gradient(120deg,#5a3608,#8a5a0c 55%,#b07a12); color:#fff; padding:14px 16px 18px; border-radius:0 0 24px 24px; box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toprow{display:flex; align-items:center; gap:10px}
.back{border:1px solid rgba(255,255,255,.35); background:rgba(0,0,0,.15); border-radius:11px; padding:7px 10px; color:#fff; font-weight:800; font-size:14px}
.brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1}
.logo{width:46px; height:46px; border-radius:15px; background:#fff8e8; display:grid; place-items:center; font-size:24px; border:0; padding:0; position:relative; flex-shrink:0; box-shadow:0 4px 12px rgba(0,0,0,.25)}
.logo i{position:absolute; right:-5px; bottom:-4px; font-size:13px; font-style:normal}
.brand h1{font-size:18px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand p{margin:2px 0 0; font-size:12px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.me{display:flex; align-items:center; gap:6px; font-size:12px}
.me img{width:32px; height:32px; border-radius:50%; border:2px solid rgba(255,255,255,.6)}
.wrap{padding:16px; flex:1 0 auto; width:100%}
.welcome{margin:2px 0 14px} .welcome h2{font-size:21px; margin:0 0 4px} .welcome p{color:var(--muted); margin:0; font-size:13.5px; line-height:1.6}
/* ---- কার্ড, বোতাম ---- */
.card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px; margin-bottom:12px}
.h{font-size:15px; font-weight:800; margin:0 0 10px; display:flex; align-items:center; gap:8px}
.small{font-size:12px; color:var(--muted); line-height:1.6}
.btn{border:0; border-radius:12px; padding:11px 16px; font-weight:800; font-size:14px; background:linear-gradient(135deg,var(--amber),var(--gold)); color:var(--bg1)}
.btn.ghost{background:rgba(255,255,255,0.05); color:var(--ink); border:1px solid var(--border)}
.btn.green{background:var(--ok); color:#fff}
.btn.red{background:rgba(226,84,61,0.14); color:#fca5a5; border:1px solid rgba(226,84,61,0.45)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.full{width:100%}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0}
.f{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:12px 0 6px}
.in{width:100%; padding:11px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.06); font-size:14px}
.in:focus{outline:2px solid rgba(255,209,102,0.5)}
select.in option{background:#241705}
textarea.in{min-height:84px; resize:vertical}
.grid{display:grid; grid-template-columns:1fr; gap:10px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.sec{margin:18px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px}
.sec h2{font-size:17px; margin:0}
.statc{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:13px}
.statc .v{font-size:21px; font-weight:800; margin:4px 0}
.qcard{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; cursor:pointer; text-align:left; width:100%}
.qcard:hover{border-color:rgba(255,209,102,.5)}
.qcard b{display:block; font-size:14.5px; margin-bottom:3px}
.org{display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px; cursor:pointer; text-align:left; width:100%}
.av{width:44px; height:44px; border-radius:12px; background:rgba(255,209,102,0.14); display:grid; place-items:center; font-size:22px; flex-shrink:0}
.org b{font-size:14.5px}
.chip{display:inline-block; font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,0.07); color:var(--muted)}
.chip.ok{background:rgba(47,191,113,0.16); color:#86efac} .chip.wait{background:rgba(255,183,3,0.16); color:var(--amber)}
.chip.no{background:rgba(226,84,61,0.16); color:#fca5a5} .chip.admin{background:rgba(244,114,182,0.16); color:#f9a8d4}
.item{display:flex; gap:10px; align-items:center; padding:11px 0; border-bottom:1px solid rgba(255,255,255,0.07)}
.item:last-child{border-bottom:0} .item .grow{flex:1; min-width:0}
.empty{padding:18px; text-align:center; color:var(--muted); font-size:13px}
.notice{padding:11px 12px; border-radius:12px; background:rgba(255,183,3,0.1); border:1px solid rgba(255,183,3,0.3); color:#fde68a; font-size:12.5px; line-height:1.7}
.hero .big{font-size:20px; font-weight:800}
.stats{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.stat{flex:1; min-width:90px; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:12px; padding:9px 10px}
.stat b{display:block; font-size:18px; color:var(--amber)}
.tabs{display:none}
/* ---- নিচের ৫ বোতামের বার (ডেমোর মতো) ---- */
.bottom{position:sticky; bottom:0; margin-top:auto; background:rgba(26,18,6,.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:7px 4px max(8px, env(safe-area-inset-bottom)); z-index:20}
.bottom button{background:transparent; border:0; color:var(--muted); padding:6px 4px; font-size:11px; font-weight:700; display:grid; gap:2px; justify-items:center; min-width:58px; position:relative}
.bottom button span{font-size:20px; line-height:1.1}
.bottom button.on{color:var(--amber)}
.bottom button i{position:absolute; top:0; right:10px; background:#e2543d; color:#fff; font-size:10px; font-style:normal; border-radius:999px; padding:0 5px; min-width:16px}
/* ---- লোগো চাপলে বড় মেনু ---- */
.mm-back{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:40; display:none}
.mm-back.open{display:block}
.mm{position:absolute; top:0; left:0; right:0; max-width:560px; margin:0 auto; background:#1f1508; border:1px solid var(--border); border-top:0; border-radius:0 0 24px 24px; padding:18px 16px 20px; max-height:88vh; overflow:auto; box-shadow:0 14px 38px rgba(0,0,0,.5)}
.mm-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.mm-head h2{font-size:18px; margin:0}
.mm-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.mm-item{display:flex; align-items:center; gap:10px; text-align:left; background:rgba(255,255,255,.04); border:1px solid var(--border); color:var(--ink); padding:12px 11px; border-radius:14px; min-height:62px}
.mm-item .mi{width:38px; height:38px; display:grid; place-items:center; border-radius:12px; background:rgba(255,209,102,.14); font-size:20px; flex-shrink:0}
.mm-item small{display:block; color:var(--muted); font-weight:400; margin-top:2px; font-size:11px; line-height:1.4}
.mm-item.on{border-color:var(--amber)}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#ec4899; color:#fff; padding:11px 16px; border-radius:999px; font-weight:800; font-size:13px; z-index:60; display:none; max-width:92vw; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.4)}
.modal{position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:50; display:none; align-items:flex-end; justify-content:center}
.modal.show{display:flex}
.modal .box{width:100%; max-width:560px; background:#1f1508; border:1px solid var(--border); border-radius:20px 20px 0 0; padding:18px; max-height:92vh; overflow:auto}
.spin{display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:720px){
  .wrap{padding:22px 24px}
  .grid{grid-template-columns:1fr 1fr}
  .grid4{grid-template-columns:repeat(4,minmax(0,1fr)) !important}
  .top{padding:20px 25px; border-radius:0 0 28px 28px}
  .bottom{position:static; border:1px solid var(--border); border-radius:16px; margin:0 24px 18px}
  .modal{align-items:center} .modal .box{border-radius:20px}
  .mm{top:18px; border-radius:24px; border-top:1px solid var(--border)}
  .toast{bottom:28px}
}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <button class="back" id="backBtn" type="button" aria-label="Honey Bee Bazar-এ ফিরুন">←</button>
      <div class="brand">
        <button class="logo" type="button" id="logoBtn" aria-label="প্রধান মেনু খুলুন">🤝<i>🐝</i></button>
        <div style="min-width:0"><h1>Honey Bee Organization</h1><p id="ctxLine">মানুষের পাশে · মানবিক সেবা</p></div>

<div class="mm-back" id="mmBack"><section class="mm" role="dialog" aria-label="প্রধান মেনু">
  <div class="mm-head"><h2>🤝 Honey Bee Organization</h2><button class="btn ghost" type="button" id="mmClose" style="padding:7px 12px" aria-label="মেনু বন্ধ করুন">✕</button></div>
  <div class="mm-grid" id="mmItems"></div>
</section></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyD6qmuWkNUrskMIBHq8Z_AQ0N_WT1DL8Is",
  authDomain: "honeybee-984dd.firebaseapp.com",
  projectId: "honeybee-984dd",
  storageBucket: "honeybee-984dd.firebasestorage.app",
  messagingSenderId: "610211112501",
  appId: "1:610211112501:web:9ea40b9060d425e85b737c"
});
const db = firebase.firestore(), auth = firebase.auth(), fns = firebase.functions(), storage = firebase.storage();
const TS = ()=> firebase.firestore.FieldValue.serverTimestamp();
const $ = id=> document.getElementById(id);
const esc = v=> String(v == null ? "" : v).replace(/[&<>"']/g, c=> ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bn = v=> String(v).replace(/\d/g, d=> "০১২৩৪৫৬৭৮৯"[d]);
const tk = n=> "৳ " + bn(Number(n || 0).toLocaleString("en-US"));
const memNo = n=> "HB-" + bn(String(n || 0).padStart(3, "0"));
const ms = t=> t && t.toMillis ? t.toMillis() : 0;
function toast(t, d){ const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(()=> el.style.display = "none", d || 2600); }
function when(ts){ const d = ts && ts.toDate ? ts.toDate() : (typeof ts === "number" ? new Date(ts) : null); return d ? d.toLocaleString("bn-BD", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }) : ""; }
function left(msLeft){ if(msLeft <= 0) return "এখনই"; const t = Math.floor(msLeft / 1000), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return bn((d ? d + " দিন " : "") + String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0")); }
function errText(e){ return (e && e.message && !/^(internal|INTERNAL)$/.test(e.message)) ? e.message : "হয়নি — ইন্টারনেট দেখে আবার চেষ্টা করুন"; }
async function api(action, data){ return (await fns.httpsCallable("orgApi")(Object.assign({ action }, data || {}))).data; }
function districts(){ const l = []; Object.values(BD_LOCATIONS).forEach(dv=> Object.keys(dv).forEach(d=> l.push(d))); return l.sort((a,b)=> a.localeCompare(b, "bn")); }
function upazilas(dist){ let f = []; Object.values(BD_LOCATIONS).forEach(dv=>{ if(dv[dist]) f = dv[dist]; }); return f.slice().sort((a,b)=> a.localeCompare(b, "bn")); }
function openModal(html){ $("modalBox").innerHTML = html; $("modal").classList.add("show"); }
function closeModal(){ $("modal").classList.remove("show"); $("modalBox").innerHTML = ""; }
$("modal").addEventListener("click", e=>{ if(e.target.id === "modal" || e.target.closest("[data-close]")) closeModal(); });
// একটা বোতাম চাপলে সার্ভারে কাজ — চলাকালীন ঘুরন্ত চিহ্ন, ভুল হলে বার্তা
async function busy(btn, fn){
  if(btn){ btn.disabled = true; btn.dataset.t = btn.innerHTML; btn.innerHTML = `<span class="spin"></span>`; }
  try{ return await fn(); }
  catch(e){ toast(errText(e), 3600); return null; }
  finally{ if(btn && document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = btn.dataset.t; } }
}
function digits(v){ return String(v || "").replace(/[০-৯]/g, c=> "০১২৩৪৫৬৭৮৯".indexOf(c)); }

/* ---------- লগইন (Bazar-এর একই Google একাউন্ট) ---------- */
let ME = null;
async function login(){
  const p = new firebase.auth.GoogleAuthProvider();
  try{ await auth.signInWithPopup(p); }
  catch(e){ if(/popup-blocked|cancelled-popup-request|operation-not-supported/.test(e.code || "")) auth.signInWithRedirect(p); else if(e.code !== "auth/popup-closed-by-user") toast("লগইন হয়নি — আবার চেষ্টা করুন"); }
}
function needLogin(msg){
  if(ME) return false;
  openModal(`<div class="h">🔐 Google দিয়ে লগইন করুন</div>
    <div class="small">${esc(msg || "এই কাজ করতে লগইন লাগবে।")} Honey Bee Bazar-এর একই একাউন্ট — আলাদা একাউন্ট লাগবে না।</div>
    <div class="row" style="margin-top:14px"><button class="btn ghost" data-close type="button">পরে</button><button class="btn" id="lgGo" type="button" style="flex:1">🔵 Google দিয়ে লগইন</button></div>`);
  $("lgGo").onclick = ()=>{ closeModal(); login(); };
  return true;
}
function renderMe(){
  $("meBox").innerHTML = ME
    ? `<button type="button" onclick="setView('account')" style="background:none; border:0; padding:0">${ME.photo ? `<img src="${esc(ME.photo)}" alt="" referrerpolicy="no-referrer">` : `<span style="font-size:24px">👤</span>`}</button>`
    : `<button class="back" type="button" onclick="login()" style="font-size:12.5px">🔵 লগইন</button>`;
}

/* =====================================================================
   🧭 কোন সংগঠনে আছি (CTX) আর আমার ভূমিকা — পাবলিক / সদস্য / অ্যাডমিন
   সদস্য হলে সেই সংগঠনই খোলে; একাধিকে থাকলে মেনু → "সংগঠন বদলান"।
   ===================================================================== */
let MYIDX = { orgs:{}, applied:{} }, __idxUnsub = null, __idxReady = false;
let ORG = null, MYMEM = null, MYREQ = null, ORG_TAB = "home", __orgUnsubs = [], __tabUnsubs = [], CTX = null;
function stopTab(){ __tabUnsubs.forEach(u=>{ try{ u(); }catch(e){} }); __tabUnsubs = []; }
function stopOrg(){ stopTab(); __orgUnsubs.forEach(u=>{ try{ u(); }catch(e){} }); __orgUnsubs = []; __reqN = 0; __actN = 0; }
const isMember = ()=> !!MYMEM;
const isAdmin = ()=> !!(MYMEM && MYMEM.role === "admin");
const ROLE = ()=> isAdmin() ? "admin" : isMember() ? "member" : "public";
const need2 = ()=> ((ORG && ORG.adminCount) || 1) >= 2 ? 2 : 1;
function saveCtx(id){ try{ if(id) localStorage.setItem("hbOrgCtx", id); else localStorage.removeItem("hbOrgCtx"); }catch(e){} }
function listenIndex(){
  if(__idxUnsub){ __idxUnsub(); __idxUnsub = null; }
  MYIDX = { orgs:{}, applied:{} }; __idxReady = !ME;
  if(!ME){ chooseCtx(); return; }
  __idxUnsub = db.collection("orgUserIndex").doc(ME.uid).onSnapshot(d=>{
    const x = d.exists ? d.data() : {};
    MYIDX = { orgs: x.orgs || {}, applied: x.applied || {} };
    const first = !__idxReady; __idxReady = true;
    if(first) chooseCtx();
    else{ renderChrome(); if(["account","home"].includes(ORG_TAB) && !CTX) drawView(); }
  }, ()=>{ __idxReady = true; chooseCtx(); });
}
// শুরুতে কোন সংগঠন খুলবে: লিংকে থাকলে সেটা → আগে যেটা খোলা ছিল (সদস্য হলে) → আমার প্রথম সংগঠন → কোনোটাই না
function chooseCtx(){
  const hm = /#org=([A-Za-z0-9]{10,40})/.exec(location.hash);
  let want = hm ? hm[1] : null, saved = null;
  try{ saved = localStorage.getItem("hbOrgCtx"); }catch(e){}
  const mine = Object.keys(MYIDX.orgs || {});
  if(!want && saved && (mine.includes(saved) || !ME)) want = saved;
  if(!want && mine.length) want = mine[0];
  const pm = /[#&]post=([A-Za-z0-9]+)/.exec(location.hash);
  openCtx(want, pm ? "posts" : (hm ? "home" : ORG_TAB));
}
function openCtx(id, view){
  stopOrg(); ORG = null; MYMEM = null; MYREQ = null; CTX = id || null;
  ORG_TAB = view || "home";
  if(!CTX){ saveCtx(null); setUrl(); renderChrome(); drawView(); return; }
  setUrl();

function miniPosts(el, n){
  if(!el || !ORG) return;

  q = isMember() ? q.where("status", "==", "published") : q.where("audience", "==", "public").where("status", "==", "published");
  q.limit(30).get().then(qs=>{
    const l = qs.docs.map(d=> ({ id:d.id, ...d.data() })).sort((a,b)=> ms(b.publishAt) - ms(a.publishAt)).slice(0, n);
    el.innerHTML = l.map(p=> `<div class="card" style="cursor:pointer" data-gopost="${esc(p.id)}"><div class="row" style="flex-wrap:nowrap"><b style="font-size:13.5px; flex:1">${esc(ORG.name)}</b><span class="chip ${p.audience === "public" ? "" : "admin"}">${p.audience === "public" ? "🌐 পাবলিক" : "🔒 সদস্য"}</span></div>

      <div class="small" style="margin-top:6px">❤️ ${bn(p.likeCount || 0)} · 💬 ${bn(p.commentCount || 0)}${p.imagePath ? " · 🖼️ ছবি" : ""}</div></div>`).join("") || `<div class="card"><div class="empty">এখনো কোনো পোস্ট নেই</div></div>`;
    el.querySelectorAll("[data-gopost]").forEach(c=> c.onclick = ()=> setView("posts"));
  }).catch(()=>{ el.innerHTML = ""; });
}

async function publicFeed(el, n){
  if(!el) return;
  el.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  await loadOrgs();
  const orgs = RESULTS.slice(0, 12);
  const all = [];
  await Promise.all(orgs.map(o=> db.collection("orgs").doc(o.id).collection("posts").where("audience", "==", "public").where("status", "==", "published").limit(10).get()
    .then(qs=> qs.docs.forEach(d=> all.push(Object.assign({ id:d.id, __org:o }, d.data())))).catch(()=>{})));
  all.sort((a,b)=> ms(b.publishAt) - ms(a.publishAt));
  const l = n ? all.slice(0, n) : all.slice(0, 60);
  el.innerHTML = l.map(p=> `<div class="card" style="cursor:pointer" data-feed="${esc(p.__org.id)}:${esc(p.id)}">
      <div class="row" style="flex-wrap:nowrap"><div class="av" style="width:36px; height:36px; font-size:17px; border-radius:50%">🤝</div><div style="flex:1; min-width:0"><b style="font-size:13.5px">${esc(p.__org.name)}</b><div class="small">${esc(when(p.publishAt))}</div></div><span class="chip">🌐 পাবলিক</span></div>
      <div style="margin-top:8px; font-size:14px; line-height:1.7; ${n ? "display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;" : "white-space:pre-wrap"}">${esc(p.text)}</div>
      <div class="small" style="margin-top:6px">❤️ ${bn(p.likeCount || 0)} · 💬 ${bn(p.commentCount || 0)}${p.imagePath ? " · 🖼️ ছবি" : ""} · খুলতে চাপুন</div></div>`).join("")
    || `<div class="card"><div class="empty">এই এলাকায় এখনো কোনো পাবলিক পোস্ট নেই</div></div>`;
  el.querySelectorAll("[data-feed]").forEach(c=> c.onclick = ()=>{ const [oid, pid] = c.dataset.feed.split(":"); try{ history.replaceState(null, "", "#org=" + oid + "&post=" + pid); }catch(e){} openCtx(oid, "posts"); });
}

function viewSearch(){

  fillU();
  const save = ()=>{ __orgsKey = null; try{ localStorage.setItem("hbOrgArea", JSON.stringify({ d:SEARCH.d, u:SEARCH.u })); }catch(e){} };
  $("sD").onchange = ()=>{ SEARCH.d = $("sD").value; SEARCH.u = ""; fillU(); save(); runSearch(); };
  $("sU").onchange = ()=>{ SEARCH.u = $("sU").value; save(); runSearch(); };
  let t; $("sQ").oninput = ()=>{ SEARCH.q = $("sQ").value; clearTimeout(t); t = setTimeout(renderResults, 200); };
  runSearch();
}
let RESULTS = [], __seq = 0, __orgsKey = null;
async function loadOrgs(){
  const key = SEARCH.d + "|" + SEARCH.u;
  if(__orgsKey === key) return RESULTS;
  let q = db.collection("orgs").where("status", "==", "active");
  if(SEARCH.d) q = q.where("district", "==", SEARCH.d);
  if(SEARCH.d && SEARCH.u) q = q.where("upazila", "==", SEARCH.u);
  const qs = await q.limit(200).get();
  RESULTS = qs.docs.map(d=> ({ id:d.id, ...d.data() })).sort((a,b)=> (b.memberCount || 0) - (a.memberCount || 0));
  __orgsKey = key;
  return RESULTS;
}
async function runSearch(){
  const seq = ++__seq;
  const el = $("results"); if(!el) return;
  el.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  try{ await loadOrgs(); }catch(e){ if(seq === __seq && $("results")) $("results").innerHTML = `<div class="card"><div class="empty">লোড করা যায়নি — ইন্টারনেট দেখুন</div></div>`; return; }
  if(seq === __seq) renderResults();
}
function renderResults(){
  const el = $("results"); if(!el) return;
  const q = (SEARCH.q || "").trim().toLowerCase();
  const list = q ? RESULTS.filter(o=> (o.name + " " + (o.desc || "") + " " + (o.area || "")).toLowerCase().includes(q)) : RESULTS;
  el.innerHTML = list.length ? `<div class="grid">${list.map(o=> orgCardHtml(o)).join("")}</div>`
    : `<div class="card"><div class="empty">${SEARCH.d ? "এই এলাকায় এখনো কোনো সংগঠন নেই — আপনিই প্রথমটা খুলুন!" : "কোনো সংগঠন পাওয়া যায়নি"}</div></div>`;
  wireOrgCards(el);
}

async function toggleLike(pid){

/* ✍️ নতুন পোস্ট — ছবি ফোনেই WebP ১০০ KB-এর নিচে বানানো হয় */
async function makeWebp(file, maxBytes){
  if(!file || !/^image\//.test(file.type)) throw new Error("শুধু ছবি দেওয়া যাবে");
  const img = await new Promise((res, rej)=>{ const im = new Image(), u = URL.createObjectURL(file); im.onload = ()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error("ছবি খোলা যায়নি")); }; im.src = u; });
  let w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, 1280 / Math.max(w, h)); w = Math.round(w * sc); h = Math.round(h * sc);
  const draw = (q)=> new Promise(r=>{ const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); c.toBlob(r, "image/webp", q); });
  let blob = null;
  for(let i = 0; i < 14; i++){
    blob = await draw(i < 5 ? 0.82 - i * 0.09 : 0.42);
    if(blob && blob.size <= maxBytes) break;
    if(i >= 4){ w = Math.round(w * 0.84); h = Math.round(h * 0.84); }
  }
  if(!blob || blob.type !== "image/webp") throw new Error("এই ফোনে ছবি তৈরি করা যায়নি");
  if(blob.size > maxBytes) throw new Error("ছবিটা ছোট করা গেল না — অন্য ছবি দিন");
  return blob;
}

let PROPS = [], MYVOTES = {};
const PR_ST = { approved:["ok","✅ পাস — অনুমোদিত"], rejected:["no","❌ পাস হয়নি"], cancelled:["no","🚫 বাতিল"] };

  if($("newProp")) $("newProp").onclick = openNewProposal;

    PROPS = qs.docs.map(d=> ({ id:d.id, ...d.data() })).sort((a,b)=> ms(b.createdAt) - ms(a.createdAt));
    PROPS.forEach(p=>{ if(MYVOTES[p.id] === undefined){ MYVOTES[p.id] = null; db.collection("orgs").doc(ORG.id).collection("proposals").doc(p.id).collection("votes").doc(ME.uid).get().then(d=>{ if(d.exists){ MYVOTES[p.id] = d.data().choice; drawProps(); } }).catch(()=>{}); } });

function drawProps(){
  const el = $("propList"); if(!el) return;

    const st = PR_ST[p.status], notStarted = p.status === "open" && now < ms(p.startAt), live = p.status === "open" && now >= ms(p.startAt) && now < ms(p.endAt);

    const total = (p.yes || 0) + (p.no || 0), needVotes = Math.ceil((p.eligible || 1) * (p.quorumPct || 30) / 100);
    const my = MYVOTES[p.id];

    const vbtn = (c, label, sub, col, bg)=> `<button type="button" class="btn vhold" data-v="${esc(p.id)}:${c}" ${canVote ? "" : "disabled"} style="flex:1; position:relative; overflow:hidden; background:${my === c ? col : bg}; color:${my === c ? "#fff" : col}; border:${my === c ? "2px solid #fff" : "1px solid " + col}; touch-action:none; user-select:none; -webkit-user-select:none">${label}<br><small style="font-weight:600">${sub}${my === c ? " · ✓ আপনার ভোট" : ""}</small><i class="vfill"></i></button>`;
    return `<div class="card" ${notStarted ? `style="border-color:var(--amber); box-shadow:0 0 0 2px rgba(255,209,102,.18)"` : ""}>

// ✋ চেপে ধরে ভোট — ১.৫ সেকেন্ড পুরো না হলে ভোট যায় না
function wireHold(btn){
  let t = null;
  const fill = btn.querySelector(".vfill");
  fill.style.cssText = "position:absolute; left:0; bottom:0; height:5px; width:0; background:#fff; border-radius:0 6px 6px 0; pointer-events:none";
  const stop = ()=>{ clearTimeout(t); t = null; fill.style.transition = "none"; fill.style.width = "0"; btn.style.transform = ""; };
  btn.addEventListener("pointerdown", e=>{
    if(btn.disabled || (e.button !== undefined && e.button !== 0)) return;
    e.preventDefault(); stop();
    requestAnimationFrame(()=>{ fill.style.transition = "width 1.5s linear"; fill.style.width = "100%"; });
    btn.style.transform = "scale(.985)";
    t = setTimeout(async ()=>{
      t = null; stop();
      const [pid, choice] = btn.dataset.v.split(":");
      if(navigator.vibrate) try{ navigator.vibrate(40); }catch(e){}
      const r = await busy(btn, ()=> api("vote", { orgId: ORG.id, proposalId: pid, choice }));
      if(r){ MYVOTES[pid] = choice; toast(r.same ? "আপনি আগেই এই ভোট দিয়েছেন" : "🗳️ আপনার ভোট জমা হয়েছে (গোপন)"); drawProps(); }
    }, 1500);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=> btn.addEventListener(ev, ()=>{ if(t) stop(); }));
  btn.addEventListener("contextmenu", e=> e.preventDefault());
}

  const self = ME && m.uid === ME.uid;

    <label class="f">পদবি (যেমন: সভাপতি, সাধারণ সম্পাদক, কোষাধ্যক্ষ)</label>
    <div class="row" style="flex-wrap:nowrap"><input class="in" id="tT" maxlength="40" value="${esc(m.title || "")}"><button class="btn" type="button" id="tGo">সেভ</button></div>
    <div class="small" style="margin-top:4px">পদবি শুধু নাম — সব অ্যাডমিনের ক্ষমতা সমান।</div>
    ${self ? "" : `<div style="margin-top:16px; display:grid; gap:8px">
      ${m.role === "admin" ? `<button class="btn ghost" type="button" data-k="remove_admin">⬇️ অ্যাডমিন থেকে সরিয়ে সাধারণ সদস্য করুন</button>` : `<button class="btn ghost" type="button" data-k="make_admin">⬆️ অ্যাডমিন বানানোর প্রস্তাব</button>`}
      <button class="btn red" type="button" data-k="remove_member">🚫 সদস্যপদ বাতিলের প্রস্তাব</button>
      <div class="small">${need2() === 2 ? "এগুলোতে দুইজন অ্যাডমিনের অনুমোদন লাগবে (যাঁকে নিয়ে কাজ, তিনি বাদে)।" : "এখন অ্যাডমিন একজন — আপনার অনুমোদনেই হবে।"}</div></div>`}
    <div class="row" style="margin-top:14px"><button class="btn ghost full" type="button" data-close>বন্ধ</button></div>`);
  $("tGo").onclick = async ()=>{ const t = $("tT").value.trim(); if(t.length < 2) return toast("পদবি লিখুন"); if(await busy($("tGo"), ()=> api("setTitle", { orgId: ORG.id, uid: m.uid, title: t }))){ toast("✅ পদবি সেভ হয়েছে"); closeModal(); } };
  document.querySelectorAll("#modalBox [data-k]").forEach(b=> b.onclick = async ()=>{
    if(!confirm(ACT_TXT[b.dataset.k] + " — " + m.name + "। নিশ্চিত?")) return;
    const r = await busy(b, ()=> api("adminAction", { orgId: ORG.id, kind: b.dataset.k, uid: m.uid, approve: true }));
    if(r){ closeModal(); toast(r.status === "done" ? "✅ সম্পন্ন হয়েছে" : "✅ প্রস্তাব জমা — আরেকজন অ্যাডমিনের অনুমোদন লাগবে"); }
  });
}

/* ---------- 📝 আবেদন (অ্যাডমিন) ---------- */
let __reqN = 0, __reqList = [];
function watchAdminBits(){
  const oref = db.collection("orgs").doc(CTX);
  __orgUnsubs.push(oref.collection("requests").where("status", "==", "pending").onSnapshot(qs=>{
    __reqList = qs.docs.map(d=> d.data()).sort((a,b)=> ms(a.createdAt) - ms(b.createdAt));
    const changed = __reqN !== __reqList.length; __reqN = __reqList.length;
    if(ORG_TAB === "requests") drawRequests(); else if(ORG_TAB === "home" && isAdmin()){ drawHomeStats(); drawRequests(2); }
    if(changed) renderChrome();
  }, ()=>{}));
  __orgUnsubs.push(oref.collection("adminActions").where("status", "==", "pending").onSnapshot(qs=>{
    ACTIONS = qs.docs.map(d=> d.data()); const ch = __actN !== ACTIONS.length; __actN = ACTIONS.length;
    if(ORG_TAB === "members") drawActions();
    if(ch) renderChrome();
  }, ()=>{}));
}
function tabRequests(){
  $("tabBody").innerHTML = `<div class="card"><div class="h">📝 সদস্য হওয়ার আবেদন</div>
    <div class="small" style="margin-bottom:6px">${need2() === 2 ? "প্রতিটা আবেদনে দুইজন আলাদা অ্যাডমিনের অনুমোদন লাগবে।" : "এখন অ্যাডমিন একজন — আপনার এক অনুমোদনেই সদস্য হবেন। দ্বিতীয় অ্যাডমিন এলে দুইজনের অনুমোদন লাগবে।"}</div>
    <div id="reqList"></div></div>`;
  drawRequests();
}
function drawRequests(limit){
  const el = $("reqList"); if(!el) return;
  el.innerHTML = (limit ? __reqList.slice(0, limit) : __reqList).map(r=>{
    const mine = ME && (r.approvedBy || []).includes(ME.uid);
    return `<div class="item" style="align-items:flex-start">
      <div class="av" style="width:38px; height:38px; font-size:16px; border-radius:50%; overflow:hidden">${r.photo ? `<img src="${esc(r.photo)}" alt="" referrerpolicy="no-referrer" style="width:100%; height:100%; object-fit:cover">` : esc((r.name || "?").slice(0, 1))}</div>
      <div class="grow">
        <b style="font-size:14px">${esc(r.name)}</b>
        <div class="small">📞 <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a> · ${esc(when(r.createdAt))}</div>
        ${r.note ? `<div style="font-size:13px; margin-top:4px">💬 ${esc(r.note)}</div>` : ""}
        <div class="small" style="margin-top:4px">অনুমোদন: <b>${bn((r.approvedBy || []).length)}/${bn(need2())}</b>${(r.approvedNames || []).length ? " — " + esc(r.approvedNames.join(", ")) : ""}</div>
        <div class="row" style="margin-top:8px">
          <button class="btn green" type="button" data-ok="${esc(r.uid)}" ${mine ? "disabled" : ""}>${mine ? "✓ আপনি দিয়েছেন — আরেকজন লাগবে" : "✅ অনুমোদন"}</button>
          <button class="btn red" type="button" data-no="${esc(r.uid)}">❌ বাতিল</button>
        </div>
      </div></div>`;
  }).join("") || `<div class="empty">এখন কোনো আবেদন নেই 🎉</div>`;
  const act = async (b, approve)=>{
    const r = __reqList.find(x=> x.uid === (b.dataset.ok || b.dataset.no));
    if(!approve && !confirm(r.name + "-এর আবেদন বাতিল করবেন?")) return;
    const res = await busy(b, ()=> api("decide", { orgId: ORG.id, uid: r.uid, approve }));
    if(res) toast(!approve ? "আবেদন বাতিল হয়েছে" : res.status === "approved" ? "🎉 " + r.name + " এখন সদস্য (" + memNo(res.memberNo) + ")" : "✅ আপনার অনুমোদন জমা — আরেকজন অ্যাডমিন লাগবে");
  };
  el.querySelectorAll("[data-ok]").forEach(b=> b.onclick = ()=> act(b, true));
  el.querySelectorAll("[data-no]").forEach(b=> b.onclick = ()=> act(b, false));
}

/* ---------- ⚙️ ব্যবস্থাপনা (অ্যাডমিন) ---------- */
function tabManage(){
  const del = ORG.deletion && ORG.deletion.status === "pending" ? ORG.deletion : null;
  const canFinal = del && Date.now() >= ms(del.deadline);
  $("tabBody").innerHTML = `<div class="card"><div class="h">✏️ সংগঠনের তথ্য</div>
      <label class="f">নাম</label><input class="in" id="eN" maxlength="60" value="${esc(ORG.name)}">
      <label class="f">পরিচিতি</label><textarea class="in" id="eD" maxlength="1500">${esc(ORG.desc || "")}</textarea>
      <label class="f">গ্রাম / এলাকা</label><input class="in" id="eA" maxlength="80" value="${esc(ORG.area || "")}">
      <label class="f" style="display:flex; gap:8px; align-items:center"><input type="checkbox" id="eF" ${ORG.publicFinance !== false ? "checked" : ""} style="width:18px; height:18px"> নিশ্চিত হওয়া আয়-ব্যয় সবার জন্য খোলা রাখুন (স্বচ্ছতা)</label>
      <label class="f">প্রস্তাব পাসে ন্যূনতম ভোট (% সদস্য)</label><input class="in" id="eQ" type="number" min="10" max="100" value="${ORG.quorumPct || 30}">
      <button class="btn" type="button" id="eGo" style="margin-top:12px">💾 সেভ করুন</button>
      <div class="small" style="margin-top:6px">যেকোনো একজন অ্যাডমিন এগুলো বদলাতে পারেন — কে কী বদলালেন কাজের খাতায় থাকে।</div></div>
    <div class="card" style="border-color:rgba(226,84,61,.55); background:rgba(226,84,61,.06)">
      <div class="h" style="color:#fca5a5">⚠️ সংগঠন মুছে ফেলা</div>
      <div class="small">অনুরোধ করলে সব সদস্য সতর্কবার্তা দেখবেন আর ১২ ঘণ্টা অপেক্ষা করতে হবে। এর মধ্যে যেকোনো অ্যাডমিন বাতিল করতে পারেন। ১২ ঘণ্টা পরে অ্যাডমিন চূড়ান্তভাবে মুছতে পারবেন — সংগঠন সবার কাছ থেকে লুকিয়ে যাবে, তবে টাকার হিসাব আর কাজের খাতা রেকর্ড হিসেবে সংরক্ষিত থাকবে।</div>
      ${del ? `<div class="notice" style="margin-top:10px">অনুরোধ করেছেন: <b>${esc(del.byName || "")}</b> · বাকি: <b data-cd="${ms(del.deadline)}">${left(ms(del.deadline) - Date.now())}</b></div>
        <div class="row" style="margin-top:10px"><button class="btn green" type="button" id="xCancel">↩️ অনুরোধ বাতিল করুন</button>${canFinal ? `<button class="btn red" type="button" id="xFinal">🗑️ চূড়ান্তভাবে মুছুন</button>` : ""}</div>`
      : `<button class="btn red" type="button" id="xReq" style="margin-top:10px">মুছে ফেলার অনুরোধ</button>`}
    </div>`;
  $("eGo").onclick = async ()=>{ if(await busy($("eGo"), ()=> api("update", { orgId: ORG.id, name: $("eN").value, desc: $("eD").value, area: $("eA").value, publicFinance: $("eF").checked, quorumPct: Number($("eQ").value) }))) toast("✅ সেভ হয়েছে"); };
  if($("xReq")) $("xReq").onclick = async ()=>{ if(!confirm("সংগঠন মুছে ফেলার অনুরোধ শুরু করবেন? সব সদস্য সতর্কবার্তা দেখবেন, ১২ ঘণ্টা অপেক্ষা করতে হবে।")) return; if(await busy($("xReq"), ()=> api("deleteRequest", { orgId: ORG.id }))) toast("অনুরোধ শুরু — ১২ ঘণ্টা গোনা শুরু"); };
  if($("xCancel")) $("xCancel").onclick = async ()=>{ if(await busy($("xCancel"), ()=> api("deleteCancel", { orgId: ORG.id }))) toast("↩️ অনুরোধ বাতিল হয়েছে"); };
  if($("xFinal")) $("xFinal").onclick = async ()=>{ if(prompt("চূড়ান্তভাবে মুছতে সংগঠনের নাম হুবহু লিখুন:") !== ORG.name) return toast("নাম মেলেনি — মোছা হয়নি"); if(await busy($("xFinal"), ()=> api("deleteFinalize", { orgId: ORG.id }))){ toast("সংগঠন মুছে ফেলা হয়েছে"); go("home"); } };
}

/* ---------- 📜 কাজের খাতা (অ্যাডমিন) ---------- */
const LOG_TXT = { org_create:"সংগঠন খুলেছেন", org_update:"সংগঠনের তথ্য বদলেছেন", member_approve_1:"প্রথম অনুমোদন দিয়েছেন", member_approve:"সদস্য গ্রহণ করেছেন", member_reject:"আবেদন বাতিল করেছেন", member_leave:"সংগঠন ছেড়েছেন",
  post_create:"পোস্ট দিয়েছেন", post_edit:"পোস্ট এডিট করেছেন", post_remove:"পোস্ট সরিয়েছেন", money_in:"জমা লিখেছেন", money_out:"খরচ লিখেছেন", money_in_ok:"জমা নিশ্চিত করেছেন", money_out_ok:"খরচ অনুমোদন করেছেন", money_reject:"লেনদেন বাতিল করেছেন",
  proposal_create:"প্রস্তাব দিয়েছেন", proposal_cancel:"প্রস্তাব বাতিল করেছেন", proposal_pass:"প্রস্তাব পাস", proposal_fail:"প্রস্তাব পাস হয়নি", aid_create:"মানবিক সেবা খুলেছেন", aid_update:"মানবিক সেবা বদলেছেন",
  set_title:"পদবি দিয়েছেন", action_propose:"প্রস্তাব/অনুমোদন দিয়েছেন", action_done:"সম্পন্ন করেছেন", action_reject:"প্রস্তাব বাতিল করেছেন", delete_request:"সংগঠন মোছার অনুরোধ করেছেন", delete_cancel:"মোছার অনুরোধ বাতিল করেছেন", org_delete:"সংগঠন মুছেছেন" };
function tabLog(){
  $("tabBody").innerHTML = `<div class="card"><div class="h">📜 কাজের খাতা</div><div class="small" style="margin-bottom:6px">কে কখন কী করেছেন — এই খাতা কেউ বদলাতে বা মুছতে পারেন না।</div><div id="logList"><div class="empty"><span class="spin"></span></div></div></div>`;
  db.collection("orgs").doc(ORG.id).collection("auditLogs").orderBy("at", "desc").limit(100).get().then(qs=>{
    const el = $("logList"); if(!el) return;
    el.innerHTML = qs.docs.map(d=>{ const l = d.data(); return `<div class="item"><div class="grow">
      <b style="font-size:13.5px">${esc(l.actorName || "—")}</b> <span style="font-size:13px">${esc(LOG_TXT[l.action] || l.action)}</span>${l.targetName ? ` — <b style="font-size:13px">${esc(l.targetName)}</b>` : ""}${l.memberNo ? ` <span class="small">(${memNo(l.memberNo)})</span>` : ""}${l.amount ? ` <b style="font-size:13px">${tk(l.amount)}</b>` : ""}
      ${l.detail ? `<div class="small">${esc(l.detail)}</div>` : ""}<div class="small">${esc(when(l.at))}</div></div></div>`; }).join("") || `<div class="empty">এখনো কিছু নেই</div>`;
  }).catch(()=>{ const el = $("logList"); if(el) el.innerHTML = `<div class="empty">লোড করা যায়নি</div>`; });
}


/* ---------- কাউন্টডাউন — প্রতি সেকেন্ডে ---------- */
setInterval(()=>{
  document.querySelectorAll("[data-cd]").forEach(el=> el.textContent = left(Number(el.dataset.cd) - Date.now()));
  if(ORG_TAB === "votes" && PROPS.some(p=> p.status === "open" && [ms(p.startAt), ms(p.endAt)].some(x=> x <= Date.now() && x > Date.now() - 1100))) drawProps();
}, 1000);

/* ---------- শুরু ---------- */
auth.onAuthStateChanged(u=>{
  const r = u && !u.isAnonymous ? u : null;
  const changed = (ME && ME.uid) !== (r && r.uid);
  ME = r ? { uid:r.uid, name:r.displayName || "সদস্য", photo:r.photoURL || null } : null;
  renderMe();
  if(changed || !__idxReady){ MYLIKES = {}; MYVOTES = {}; __myDuesTotal = null; listenIndex(); }
});
</script>
