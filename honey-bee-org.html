<html lang="bn">
<head>
<meta charset="utf-8">

<title>Honey Bee Org</title>
<link rel="icon" href="bazar-icon-192.png">
<!--
  🤝🐝 Honey Bee Org — মানুষের সংগঠন
  · সংগঠন খোলা/খোঁজা, সদস্য আবেদন, দুই-অ্যাডমিন অনুমোদন, সদস্য তালিকা ও পদবি
  · পোস্ট (পাবলিক/শুধু সদস্য, ছবি, নির্ধারিত সময়, মেয়াদ, লাইক, মন্তব্য, শেয়ার)
  · টাকার হিসাব (জমা/খরচ দুই-অ্যাডমিনে নিশ্চিত, আমার চাঁদা), প্রস্তাব ও গোপন ভোট
  · মানবিক সেবা, অ্যাডমিন নিয়োগ/বাদ, সদস্যপদ বাতিল, সংগঠন মোছা (১২ ঘণ্টা অপেক্ষা), কাজের খাতা
  · নিরাপত্তা: এই পাতা থেকে Firestore-এ সরাসরি কিছু লেখা হয় না। সব কাজ Cloud Function
    (functions/org.js) দিয়ে — সার্ভার প্রতিবার যাচাই করে কে অ্যাডমিন, কে সদস্য।
    পড়ার অনুমতিও Firestore rules-এ বাঁধা (সদস্য তালিকা শুধু সদস্যরা দেখেন)।
  · লগইন Bazar-এর একই Google একাউন্ট — আলাদা একাউন্ট লাগে না।
-->
<style>
:root{
  --bg1:#1a1206; --bg2:#3d2405; --gold:#ffb703; --amber:#ffd166;
  --card:#241705; --card2:#2d1d08; --border:rgba(255,209,102,0.22); --ink:#fff8e8;
  --muted:rgba(255,248,232,0.6); --ok:#2fbf71; --danger:#e2543d; --pink:#f472b6;
}
*{box-sizing:border-box}
html,body{margin:0} html{background:#1a1206}
body{min-height:100vh; min-height:100dvh; background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%) fixed; color:var(--ink);
  font-family:"Noto Sans Bengali","Hind Siliguri","Nirmala UI",system-ui,sans-serif; -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
.wrap{max-width:960px; margin:0 auto; padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.back{border:1px solid var(--border); background:transparent; border-radius:10px; padding:7px 12px; color:var(--amber); font-weight:700; font-size:13px}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px}
.brand .lg{position:relative; font-size:24px} .brand .lg i{position:absolute; right:-8px; bottom:-3px; font-size:12px; font-style:normal}
.me{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted)}
.me img{width:30px; height:30px; border-radius:50%; border:1px solid var(--border)}
.card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px}
.h{font-size:15px; font-weight:800; margin:0 0 10px; display:flex; align-items:center; gap:8px}
.small{font-size:12px; color:var(--muted); line-height:1.6}
.btn{border:0; border-radius:12px; padding:11px 16px; font-weight:800; font-size:14px; background:linear-gradient(135deg,var(--amber),var(--gold)); color:var(--bg1)}
.btn.ghost{background:rgba(255,255,255,0.05); color:var(--ink); border:1px solid var(--border)}
.btn.green{background:var(--ok); color:#fff}
.btn.red{background:rgba(226,84,61,0.14); color:#fca5a5; border:1px solid rgba(226,84,61,0.45)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.full{width:100%}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.f{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:12px 0 6px}
.in{width:100%; padding:11px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.06); font-size:14px}
.in:focus{outline:2px solid rgba(255,209,102,0.5)}
select.in option{background:#241705}
textarea.in{min-height:84px; resize:vertical}
.grid{display:grid; grid-template-columns:1fr; gap:10px}
@media(min-width:720px){ .grid{grid-template-columns:1fr 1fr} .wrap{padding-top:22px} }
.org{display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px; cursor:pointer; text-align:left; width:100%}
.org:hover{border-color:rgba(255,209,102,0.5)}
.av{width:44px; height:44px; border-radius:12px; background:rgba(255,209,102,0.14); display:grid; place-items:center; font-size:22px; flex-shrink:0}
.org b{font-size:14.5px} .org .small{margin-top:2px}
.chip{display:inline-block; font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,0.07); color:var(--muted)}
.chip.ok{background:rgba(47,191,113,0.16); color:#86efac} .chip.wait{background:rgba(255,183,3,0.16); color:var(--amber)}
.chip.no{background:rgba(226,84,61,0.16); color:#fca5a5} .chip.admin{background:rgba(244,114,182,0.16); color:#f9a8d4}
.tabs{display:flex; gap:6px; overflow-x:auto; margin:4px 0 12px; padding-bottom:2px}
.tabs button{flex:0 0 auto; border:1px solid var(--border); background:rgba(255,255,255,0.04); border-radius:999px; padding:8px 14px; font-weight:700; font-size:13px; color:var(--ink)}
.tabs button.on{background:linear-gradient(135deg,var(--amber),var(--gold)); color:var(--bg1); border-color:transparent}
.tabs button.soon{opacity:.45}
.item{display:flex; gap:10px; align-items:center; padding:11px 0; border-bottom:1px solid rgba(255,255,255,0.07)}
.item:last-child{border-bottom:0}
.item .grow{flex:1; min-width:0}
.empty{padding:18px; text-align:center; color:var(--muted); font-size:13px}
.notice{padding:11px 12px; border-radius:12px; background:rgba(255,183,3,0.1); border:1px solid rgba(255,183,3,0.3); color:#fde68a; font-size:12.5px; line-height:1.7}
.hero{position:relative; overflow:hidden}
.hero .big{font-size:20px; font-weight:800}
.stats{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.stat{flex:1; min-width:90px; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:12px; padding:9px 10px}
.stat b{display:block; font-size:18px; color:var(--amber)}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#ec4899; color:#fff; padding:11px 16px; border-radius:999px; font-weight:800; font-size:13px; z-index:50; display:none; max-width:92vw; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.4)}
.modal{position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:40; display:none; align-items:flex-end; justify-content:center}
.modal.show{display:flex}
.modal .box{width:100%; max-width:520px; background:#1f1508; border:1px solid var(--border); border-radius:20px 20px 0 0; padding:18px; max-height:92vh; overflow:auto}
@media(min-width:720px){ .modal{align-items:center} .modal .box{border-radius:20px} }
.spin{display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
a{color:var(--amber)}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="bd-locations.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" id="backBtn" type="button">←</button>
    <div class="brand"><span class="lg">🤝<i>🐝</i></span> Honey Bee Org</div>
    <div class="me" id="meBox"></div>
  </div>
  <div id="view"><div class="empty"><span class="spin"></span> লোড হচ্ছে…</div></div>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyD6qmuWkNUrskMIBHq8Z_AQ0N_WT1DL8Is",
  authDomain: "honeybee-984dd.firebaseapp.com",
  projectId: "honeybee-984dd",
  storageBucket: "honeybee-984dd.firebasestorage.app",
  messagingSenderId: "610211112501",
  appId: "1:610211112501:web:9ea40b9060d425e85b737c"
});
const db = firebase.firestore(), auth = firebase.auth(), fns = firebase.functions(), storage = firebase.storage();
const TS = ()=> firebase.firestore.FieldValue.serverTimestamp();
const $ = id=> document.getElementById(id);
const esc = v=> String(v == null ? "" : v).replace(/[&<>"']/g, c=> ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bn = v=> String(v).replace(/\d/g, d=> "০১২৩৪৫৬৭৮৯"[d]);
const tk = n=> "৳ " + bn(Number(n || 0).toLocaleString("en-US"));
const memNo = n=> "HB-" + bn(String(n || 0).padStart(3, "0"));
const ms = t=> t && t.toMillis ? t.toMillis() : 0;
function toast(t, d){ const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(()=> el.style.display = "none", d || 2600); }
function when(ts){ const d = ts && ts.toDate ? ts.toDate() : (typeof ts === "number" ? new Date(ts) : null); return d ? d.toLocaleString("bn-BD", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }) : ""; }
function left(msLeft){ if(msLeft <= 0) return "এখনই"; const t = Math.floor(msLeft / 1000), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return bn((d ? d + " দিন " : "") + String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0")); }
function errText(e){ return (e && e.message && !/^(internal|INTERNAL)$/.test(e.message)) ? e.message : "হয়নি — ইন্টারনেট দেখে আবার চেষ্টা করুন"; }
async function api(action, data){ return (await fns.httpsCallable("orgApi")(Object.assign({ action }, data || {}))).data; }
function districts(){ const l = []; Object.values(BD_LOCATIONS).forEach(dv=> Object.keys(dv).forEach(d=> l.push(d))); return l.sort((a,b)=> a.localeCompare(b, "bn")); }
function upazilas(dist){ let f = []; Object.values(BD_LOCATIONS).forEach(dv=>{ if(dv[dist]) f = dv[dist]; }); return f.slice().sort((a,b)=> a.localeCompare(b, "bn")); }
function openModal(html){ $("modalBox").innerHTML = html; $("modal").classList.add("show"); }
function closeModal(){ $("modal").classList.remove("show"); $("modalBox").innerHTML = ""; }
$("modal").addEventListener("click", e=>{ if(e.target.id === "modal" || e.target.closest("[data-close]")) closeModal(); });
// একটা বোতাম চাপলে সার্ভারে কাজ — চলাকালীন ঘুরন্ত চিহ্ন, ভুল হলে বার্তা
async function busy(btn, fn){
  if(btn){ btn.disabled = true; btn.dataset.t = btn.innerHTML; btn.innerHTML = `<span class="spin"></span>`; }
  try{ return await fn(); }
  catch(e){ toast(errText(e), 3600); return null; }
  finally{ if(btn && document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = btn.dataset.t; } }
}
function digits(v){ return String(v || "").replace(/[০-৯]/g, c=> "০১২৩৪৫৬৭৮৯".indexOf(c)); }

/* ---------- লগইন (Bazar-এর একই Google একাউন্ট) ---------- */
let ME = null;
async function login(){
  const p = new firebase.auth.GoogleAuthProvider();
  try{ await auth.signInWithPopup(p); }
  catch(e){ if(/popup-blocked|cancelled-popup-request|operation-not-supported/.test(e.code || "")) auth.signInWithRedirect(p); else if(e.code !== "auth/popup-closed-by-user") toast("লগইন হয়নি — আবার চেষ্টা করুন"); }
}
function needLogin(msg){
  if(ME) return false;
  openModal(`<div class="h">🔐 Google দিয়ে লগইন করুন</div>
    <div class="small">${esc(msg || "এই কাজ করতে লগইন লাগবে।")} Honey Bee Bazar-এর একই একাউন্ট — আলাদা একাউন্ট লাগবে না।</div>
    <div class="row" style="margin-top:14px"><button class="btn ghost" data-close type="button">পরে</button><button class="btn" id="lgGo" type="button" style="flex:1">🔵 Google দিয়ে লগইন</button></div>`);
  $("lgGo").onclick = ()=>{ closeModal(); login(); };
  return true;
}
function renderMe(){
  $("meBox").innerHTML = ME
    ? `${ME.photo ? `<img src="${esc(ME.photo)}" alt="" referrerpolicy="no-referrer">` : "👤"}<span style="max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(ME.name)}</span>`
    : `<button class="btn ghost" type="button" style="padding:7px 12px; font-size:12.5px" onclick="login()">🔵 লগইন</button>`;
}

/* ---------- আমার সংগঠন (সার্ভার যা লিখে রাখে — orgUserIndex) ---------- */
let MYIDX = { orgs:{}, applied:{} }, __idxUnsub = null;
function listenIndex(){
  if(__idxUnsub){ __idxUnsub(); __idxUnsub = null; }
  MYIDX = { orgs:{}, applied:{} };
  if(!ME) return;
  __idxUnsub = db.collection("orgUserIndex").doc(ME.uid).onSnapshot(d=>{
    const x = d.exists ? d.data() : {};
    MYIDX = { orgs: x.orgs || {}, applied: x.applied || {} };
    if(ROUTE.page === "home") renderHomeMine();
  }, ()=>{});
}

/* ---------- পাতা বদল (#org=ID[&post=PID] থাকলে সরাসরি সেই সংগঠন) ---------- */
let ROUTE = { page:"home" };
function go(page, arg, tab){
  ROUTE = { page, arg };
  try{ history.replaceState(null, "", page === "org" ? "#org=" + arg : location.pathname); }catch(e){}
  window.scrollTo(0, 0);
  if(page === "org") pageOrg(arg, tab); else if(page === "create") pageCreate(); else { stopOrg(); pageHome(); }
}
$("backBtn").onclick = ()=>{
  if(ROUTE.page !== "home"){ go("home"); return; }
  if(document.referrer && /honey-bee-bazar/.test(document.referrer) && history.length > 1) history.back();
  else location.href = "honey-bee-bazar.html";
};

/* =====================================================================
   🏠 হোম — আমার সংগঠন + খোঁজা + নতুন সংগঠন
   ===================================================================== */
let SEARCH = { d:"", u:"", q:"" };
try{ const a = JSON.parse(localStorage.getItem("hbOrgArea") || "null") || JSON.parse(localStorage.getItem("hbPhArea") || "null"); if(a && a.d){ SEARCH.d = a.d; SEARCH.u = a.u || ""; } }catch(e){}
function pageHome(){
  $("view").innerHTML = `
    <div class="card hero">
      <div class="big">মানুষের পাশে, একসাথে 🤝</div>
      <div class="small" style="margin-top:4px">আপনার এলাকার সংগঠন খুঁজুন, সদস্য হোন, অথবা নিজেই নতুন সংগঠন খুলুন। সদস্য গ্রহণ, টাকা, অ্যাডমিন নিয়োগ — সবকিছুতে দুইজন অ্যাডমিনের অনুমোদন লাগে; খরচ হয় সদস্যদের ভোটে।</div>
      <div class="row" style="margin-top:12px"><button class="btn" type="button" id="newOrgBtn">➕ নতুন সংগঠন খুলুন</button></div>
    </div>
    <div id="mine"></div>
    <div class="card">
      <div class="h">🔎 সংগঠন খুঁজুন</div>
      <div class="row">
        <select class="in" id="sD" style="flex:1; min-width:130px"><option value="">সব জেলা</option>${districts().map(d=> `<option${d === SEARCH.d ? " selected" : ""}>${esc(d)}</option>`).join("")}</select>
        <select class="in" id="sU" style="flex:1; min-width:130px"></select>
      </div>
      <input class="in" id="sQ" placeholder="সংগঠনের নাম লিখুন…" value="${esc(SEARCH.q)}" style="margin-top:8px">
      <div id="results" style="margin-top:12px"><div class="empty"><span class="spin"></span></div></div>
    </div>`;
  $("newOrgBtn").onclick = ()=>{ if(!needLogin("নতুন সংগঠন খুলতে")) go("create"); };
  const fillU = ()=>{ $("sU").innerHTML = `<option value="">সব উপজেলা/থানা</option>` + (SEARCH.d ? upazilas(SEARCH.d).map(u=> `<option${u === SEARCH.u ? " selected" : ""}>${esc(u)}</option>`).join("") : ""); $("sU").disabled = !SEARCH.d; };
  fillU();
  const save = ()=>{ try{ localStorage.setItem("hbOrgArea", JSON.stringify({ d:SEARCH.d, u:SEARCH.u })); }catch(e){} };
  $("sD").onchange = ()=>{ SEARCH.d = $("sD").value; SEARCH.u = ""; fillU(); save(); runSearch(); };
  $("sU").onchange = ()=>{ SEARCH.u = $("sU").value; save(); runSearch(); };
  let t; $("sQ").oninput = ()=>{ SEARCH.q = $("sQ").value; clearTimeout(t); t = setTimeout(renderResults, 200); };
  renderHomeMine();
  runSearch();
}
function orgCardHtml(o, extra, short){
  return `<button type="button" class="org" data-org="${esc(o.id)}">
    <div class="av">🤝</div>
    <div style="flex:1; min-width:0">
      <b>${esc(o.name)}</b> ${extra || ""}
      ${short ? "" : `<div class="small">📍 ${esc([o.upazila, o.district].filter(Boolean).join(", "))} · 👥 ${bn(o.memberCount || 0)} সদস্য</div>
      <div class="small" style="display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden">${esc(o.desc || "")}</div>`}
    </div></button>`;
}
function wireOrgCards(root){ root.querySelectorAll("[data-org]").forEach(b=> b.onclick = ()=> go("org", b.dataset.org)); }
function renderHomeMine(){
  const el = $("mine"); if(!el) return;
  if(!ME){ el.innerHTML = ""; return; }
  const mine = Object.entries(MYIDX.orgs || {}), applied = Object.entries(MYIDX.applied || {});
  if(!mine.length && !applied.length){ el.innerHTML = ""; return; }
  el.innerHTML = `<div class="card"><div class="h">⭐ আমার সংগঠন</div><div class="grid">
    ${mine.map(([id, o])=> orgCardHtml({ id, name:o.name }, o.role === "admin" ? `<span class="chip admin">অ্যাডমিন</span>` : `<span class="chip ok">সদস্য</span>`, true)).join("")}
    ${applied.map(([id, o])=> orgCardHtml({ id, name:o.name }, `<span class="chip wait">আবেদন অপেক্ষায়</span>`, true)).join("")}
  </div></div>`;
  wireOrgCards(el);
}
let RESULTS = [], __seq = 0;
async function runSearch(){
  const seq = ++__seq;
  const el = $("results"); if(!el) return;
  el.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  try{
    let q = db.collection("orgs").where("status", "==", "active");
    if(SEARCH.d) q = q.where("district", "==", SEARCH.d);
    if(SEARCH.d && SEARCH.u) q = q.where("upazila", "==", SEARCH.u);
    const qs = await q.limit(200).get();
    if(seq !== __seq) return;
    RESULTS = qs.docs.map(d=> ({ id:d.id, ...d.data() })).sort((a,b)=> (b.memberCount || 0) - (a.memberCount || 0));

/* ✍️ নতুন পোস্ট — ছবি ফোনেই WebP ১০০ KB-এর নিচে বানানো হয় */
async function makeWebp(file, maxBytes){
  if(!file || !/^image\//.test(file.type)) throw new Error("শুধু ছবি দেওয়া যাবে");
  const img = await new Promise((res, rej)=>{ const im = new Image(), u = URL.createObjectURL(file); im.onload = ()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error("ছবি খোলা যায়নি")); }; im.src = u; });
  let w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, 1280 / Math.max(w, h)); w = Math.round(w * sc); h = Math.round(h * sc);
  const draw = (q)=> new Promise(r=>{ const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); c.toBlob(r, "image/webp", q); });
  let blob = null;
  for(let i = 0; i < 14; i++){
    blob = await draw(i < 5 ? 0.82 - i * 0.09 : 0.42);
    if(blob && blob.size <= maxBytes) break;
    if(i >= 4){ w = Math.round(w * 0.84); h = Math.round(h * 0.84); }
  }
  if(!blob || blob.type !== "image/webp") throw new Error("এই ফোনে ছবি তৈরি করা যায়নি");
  if(blob.size > maxBytes) throw new Error("ছবিটা ছোট করা গেল না — অন্য ছবি দিন");
  return blob;
}

function drawProps(){

      <div class="notice" style="margin-top:10px"><b>কেন এই খরচ?</b><div style="white-space:pre-wrap; margin:4px 0">${esc(p.reason)}</div><b>প্রস্তাবিত খরচ: ${tk(p.amount)}</b>${p.evidence ? `<div class="small" style="color:#fde68a; margin-top:4px">📎 প্রমাণ: ${esc(p.evidence)}</div>` : ""}</div>

      <div class="small" style="margin-top:8px">পাসের শর্ত: কমপক্ষে ${bn(needVotes)} জনের ভোট (${bn(p.quorumPct || 30)}%), আর "হ্যাঁ" "না"-এর চেয়ে ${bn(p.thresholdPct || 5)}% বেশি · ভোটের সময় ${bn(p.hours || 24)} ঘণ্টা</div>
      ${p.status === "open" ? `<div class="row" style="margin-top:10px; flex-wrap:nowrap">${vbtn("yes", "👍 হ্যাঁ", "অনুমোদন", "#16a34a", "rgba(22,163,74,.12)")}${vbtn("no", "👎 না", "প্রত্যাখ্যান", "#ef4444", "rgba(239,68,68,.1)")}</div>

}
// ✋ চেপে ধরে ভোট — ১.৫ সেকেন্ড পুরো না হলে ভোট যায় না
function wireHold(btn){
  let t = null;
  const fill = btn.querySelector(".vfill");
  fill.style.cssText = "position:absolute; left:0; bottom:0; height:5px; width:0; background:#fff; border-radius:0 6px 6px 0; pointer-events:none";
  const stop = ()=>{ clearTimeout(t); t = null; fill.style.transition = "none"; fill.style.width = "0"; btn.style.transform = ""; };
  btn.addEventListener("pointerdown", e=>{
    if(btn.disabled || (e.button !== undefined && e.button !== 0)) return;
    e.preventDefault(); stop();
    requestAnimationFrame(()=>{ fill.style.transition = "width 1.5s linear"; fill.style.width = "100%"; });
    btn.style.transform = "scale(.985)";
    t = setTimeout(async ()=>{
      t = null; stop();
      const [pid, choice] = btn.dataset.v.split(":");
      if(navigator.vibrate) try{ navigator.vibrate(40); }catch(e){}
      const r = await busy(btn, ()=> api("vote", { orgId: ORG.id, proposalId: pid, choice }));
      if(r){ MYVOTES[pid] = choice; toast(r.same ? "আপনি আগেই এই ভোট দিয়েছেন" : "🗳️ আপনার ভোট জমা হয়েছে (গোপন)"); drawProps(); }
    }, 1500);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=> btn.addEventListener(ev, ()=>{ if(t) stop(); }));
  btn.addEventListener("contextmenu", e=> e.preventDefault());
}

    <div class="card" style="border-color:rgba(226,84,61,.55); background:rgba(226,84,61,.06)">
      <div class="h" style="color:#fca5a5">⚠️ সংগঠন মুছে ফেলা</div>
      <div class="small">অনুরোধ করলে সব সদস্য সতর্কবার্তা দেখবেন আর ১২ ঘণ্টা অপেক্ষা করতে হবে। এর মধ্যে যেকোনো অ্যাডমিন বাতিল করতে পারেন। ১২ ঘণ্টা পরে অ্যাডমিন চূড়ান্তভাবে মুছতে পারবেন — সংগঠন সবার কাছ থেকে লুকিয়ে যাবে, তবে টাকার হিসাব আর কাজের খাতা রেকর্ড হিসেবে সংরক্ষিত থাকবে।</div>
      ${del ? `<div class="notice" style="margin-top:10px">অনুরোধ করেছেন: <b>${esc(del.byName || "")}</b> · বাকি: <b data-cd="${ms(del.deadline)}">${left(ms(del.deadline) - Date.now())}</b></div>
        <div class="row" style="margin-top:10px"><button class="btn green" type="button" id="xCancel">↩️ অনুরোধ বাতিল করুন</button>${canFinal ? `<button class="btn red" type="button" id="xFinal">🗑️ চূড়ান্তভাবে মুছুন</button>` : ""}</div>`
      : `<button class="btn red" type="button" id="xReq" style="margin-top:10px">মুছে ফেলার অনুরোধ</button>`}
    </div>`;
  $("eGo").onclick = async ()=>{ if(await busy($("eGo"), ()=> api("update", { orgId: ORG.id, name: $("eN").value, desc: $("eD").value, area: $("eA").value, publicFinance: $("eF").checked, quorumPct: Number($("eQ").value) }))) toast("✅ সেভ হয়েছে"); };
  if($("xReq")) $("xReq").onclick = async ()=>{ if(!confirm("সংগঠন মুছে ফেলার অনুরোধ শুরু করবেন? সব সদস্য সতর্কবার্তা দেখবেন, ১২ ঘণ্টা অপেক্ষা করতে হবে।")) return; if(await busy($("xReq"), ()=> api("deleteRequest", { orgId: ORG.id }))) toast("অনুরোধ শুরু — ১২ ঘণ্টা গোনা শুরু"); };
  if($("xCancel")) $("xCancel").onclick = async ()=>{ if(await busy($("xCancel"), ()=> api("deleteCancel", { orgId: ORG.id }))) toast("↩️ অনুরোধ বাতিল হয়েছে"); };
  if($("xFinal")) $("xFinal").onclick = async ()=>{ if(prompt("চূড়ান্তভাবে মুছতে সংগঠনের নাম হুবহু লিখুন:") !== ORG.name) return toast("নাম মেলেনি — মোছা হয়নি"); if(await busy($("xFinal"), ()=> api("deleteFinalize", { orgId: ORG.id }))){ toast("সংগঠন মুছে ফেলা হয়েছে"); go("home"); } };
}

/* ---------- 📜 কাজের খাতা (অ্যাডমিন) ---------- */
const LOG_TXT = { org_create:"সংগঠন খুলেছেন", org_update:"সংগঠনের তথ্য বদলেছেন", member_approve_1:"প্রথম অনুমোদন দিয়েছেন", member_approve:"সদস্য গ্রহণ করেছেন", member_reject:"আবেদন বাতিল করেছেন", member_leave:"সংগঠন ছেড়েছেন",
  post_create:"পোস্ট দিয়েছেন", post_remove:"পোস্ট সরিয়েছেন", money_in:"জমা লিখেছেন", money_out:"খরচ লিখেছেন", money_in_ok:"জমা নিশ্চিত করেছেন", money_out_ok:"খরচ অনুমোদন করেছেন", money_reject:"লেনদেন বাতিল করেছেন",
  proposal_create:"প্রস্তাব দিয়েছেন", proposal_cancel:"প্রস্তাব বাতিল করেছেন", proposal_pass:"প্রস্তাব পাস", proposal_fail:"প্রস্তাব পাস হয়নি", aid_create:"মানবিক সেবা খুলেছেন", aid_update:"মানবিক সেবা বদলেছেন",
  set_title:"পদবি দিয়েছেন", action_propose:"প্রস্তাব/অনুমোদন দিয়েছেন", action_done:"সম্পন্ন করেছেন", action_reject:"প্রস্তাব বাতিল করেছেন", delete_request:"সংগঠন মোছার অনুরোধ করেছেন", delete_cancel:"মোছার অনুরোধ বাতিল করেছেন", org_delete:"সংগঠন মুছেছেন" };
function tabLog(){
  $("tabBody").innerHTML = `<div class="card"><div class="h">📜 কাজের খাতা</div><div class="small" style="margin-bottom:6px">কে কখন কী করেছেন — এই খাতা কেউ বদলাতে বা মুছতে পারেন না।</div><div id="logList"><div class="empty"><span class="spin"></span></div></div></div>`;
  db.collection("orgs").doc(ORG.id).collection("auditLogs").orderBy("at", "desc").limit(100).get().then(qs=>{
    const el = $("logList"); if(!el) return;
    el.innerHTML = qs.docs.map(d=>{ const l = d.data(); return `<div class="item"><div class="grow">
      <b style="font-size:13.5px">${esc(l.actorName || "—")}</b> <span style="font-size:13px">${esc(LOG_TXT[l.action] || l.action)}</span>${l.targetName ? ` — <b style="font-size:13px">${esc(l.targetName)}</b>` : ""}${l.memberNo ? ` <span class="small">(${memNo(l.memberNo)})</span>` : ""}${l.amount ? ` <b style="font-size:13px">${tk(l.amount)}</b>` : ""}
      ${l.detail ? `<div class="small">${esc(l.detail)}</div>` : ""}<div class="small">${esc(when(l.at))}</div></div></div>`; }).join("") || `<div class="empty">এখনো কিছু নেই</div>`;
  }).catch(()=>{ const el = $("logList"); if(el) el.innerHTML = `<div class="empty">লোড করা যায়নি</div>`; });
}

/* ---------- কাউন্টডাউন — প্রতি সেকেন্ডে ---------- */
setInterval(()=>{
  document.querySelectorAll("[data-cd]").forEach(el=> el.textContent = left(Number(el.dataset.cd) - Date.now()));
  // শুরু/শেষের মুহূর্ত পার হলে প্রস্তাবের অবস্থা নতুন করে দেখানো
  if(ORG_TAB === "votes" && PROPS.some(p=> p.status === "open" && [ms(p.startAt), ms(p.endAt)].some(t=> t <= Date.now() && t > Date.now() - 1100))) drawProps();
}, 1000);

/* ---------- শুরু ---------- */
let __started = false;
auth.onAuthStateChanged(u=>{
  const r = u && !u.isAnonymous ? u : null;
  ME = r ? { uid:r.uid, name:r.displayName || "সদস্য", photo:r.photoURL || null } : null;
  renderMe(); listenIndex(); MYLIKES = {}; MYVOTES = {};
  if(!__started){
    __started = true;
    const m = /#org=([A-Za-z0-9]{10,40})/.exec(location.hash);
    const pm = /[#&]post=([A-Za-z0-9]+)/.exec(location.hash);
    go(m ? "org" : "home", m ? m[1] : undefined, pm ? "posts" : undefined);
    if(pm) try{ history.replaceState(null, "", "#org=" + m[1] + "&post=" + pm[1]); }catch(e){}
  }else if(ROUTE.page === "org") pageOrg(ROUTE.arg, ORG_TAB);
  else if(ROUTE.page === "home") renderHomeMine();
});
</script>
</body>
</html>
