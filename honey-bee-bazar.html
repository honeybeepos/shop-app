<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐝 Honey Bee Bazar</title>
<meta name="theme-color" content="#1a1206">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg1:#1a1206; --bg2:#3d2405; --gold:#ffb703; --amber:#ffd166;
    --card:#241705; --border:rgba(255,209,102,0.22); --danger:#e2543d; --ok:#2fbf71; --muted:rgba(255,248,232,0.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,183,3,0.16), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(255,209,102,0.10), transparent 40%),
      linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    color:#fff8e8; font-family:'Noto Sans Bengali','Space Mono',sans-serif;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:20px 16px 50px; }

  header{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }

  #authArea{ display:flex; align-items:center; gap:8px; }
  .googleLoginBtn{
    display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:20px;
    background:#fff; color:#1a1206; font-size:12px; font-weight:700; cursor:pointer;
    border:1px solid var(--border); font-family:inherit;
  }
  .userChip{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .userChip img{ width:28px; height:28px; border-radius:50%; }
  .userChip span{ font-size:11.5px; color:var(--muted); }

  .favHeart{ font-size:18px; cursor:pointer; flex-shrink:0; }

  .productImgWrap{ width:44px; height:44px; border-radius:10px; overflow:hidden; flex-shrink:0; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .productImgWrap img{ width:100%; height:100%; object-fit:cover; }
  header .hex{ font-size:34px; }
  header h1{ margin:0; font-size:18px; font-weight:800; }
  header p{ margin:2px 0 0; font-size:10.5px; color:var(--amber); letter-spacing:1.3px; text-transform:uppercase; opacity:0.85; }
  .backBtn{
    background:transparent; border:1px solid var(--border); color:var(--muted); padding:8px 12px;
    border-radius:9px; font-size:12px; cursor:pointer; font-family:inherit; margin-bottom:14px;
  }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px;
    margin-bottom:12px; box-shadow:0 8px 20px rgba(0,0,0,0.28);
  }

  .searchBox{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
    background:rgba(255,255,255,0.06); color:#fff8e8; font-family:inherit; font-size:14px; margin-bottom:16px;
  }
  .searchBox:focus{ outline:2px solid var(--gold); outline-offset:1px; }

  .marketItem, .shopItem{
    display:flex; align-items:center; gap:12px; padding:14px; cursor:pointer;
  }
  .marketItem .ic, .shopItem .ic{ font-size:26px; flex-shrink:0; }
  .marketItem .info, .shopItem .info{ flex:1; min-width:0; }
  .marketItem .name, .shopItem .name{ font-weight:700; font-size:14.5px; }
  .marketItem .meta, .shopItem .meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .chev{ color:var(--muted); font-size:16px; }

  .productRow{
    display:flex; align-items:center; justify-content:space-between; padding:13px 14px;
    border-bottom:1px solid var(--border);
  }
  .productRow:last-child{ border-bottom:none; }
  .productRow .pname{ font-size:14px; font-weight:600; }
  .productRow .pstock{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .stockBadge{ font-size:11px; padding:4px 10px; border-radius:20px; font-weight:700; flex-shrink:0; }
  .stockBadge.in{ background:rgba(47,191,113,0.18); color:var(--ok); }
  .stockBadge.low{ background:rgba(255,209,102,0.18); color:var(--amber); }
  .stockBadge.out{ background:rgba(226,84,61,0.18); color:var(--danger); }

  .emptyMsg{ text-align:center; color:var(--muted); font-size:12.5px; padding:30px 12px; }
  .loadingMsg{ text-align:center; color:var(--muted); font-size:12.5px; padding:20px; }

  #screenMarkets, #screenShops, #screenProducts{ display:none; }
  #screenMarkets.active, #screenShops.active, #screenProducts.active{ display:block; }
</style>
<script src="bd-locations.js"></script>
</head>
<body>
<div class="wrap">

  <header>
    <div class="hex">🐝</div>
    <div>
      <h1>Honey Bee Bazar</h1>
      <p>Browse Markets &amp; Shops</p>
    </div>
    <div id="authArea" style="margin-left:auto;"></div>
  </header>

  <!-- ধাপ ১: বাজার নির্বাচন -->
  <div id="screenMarkets" class="active">
    <div id="gpsStatusBanner" style="font-size:11.5px; color:var(--muted); margin-bottom:10px;"></div>

    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <select id="districtFilter" style="flex:1; padding:11px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.06); color:#fff8e8; font-family:inherit; font-size:13px;">
        <option value="">সব জেলা</option>
      </select>
      <select id="upazilaFilter" style="flex:1; padding:11px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.06); color:#fff8e8; font-family:inherit; font-size:13px;" disabled>
        <option value="">সব উপজেলা</option>
      </select>
    </div>

    <input type="text" class="searchBox" id="marketSearch" placeholder="🔍 বাজারের নাম দিয়ে খুঁজুন...">
    <div id="marketsList"><div class="loadingMsg">বাজারের তালিকা লোড হচ্ছে...</div></div>
  </div>

  <!-- ধাপ ২: দোকানের তালিকা -->
  <div id="screenShops">
    <button class="backBtn" id="backToMarkets">← বাজার পরিবর্তন করুন</button>
    <div class="card" style="text-align:center; padding:12px;">
      <div style="font-size:13px; color:var(--muted);">বাজার</div>
      <div style="font-size:16px; font-weight:800; color:var(--amber);" id="currentMarketName">—</div>
    </div>
    <input type="text" class="searchBox" id="shopSearch" placeholder="🔍 দোকান খুঁজুন...">
    <div id="shopsList"><div class="loadingMsg">দোকানের তালিকা লোড হচ্ছে...</div></div>
  </div>

  <!-- ধাপ ৩: প্রোডাক্ট/স্টক -->
  <div id="screenProducts">
    <button class="backBtn" id="backToShops">← দোকানের তালিকায় ফিরে যান</button>
    <div class="card" style="text-align:center; padding:12px;">
      <div style="font-size:13px; color:var(--muted);">দোকান</div>
      <div style="font-size:16px; font-weight:800; color:var(--amber);" id="currentShopName">—</div>
    </div>
    <div class="card" style="padding:0; overflow:hidden;">
      <div id="productsList"><div class="loadingMsg">স্টক লোড হচ্ছে...</div></div>
    </div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD6qmuWkNUrskMIBHq8Z_AQ0N_WT1DL8Is",
  authDomain: "honeybee-984dd.firebaseapp.com",
  projectId: "honeybee-984dd",
  storageBucket: "honeybee-984dd.firebasestorage.app",
  messagingSenderId: "610211112501",
  appId: "1:610211112501:web:9ea40b9060d425e85b737c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const googleProvider = new firebase.auth.GoogleAuthProvider();

let currentCustomer = null; // { uid, name, email, photoURL, favoriteShops:[], addresses:[] }

/* ---------- 🔐 Google দিয়ে লগইন — কাস্টমারের অর্ডার/পছন্দ UID-এর সাথে বাঁধা ---------- */
function renderAuthArea(){
  const area = document.getElementById("authArea");
  if(currentCustomer){
    area.innerHTML = `
      <div class="userChip" id="userChipBtn">
        <img src="${currentCustomer.photoURL || ''}" onerror="this.style.display='none'">
        <span>${escapeHtml(currentCustomer.name || 'কাস্টমার')}</span>
      </div>`;
    document.getElementById("userChipBtn").addEventListener("click", ()=>{
      if(confirm("লগআউট করবেন?")) auth.signOut();
    });
  }else{
    area.innerHTML = `<div class="googleLoginBtn" id="googleLoginBtn">🔵 Google দিয়ে লগইন</div>`;
    document.getElementById("googleLoginBtn").addEventListener("click", async ()=>{
      try{ await auth.signInWithPopup(googleProvider); }
      catch(e){
        // পপ-আপ ব্লক হলে (মোবাইলে প্রায়ই হয়) রিডাইরেক্ট দিয়ে ফলব্যাক
        if(e.code === "auth/popup-blocked" || e.code === "auth/cancelled-popup-request"){
          auth.signInWithRedirect(googleProvider);
        }else{
          console.error(e);
        }
      }
    });
  }
}

auth.onAuthStateChanged(async (user)=>{
  if(!user){ currentCustomer = null; renderAuthArea(); return; }
  try{
    const ref = db.collection("customers").doc(user.uid);
    const doc = await ref.get();
    const profile = {
      name: user.displayName, email: user.email, photoURL: user.photoURL,
      lastLoginAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if(!doc.exists){
      profile.favoriteShops = [];
      profile.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    }
    await ref.set(profile, { merge: true });
    const fresh = await ref.get();
    currentCustomer = { uid: user.uid, ...fresh.data() };
  }catch(e){
    console.error("customer profile sync failed:", e);
    currentCustomer = { uid: user.uid, name: user.displayName, favoriteShops: [] };
  }
  renderAuthArea();
});

renderAuthArea();

function $(id){ return document.getElementById(id); }
let allMarkets = [];
let allShops = [];
let currentMarketId = null, currentShopId = null;
let userLatLng = null;

function showScreen(id){
  ["screenMarkets","screenShops","screenProducts"].forEach(s=> $(s).classList.remove("active"));
  $(id).classList.add("active");
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}

function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ---------- 📍 GPS অটো-লোকেশন — সবচেয়ে কাছের বাজার আগে দেখানোর জন্য ---------- */
function requestGpsLocation(){
  if(!navigator.geolocation){
    $("gpsStatusBanner").textContent = "";
    return;
  }
  $("gpsStatusBanner").textContent = "📍 আপনার কাছের বাজার খোঁজা হচ্ছে...";
  navigator.geolocation.getCurrentPosition((pos)=>{
    userLatLng = [pos.coords.latitude, pos.coords.longitude];
    $("gpsStatusBanner").textContent = "📍 আপনার কাছের বাজার আগে দেখানো হচ্ছে";
    renderMarkets(getFilteredMarkets());
  }, ()=>{
    $("gpsStatusBanner").textContent = "";
  }, { enableHighAccuracy: true, timeout: 10000 });
}

/* ---------- জেলা/উপজেলা ম্যানুয়াল ফিল্টার ---------- */
function getAllDistricts(){
  const list = [];
  Object.values(BD_LOCATIONS).forEach(div => Object.keys(div).forEach(d => list.push(d)));
  return list.sort((a,b)=> a.localeCompare(b, 'bn'));
}
function getUpazilasForDistrict(district){
  let found = [];
  Object.values(BD_LOCATIONS).forEach(div => { if(div[district]) found = div[district]; });
  return found.slice().sort((a,b)=> a.localeCompare(b, 'bn'));
}
$("districtFilter").innerHTML += getAllDistricts().map(d=>`<option value="${d}">${d}</option>`).join("");
$("districtFilter").addEventListener("change", (e)=>{
  const district = e.target.value;
  const upSel = $("upazilaFilter");
  if(!district){
    upSel.innerHTML = '<option value="">সব উপজেলা</option>';
    upSel.disabled = true;
  }else{
    upSel.disabled = false;
    upSel.innerHTML = '<option value="">সব উপজেলা</option>' +
      getUpazilasForDistrict(district).map(u=>`<option value="${u}">${u}</option>`).join("");
  }
  renderMarkets(getFilteredMarkets());
});
$("upazilaFilter").addEventListener("change", ()=> renderMarkets(getFilteredMarkets()));

function getFilteredMarkets(){
  const district = $("districtFilter").value;
  const upazila = $("upazilaFilter").value;
  const q = $("marketSearch").value.trim().toLowerCase();
  return allMarkets.filter(m=>
    (!district || m.district === district) &&
    (!upazila || m.upazila === upazila) &&
    (!q || (m.name||"").toLowerCase().includes(q))
  );
}

/* ---------- ধাপ ১: বাজারের তালিকা ---------- */
async function loadMarkets(){
  try{
    const qs = await db.collection("markets").orderBy("name").get();
    allMarkets = qs.docs.map(d=> ({ id: d.id, ...d.data() }));
    renderMarkets(allMarkets);
    requestGpsLocation();
  }catch(e){
    console.error(e);
    $("marketsList").innerHTML = '<div class="emptyMsg">বাজারের তালিকা লোড করা যায়নি — ইন্টারনেট চেক করুন।</div>';
  }
}

function renderMarkets(list){
  if(list.length === 0){
    $("marketsList").innerHTML = '<div class="emptyMsg">এই তালিকায় কোনো বাজার পাওয়া যায়নি।</div>';
    return;
  }

  let sorted = list;
  if(userLatLng){
    sorted = list.map(m=>{
      const dist = (m.location && m.location.lat != null)
        ? haversineKm(userLatLng[0], userLatLng[1], m.location.lat, m.location.lng)
        : null;
      return { ...m, __dist: dist };
    }).sort((a,b)=>{
      if(a.__dist == null && b.__dist == null) return 0;
      if(a.__dist == null) return 1;
      if(b.__dist == null) return -1;
      return a.__dist - b.__dist;
    });
  }

  $("marketsList").innerHTML = sorted.map(m => `
    <div class="card marketItem" onclick="selectMarket('${m.id}')">
      <div class="ic">🏙️</div>
      <div class="info">
        <div class="name">${escapeHtml(m.name || m.id)}</div>
        <div class="meta">${escapeHtml(m.upazila || "")}${m.district ? ", " + escapeHtml(m.district) : ""}${m.__dist != null ? " · " + m.__dist.toFixed(1) + " কিমি দূরে" : ""}</div>
      </div>
      <div class="chev">›</div>
    </div>`).join("");
}

$("marketSearch").addEventListener("input", ()=>{
  renderMarkets(getFilteredMarkets());
});

window.selectMarket = function(marketId){
  currentMarketId = marketId;
  const market = allMarkets.find(m=> m.id === marketId);
  $("currentMarketName").textContent = market ? (market.name || marketId) : marketId;
  showScreen("screenShops");
  loadShops(marketId);
};

$("backToMarkets").addEventListener("click", ()=> showScreen("screenMarkets"));

/* ---------- ধাপ ২: দোকানের তালিকা ---------- */
let shopsUnsub = null;
function loadShops(marketId){
  $("shopsList").innerHTML = '<div class="loadingMsg">দোকানের তালিকা লোড হচ্ছে...</div>';
  if(shopsUnsub) shopsUnsub();
  // রিয়েল-টাইম লিসেনার — দোকান নতুন অনুমোদন/আপডেট হলে সাথে সাথেই এখানে দেখাবে
  shopsUnsub = db.collection("shops")
    .where("marketId", "==", marketId)
    .where("status", "==", "active")
    .onSnapshot((qs)=>{
      allShops = qs.docs.map(d=> ({ id: d.id, ...d.data() }));
      renderShops(getFilteredShops());
    }, (e)=>{
      console.error(e);
      $("shopsList").innerHTML = '<div class="emptyMsg">দোকানের তালিকা লোড করা যায়নি।</div>';
    });
}

function getFilteredShops(){
  const q = ($("shopSearch") ? $("shopSearch").value : "").trim().toLowerCase();
  if(!q) return allShops;
  return allShops.filter(s => (s.name||s.shopName||"").toLowerCase().includes(q));
}

function renderShops(list){
  if(list.length === 0){
    $("shopsList").innerHTML = '<div class="emptyMsg">এই বাজারে এখনো কোনো সক্রিয় দোকান নেই।</div>';
    return;
  }
  const favs = (currentCustomer && currentCustomer.favoriteShops) || [];
  $("shopsList").innerHTML = list.map(s => {
    const isFav = favs.includes(s.id);
    return `
    <div class="card shopItem">
      <div class="ic" style="cursor:pointer;" onclick="selectShop('${s.id}')">🏪</div>
      <div class="info" style="cursor:pointer;" onclick="selectShop('${s.id}')">
        <div class="name">${escapeHtml(s.name || s.shopName || "দোকান")}</div>
        <div class="meta">${escapeHtml(s.category || "")}</div>
      </div>
      <div class="favHeart" onclick="toggleFavoriteShop(event,'${s.id}')">${isFav ? "❤️" : "🤍"}</div>
      <div class="chev" onclick="selectShop('${s.id}')">›</div>
    </div>`;
  }).join("");
}

window.toggleFavoriteShop = async function(ev, shopId){
  ev.stopPropagation();
  if(!currentCustomer){ alert("পছন্দের দোকান সেভ করতে আগে Google দিয়ে লগইন করুন।"); return; }
  const favs = currentCustomer.favoriteShops || [];
  const isFav = favs.includes(shopId);
  const updated = isFav ? favs.filter(id=>id!==shopId) : [...favs, shopId];
  currentCustomer.favoriteShops = updated;
  renderShops(getFilteredShops());
  try{
    await db.collection("customers").doc(currentCustomer.uid).set({ favoriteShops: updated }, { merge: true });
  }catch(e){ console.warn("favorite save failed:", e); }
};

$("shopSearch").addEventListener("input", (e)=>{
  const q = e.target.value.trim().toLowerCase();
  renderShops(allShops.filter(s => (s.name||s.shopName||"").toLowerCase().includes(q)));
});

$("backToShops").addEventListener("click", ()=> showScreen("screenShops"));

/* ---------- ধাপ ৩: প্রোডাক্ট/স্টক ---------- */
window.selectShop = function(shopId){
  currentShopId = shopId;
  const shop = allShops.find(s=> s.id === shopId);
  $("currentShopName").textContent = shop ? (shop.name || shop.shopName || shopId) : shopId;
  showScreen("screenProducts");
  loadProducts(shopId);
};

/* ==================== 🖼️ অটোমেটেড ইমেজ পাইপলাইন (Zero-Storage) ====================
   কোনো ছবি POS থেকে আপলোড হয় না। বার্কোড থাকলে Open Food Facts থেকে (সত্যিকারের
   ফ্রি, key ছাড়া) প্রোডাক্টের ছবি আনা হয়। না মিললে ক্যাটাগরি-ভিত্তিক আইকনে
   ফলব্যাক করে। প্রতিটা রেজাল্ট এই সেশনে (ব্রাউজার মেমোরিতে) ক্যাশ থাকে, যাতে
   একই বার্কোড বারবার খোঁজা না লাগে — persistent/shared cache না, কারণ কাস্টমারের
   ব্রাউজার থেকে দোকানের publicStock ডকুমেন্টে লেখার অনুমতি নেই (ইচ্ছাকৃতভাবে)। */
const __imageCache = {}; // barcode -> url | null (এই সেশনেই থাকবে)

const CATEGORY_ICONS = {
  "চাল": "🌾", "ডাল": "🫘", "তেল": "🛢️", "ডিম": "🥚", "দুধ": "🥛",
  "মাছ": "🐟", "মাংস": "🍖", "সবজি": "🥦", "ফল": "🍎", "চা": "🍵",
  "মসলা": "🌶️", "সাবান": "🧼", "শ্যাম্পু": "🧴", "বিস্কুট": "🍪", "চিনি": "🍬",
  "লবণ": "🧂", "পানি": "💧", "ওষুধ": "💊", "কলম": "🖊️", "খাতা": "📓"
};
function guessCategoryIcon(name){
  if(!name) return "📦";
  for(const key in CATEGORY_ICONS){ if(name.includes(key)) return CATEGORY_ICONS[key]; }
  return "📦";
}

async function resolveProductImage(product){
  const barcode = product.barcode;
  if(barcode){
    if(barcode in __imageCache) return __imageCache[barcode];
    try{
      const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json`);
      const data = await res.json();
      const url = (data && data.product && (data.product.image_front_small_url || data.product.image_url)) || null;
      __imageCache[barcode] = url;
      return url;
    }catch(e){
      __imageCache[barcode] = null;
      return null;
    }
  }
  return null;
}

async function loadProducts(shopId){
  $("productsList").innerHTML = '<div class="loadingMsg">স্টক লোড হচ্ছে...</div>';
  try{
    const qs = await db.collection("shops").doc(shopId).collection("publicStock").get();
    if(qs.empty){
      $("productsList").innerHTML = '<div class="emptyMsg">এই দোকান এখনো কোনো প্রোডাক্ট/স্টক তালিকা প্রকাশ করেনি।</div>';
      return;
    }
    const products = qs.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderProducts(products); // আগে টেক্সট/আইকন দিয়ে সাথে সাথে দেখানো
    resolveAllImages(products); // ছবি ব্যাকগ্রাউন্ডে লোড হয়ে ধীরে ধীরে বসবে
  }catch(e){
    console.error(e);
    $("productsList").innerHTML = '<div class="emptyMsg">স্টক লোড করা যায়নি।</div>';
  }
}

function renderProducts(products){
  $("productsList").innerHTML = products.map(p=>{
    const qty = Number(p.stockQty);
    let stockClass = "in", stockLabel = "স্টকে আছে";
    if(!isNaN(qty)){
      if(qty <= 0){ stockClass = "out"; stockLabel = "স্টক নেই"; }
      else if(qty <= 5){ stockClass = "low"; stockLabel = "কম আছে (" + qty + ")"; }
      else{ stockClass = "in"; stockLabel = "স্টকে আছে (" + qty + ")"; }
    }
    return `
      <div class="productRow">
        <div class="productImgWrap" id="pimg-${p.id}">${guessCategoryIcon(p.name)}</div>
        <div style="flex:1; margin:0 10px;">
          <div class="pname">${escapeHtml(p.name || "প্রোডাক্ট")}</div>
          <div class="pstock">${p.price != null ? ("SAR " + p.price) : ""}</div>
        </div>
        <span class="stockBadge ${stockClass}">${stockLabel}</span>
      </div>`;
  }).join("");
}

async function resolveAllImages(products){
  for(const p of products){
    if(!p.barcode) continue;
    const url = await resolveProductImage(p);
    if(url){
      const el = document.getElementById(`pimg-${p.id}`);
      if(el) el.innerHTML = `<img src="${url}" alt="" onerror="this.parentElement.textContent='${guessCategoryIcon(p.name)}'">`;
    }
  }
}

/* ==================== 📊 সুপার অ্যাডমিনের জন্য লাইভ ব্যবহার-অ্যানালিটিক্স ====================
   কোনো ব্যক্তিগত তথ্য পাঠানো হয় না — শুধু সময়/স্ক্রল/কোন দোকান দেখা হচ্ছে, এটা
   activeSessions/{sessionId}-এ প্রতি ~১৫ সেকেন্ডে আপডেট হয়। ট্যাব বন্ধ করলে
   হার্টবিট থেমে যায়, ৩০ সেকেন্ড পর সুপার অ্যাডমিন প্যানেলে "অফলাইন" দেখাবে। */
const __sessionId = "s_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
let __scrollCount = 0;
let __sessionStartedAt = Date.now();

window.addEventListener("scroll", ()=>{ __scrollCount++; }, { passive: true });

async function sendAnalyticsHeartbeat(){
  try{
    const totalDurationSec = Math.floor((Date.now() - __sessionStartedAt) / 1000);
    const currentShop = currentShopId ? allShops.find(s=> s.id === currentShopId) : null;
    await db.collection("activeSessions").doc(__sessionId).set({
      customerName: (currentCustomer && currentCustomer.name) || "অতিথি",
      customerUid: currentCustomer ? currentCustomer.uid : null,
      scrollCount: __scrollCount,
      totalDurationSec,
      currentShopId: currentShopId || null,
      currentShopName: currentShop ? (currentShop.name || currentShop.shopName) : null,
      lastHeartbeat: firebase.firestore.FieldValue.serverTimestamp(),
      startedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  }catch(e){ /* অ্যানালিটিক্স ব্যর্থ হলেও অ্যাপের কাজে কোনো প্রভাব পড়বে না */ }
}

sendAnalyticsHeartbeat();
setInterval(sendAnalyticsHeartbeat, 15000);
