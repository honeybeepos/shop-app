<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🦸 Honey Bee Superheroes</title>
<meta name="theme-color" content="#78350f">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{ --amber:#f59e0b; --dark:#1a1206; --card:#2b1c05; --border:rgba(245,158,11,0.3); --ok:#16a34a; --muted:#d6b896; }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{ min-height:100vh; background:linear-gradient(160deg,#1a1206,#3d2405); color:#fff8e8; font-family:'Noto Sans Bengali','Space Mono',sans-serif; }
  .wrap{ max-width:420px; margin:0 auto; padding:24px 16px 40px; }
  header{ text-align:center; margin-bottom:20px; }
  header .hex{ font-size:44px; }
  header h1{ margin:8px 0 2px; font-size:18px; font-weight:800; }
  header p{ margin:0; font-size:11px; color:#fcd34d; letter-spacing:1.3px; text-transform:uppercase; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px; }
  label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600; }
  input{ width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.06); color:#fff8e8; font-family:inherit; font-size:14px; margin-bottom:12px; }
  .btn{ width:100%; padding:13px; border:none; border-radius:11px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; background:var(--amber); color:#1a1206; }
  #loginError{ display:none; color:#fcd34d; font-size:12.5px; margin:-4px 0 12px; }

  .availCard{ text-align:center; padding:28px 18px; }
  .availToggle{ width:140px; height:140px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; cursor:pointer; border:4px solid; font-weight:800; transition:.2s; }
  .availToggle.free{ background:rgba(22,163,74,0.15); border-color:var(--ok); color:#4ade80; }
  .availToggle.busy{ background:rgba(245,158,11,0.15); border-color:var(--amber); color:#fbbf24; }
  .availToggle .ic{ font-size:36px; margin-bottom:6px; }
  .catBadgeWrap{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
  .catBadge{ font-size:12px; background:rgba(255,255,255,0.08); padding:6px 12px; border-radius:20px; }
  #logoutBtn{ background:transparent; border:1px solid var(--border); color:var(--muted); padding:8px 14px; border-radius:9px; font-size:11.5px; cursor:pointer; font-family:inherit; width:100%; margin-top:6px; }
  .gpsStatus{ text-align:center; font-size:11px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>

<div class="wrap" id="loginScreen">
  <header>
    <div class="hex">🦸</div>
    <h1>Honey Bee Superheroes</h1>
    <p>Superhero App</p>
  </header>
  <div class="card">
    <label for="loginPhone">মোবাইল নম্বর</label>
    <input type="text" id="loginPhone" placeholder="05XXXXXXXX">
    <label for="loginPass">পাসওয়ার্ড</label>
    <input type="password" id="loginPass" placeholder="••••••••">
    <p id="loginError"></p>
    <button class="btn" id="loginBtn">🔑 লগইন করুন</button>
    <p style="font-size:11.5px; color:var(--muted); text-align:center; margin-top:14px;">এজেন্টের কাছ থেকে পাওয়া নম্বর ও পাসওয়ার্ড দিয়ে লগইন করুন।</p>
  </div>
</div>

<div class="wrap" id="mainScreen" style="display:none;">
  <header>
    <div class="hex">🦸</div>
    <h1 id="superheroNameLbl">Honey Bee Superheroes</h1>
    <p>Superhero App</p>
  </header>

  <div class="card availCard">
    <div class="availToggle busy" id="availToggle">
      <div class="ic" id="availIcon">🔴</div>
      <div id="availLabel">ব্যস্ত</div>
    </div>
    <p style="font-size:12.5px; color:var(--muted); margin:0;" id="availHint">চাপ দিয়ে "কাজের জন্য প্রস্তুত" করুন — তখনই আশেপাশের মানুষ আপনাকে খুঁজে পাবে।</p>
    <div class="catBadgeWrap" id="categoryBadge"></div>
    <p class="gpsStatus" id="gpsStatusTxt"></p>
  </div>

  <button id="logoutBtn">লগআউট</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD6qmuWkNUrskMIBHq8Z_AQ0N_WT1DL8Is",
  authDomain: "honeybee-984dd.firebaseapp.com",
  projectId: "honeybee-984dd",
  storageBucket: "honeybee-984dd.firebasestorage.app",
  messagingSenderId: "610211112501",
  appId: "1:610211112501:web:9ea40b9060d425e85b737c"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function $(id){ return document.getElementById(id); }
function phoneToAuthEmail(phone){
  const digits = phone.replace(/[^0-9]/g, "");
  return `rider_${digits}@honeybee-riders.app`; // ডেলিভারি রাইডারের মতোই একই সিন্থেটিক-ইমেইল স্কিম
}

const SUPERHERO_LABELS = {
  agri: "🌾🚜 Agri Superhero", hygiene: "🧹✨ Hygiene Superhero", electric: "⚡🔌 Electric Superhero",
  masonry: "🧱🏗️ Masonry Superhero", plumbing: "🚰🔧 Plumbing Superhero"
};

let currentSuperhero = null;
let isAvailable = false;
let gpsWatchId = null;

$("loginBtn").addEventListener("click", async ()=>{
  const phone = $("loginPhone").value.trim();
  const pass = $("loginPass").value;
  $("loginError").style.display = "none";
  if(!phone || !pass){ showLoginError("মোবাইল নম্বর ও পাসওয়ার্ড দিন।"); return; }
  $("loginBtn").disabled = true; $("loginBtn").textContent = "লগইন হচ্ছে...";
  try{ await auth.signInWithEmailAndPassword(phoneToAuthEmail(phone), pass); }
  catch(e){ showLoginError("লগইন ব্যর্থ — নম্বর/পাসওয়ার্ড ভুল অথবা অ্যাকাউন্ট নেই।"); }
  finally{ $("loginBtn").disabled = false; $("loginBtn").textContent = "🔑 লগইন করুন"; }
});
function showLoginError(msg){ $("loginError").textContent = msg; $("loginError").style.display = "block"; }
$("logoutBtn").addEventListener("click", ()=> auth.signOut());

auth.onAuthStateChanged(async (user)=>{
  if(!user){
    $("loginScreen").style.display = "block";
    $("mainScreen").style.display = "none";
    stopGps();
    return;
  }
  try{
    const userDoc = await db.collection("users").doc(user.uid).get();
    if(!userDoc.exists || userDoc.data().role !== "superhero"){
      showLoginError("এই অ্যাকাউন্টটি Superhero হিসেবে নিবন্ধিত না।");
      await auth.signOut(); return;
    }
    const superheroDoc = await db.collection("superheroes").doc(user.uid).get();
    if(!superheroDoc.exists){
      showLoginError("প্রোফাইল পাওয়া যায়নি।");
      await auth.signOut(); return;
    }
    currentSuperhero = { uid: user.uid, ...superheroDoc.data() };
    if(currentSuperhero.status !== "active"){
      showLoginError("আপনার অ্যাকাউন্ট বর্তমানে ব্লক করা আছে — এজেন্টের সাথে যোগাযোগ করুন।");
      await auth.signOut(); return;
    }

    $("loginScreen").style.display = "none";
    $("mainScreen").style.display = "block";
    $("superheroNameLbl").textContent = currentSuperhero.name || "Honey Bee Superheroes";
    $("categoryBadge").innerHTML = `<span class="catBadge">${SUPERHERO_LABELS[currentSuperhero.category] || currentSuperhero.category || ""}</span>`;

    isAvailable = !!currentSuperhero.isAvailable;
    refreshAvailUi();
    if(isAvailable) startGps();
  }catch(e){
    console.error(e);
    showLoginError("সমস্যা হয়েছে, আবার চেষ্টা করুন।");
    await auth.signOut();
  }
});

function refreshAvailUi(){
  const toggle = $("availToggle");
  toggle.classList.toggle("free", isAvailable);
  toggle.classList.toggle("busy", !isAvailable);
  $("availIcon").textContent = isAvailable ? "🟢" : "🔴";
  $("availLabel").textContent = isAvailable ? "প্রস্তুত" : "ব্যস্ত";
  $("availHint").textContent = isAvailable
    ? "আপনি এখন আশেপাশের তালিকায় দেখা যাচ্ছেন।"
    : "চাপ দিয়ে \"কাজের জন্য প্রস্তুত\" করুন — তখনই আশেপাশের মানুষ আপনাকে খুঁজে পাবে।";
}

$("availToggle").addEventListener("click", async ()=>{
  isAvailable = !isAvailable;
  refreshAvailUi();
  try{
    await db.collection("superheroes").doc(currentSuperhero.uid).update({ isAvailable });
  }catch(e){ console.warn("availability update failed:", e); }
  if(isAvailable) startGps(); else stopGps();
});

function startGps(){
  if(!navigator.geolocation){ $("gpsStatusTxt").textContent = "📍 এই ডিভাইসে GPS সাপোর্ট নেই"; return; }
  $("gpsStatusTxt").textContent = "📍 লাইভ লোকেশন শেয়ার হচ্ছে";
  let lastSent = 0;
  gpsWatchId = navigator.geolocation.watchPosition((pos)=>{
    const now = Date.now();
    if(now - lastSent < 7000) return;
    lastSent = now;
    db.collection("superheroes").doc(currentSuperhero.uid).update({
      liveLocation: {
        lat: pos.coords.latitude, lng: pos.coords.longitude,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }
    }).catch(()=>{});
  }, (err)=>{
    console.warn("GPS error:", err);
    $("gpsStatusTxt").textContent = "⚠️ GPS পারমিশন লাগবে";
  }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
}
function stopGps(){
  if(gpsWatchId != null){ navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
  $("gpsStatusTxt").textContent = "";
}
</script>
</body>
</html>
