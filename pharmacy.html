let SUP_Q = "";
function pageSuppliers(){
  const sups = loadSuppliers();
  const totalDue = sups.reduce((a,s)=> a + Math.max(0, Number(s.due) || 0), 0);
  $("page").innerHTML = `
    <div class="pageHead"><h1>সরবরাহকারী</h1><button class="btn" type="button" id="supAdd">➕ নতুন সরবরাহকারী</button></div>
    ${isAdmin() ? `<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr)); max-width:640px">
      <div class="stat b"><div class="ic">🚚</div><div><div class="lbl">মোট সরবরাহকারী</div><div class="val num">${bn(sups.length)}</div></div></div>
      <div class="stat r"><div class="ic">💸</div><div><div class="lbl">মোট বাকি (আমাদের দেনা)</div><div class="val num">${money(totalDue)}</div></div></div>
    </div>` : ""}
    <div class="toolbar"><input class="in" id="supQ" placeholder="🔍 নাম বা মোবাইল দিয়ে খুঁজুন" value="${esc(SUP_Q)}"></div>
    <div class="panel" style="padding:6px 8px" id="supBox"></div>`;
  $("supAdd").onclick = openSupplierForm;
  $("supQ").oninput = ()=>{ SUP_Q = $("supQ").value.trim(); renderSuppliers(); };
  renderSuppliers();
}
function renderSuppliers(){
  const q = SUP_Q.toLowerCase();
  const list = loadSuppliers().filter(s=> !q || String(s.name || "").toLowerCase().includes(q) || String(s.phone || "").includes(q))
    .sort((a,b)=> (Number(b.due) || 0) - (Number(a.due) || 0));
  if(!list.length){ $("supBox").innerHTML = `<div class="empty">${q ? "এই নামে কেউ নেই।" : "এখনো কোনো সরবরাহকারী নেই। \"➕ নতুন সরবরাহকারী\" চেপে যোগ করুন।"}</div>`; return; }
  const hist = readJSON(PHIST_KEY, []);
  $("supBox").innerHTML = `<table class="t"><thead><tr><th>নাম</th><th>মোবাইল</th><th class="r">শেষ ক্রয়</th>${isAdmin() ? '<th class="r">বাকি</th>' : ""}</tr></thead><tbody>
    ${list.map(s=>{ const last = hist.find(h=> h.supplierId === s.id); return `<tr data-sup="${esc(s.id)}" style="cursor:pointer">
      <td><b>${esc(s.name)}</b>${s.note ? `<div class="hint">${esc(s.note)}</div>` : ""}</td>
      <td>${s.phone ? `<a href="tel:${esc(s.phone)}" onclick="event.stopPropagation()">${esc(s.phone)}</a>` : "—"}</td>
      <td class="r">${last ? fmtDate(last.date) : "—"}</td>
      ${isAdmin() ? `<td class="r num ${Number(s.due) > 0 ? "bad" : ""}">${money(s.due || 0)}</td>` : ""}
    </tr>`; }).join("")}</tbody></table>`;
  $("supBox").querySelectorAll("[data-sup]").forEach(tr=> tr.onclick = ()=> openSupplierLedger(tr.dataset.sup));
}
function openSupplierLedger(id){
  const s = loadSuppliers().find(x=> x.id === id); if(!s) return;
  const txns = readJSON("shop-supplier-txns", []).filter(t=> t.supplierId === id).sort((a,b)=> String(a.date).localeCompare(String(b.date)));
  // খাতায় লেখা নেই এমন পুরনো বাকি থাকলে (যেমন আগে হাতে বসানো) শুরুতে "আগের বাকি" সারি —
  // যাতে শেষ স্থিতি সবসময় বর্তমান বাকির সাথে মেলে
  const net = txns.reduce((a,t)=> a + (t.type === "purchase" ? 1 : -1) * (Number(t.amount) || 0), 0);
  const opening = r2((Number(s.due) || 0) - net);
  let bal = opening;
  const rows = txns.map(t=>{ bal += (t.type === "purchase" ? 1 : -1) * (Number(t.amount) || 0); return { t, bal: r2(bal) }; });
  if(Math.abs(opening) >= 0.01) rows.unshift({ t: { date: txns.length ? txns[0].date : new Date().toISOString(), note: "আগের বাকি", type: opening > 0 ? "purchase" : "payment", amount: Math.abs(opening) }, bal: opening });
  rows.reverse();
  const admin = isAdmin();
  openModal(`<div class="head"><h3>🚚 ${esc(s.name)}</h3><button class="x" type="button" data-close aria-label="বন্ধ">✕</button></div>
    <div class="hint">${s.phone ? "📱 " + esc(s.phone) : ""}${s.note ? " · " + esc(s.note) : ""}</div>
    ${admin ? `<div class="calc" style="display:flex; justify-content:space-between; align-items:center"><span>বর্তমান বাকি (আমাদের দেনা)</span><b class="num ${Number(s.due) > 0 ? "bad" : ""}" style="font-size:20px">${money(s.due || 0)}</b></div>
    <h3 style="font-size:16px; margin:16px 0 6px">লেনদেনের খাতা</h3>
    ${rows.length ? `<table class="t"><thead><tr><th>তারিখ</th><th>বিবরণ</th><th class="r">ক্রয়</th><th class="r">পরিশোধ</th><th class="r">স্থিতি</th></tr></thead><tbody>
      ${rows.map(({t, bal})=> `<tr><td>${fmtDate(t.date)}</td><td>${esc(t.note || (t.type === "purchase" ? "ক্রয়" : "পরিশোধ"))}</td><td class="r num">${t.type === "purchase" ? money(t.amount) : ""}</td><td class="r num">${t.type === "payment" ? money(t.amount) : ""}</td><td class="r num">${money(bal)}</td></tr>`).join("")}
    </tbody></table>` : `<div class="empty">এখনো কোনো লেনদেন নেই।</div>`}` : `<div class="empty">টাকার হিসাব শুধু এডমিন দেখতে পারেন।</div>`}
    <div class="foot">
      <button class="btn ghost" type="button" id="supBuy">📥 এর কাছ থেকে ক্রয়</button>
      ${admin && Number(s.due) > 0 ? `<button class="btn green" type="button" id="supPay">💵 বাকি পরিশোধ</button>` : ""}
    </div>`);
  $("supBuy").onclick = ()=>{ closeModal(); PUR = PUR || readJSON(PDRAFT_KEY, null) || blankPurchase(); PUR.supplierId = id; go("purchase"); };
  if($("supPay")) $("supPay").onclick = ()=> openSupplierPay(id);
}
function openSupplierPay(id){
  const s = loadSuppliers().find(x=> x.id === id); if(!s) return;
  const due = Number(s.due) || 0;
  openModal(`<div class="head"><h3>💵 ${esc(s.name)} — বাকি পরিশোধ</h3><button class="x" type="button" data-close aria-label="বন্ধ">✕</button></div>
    <div class="calc">বর্তমান বাকি: <b>${money(due)}</b></div>
    <div class="row2"><div><label class="f">কত টাকা দিচ্ছেন *</label><input class="in num" id="spAmt" inputmode="decimal" value="${due}"></div>
      <div><label class="f">কীভাবে</label><select class="in" id="spVia"><option value="cash">নগদ</option><option value="bank">ব্যাংক / বিকাশ</option></select></div></div>
    <label class="f">নোট</label><input class="in" id="spNote" placeholder="যেমন: প্রতিনিধির হাতে দেওয়া">
    <div class="foot"><button class="btn ghost" type="button" data-close>বাতিল</button><button class="btn green" type="button" id="spSave">✅ পরিশোধ করুন</button></div>`);
  $("spSave").onclick = ()=>{
    const amt = r2(Number($("spAmt").value) || 0);
    if(!(amt > 0)){ toast("টাকার পরিমাণ লিখুন"); return; }
    if(amt > due){ toast("বাকির চেয়ে বেশি দেওয়া যাবে না"); return; }
    const sups = loadSuppliers(); const x = sups.find(y=> y.id === id);
    x.due = r2(Math.max(0, (Number(x.due) || 0) - amt));
    localStorage.setItem("shop-suppliers", JSON.stringify(sups));
    const note = ($("spNote").value.trim() || "বাকি পরিশোধ") + ($("spVia").value === "bank" ? " (ব্যাংক/বিকাশ)" : "");
    const txns = readJSON("shop-supplier-txns", []); txns.push({ id: uid(), supplierId: id, type: "payment", amount: amt, note, date: new Date().toISOString() });
    localStorage.setItem("shop-supplier-txns", JSON.stringify(txns));
    // সাধারণ POS-এর মতোই খরচের খাতায় — কোন খাতে কত টাকা গেল সেটা মনিটরিংয়ে দেখা যায়
    const ex = readJSON("shop-expenses", []); ex.push({ id: uid(), category: "সাপ্লায়ার পেমেন্ট", person: x.name, amount: amt, method: $("spVia").value, note, date: new Date().toISOString() });
    localStorage.setItem("shop-expenses", JSON.stringify(ex));
    pushNow(); toast("✅ " + money(amt) + " পরিশোধ হয়েছে");
    openSupplierLedger(id);
    if(CUR_PAGE === "suppliers") pageSuppliers();
  };
}


/* =====================================================================
   👥 গ্রাহক — বাকি ও আদায়
   বাকি আদায় সাধারণ POS-এর মতোই: টাকা সবচেয়ে পুরনো বাকি থেকে কাটে (paid বাড়ে),
   একটা "Deposit Received" জমার লাইন যোগ হয় (নগদ/ব্যাংকের হিসাবের জন্য),
   আর bcc-due-log-এ আদায়ের খতিয়ান থাকে।
   ===================================================================== */
function dueSummary(entries){
  const map = {};
  entries.forEach(e=>{
    const d = Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0); if(d <= 0) return;
    const k = e.phone ? "p:" + e.phone : "n:" + e.name;
    map[k] = (map[k] || 0) + d;
  });
  const vals = Object.values(map);
  return { total: r2(vals.reduce((a,b)=> a + b, 0)), count: vals.length, map };
}
let CUST_Q = "", CUST_ONLY_DUE = false;
function pageCustomers(){
  const entries = loadEntries();
  const sum = dueSummary(entries);
  $("page").innerHTML = `
    <div class="pageHead"><h1>গ্রাহক</h1><button class="btn" type="button" id="cAdd">➕ নতুন গ্রাহক</button></div>
    ${isAdmin() ? `<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr)); max-width:640px">
      <div class="stat b"><div class="ic">👥</div><div><div class="lbl">মোট গ্রাহক</div><div class="val num">${bn(loadCustomers().length)}</div></div></div>
      <div class="stat r"><div class="ic">📒</div><div><div class="lbl">বাকি আদায়যোগ্য</div><div class="val num">${money(sum.total)}</div><div class="sub">${bn(sum.count)} জনের কাছে</div></div></div>
    </div>` : ""}
    <div class="toolbar"><input class="in" id="cQ" placeholder="🔍 নাম বা মোবাইল দিয়ে খুঁজুন" value="${esc(CUST_Q)}">
      ${isAdmin() ? `<label style="display:flex; align-items:center; gap:6px; font-size:14px"><input type="checkbox" id="cDue"${CUST_ONLY_DUE ? " checked" : ""}> শুধু যাদের বাকি আছে</label>` : ""}</div>
    <div class="panel" style="padding:6px 8px" id="cBox"></div>`;
  $("cAdd").onclick = ()=> openCustomerPicker((c)=>{ toast("✅ " + c.name + " যোগ হয়েছে"); pageCustomers(); });
  $("cQ").oninput = ()=>{ CUST_Q = $("cQ").value.trim(); renderCustomers(); };
  if($("cDue")) $("cDue").onchange = ()=>{ CUST_ONLY_DUE = $("cDue").checked; renderCustomers(); };
  renderCustomers();
}
function renderCustomers(){
  const entries = loadEntries();
  const q = CUST_Q.toLowerCase();
  const lastBuy = {};
  entries.forEach(e=>{ const k = e.phone ? "p:" + e.phone : "n:" + e.name; if(!lastBuy[k] || String(e.date) > String(lastBuy[k])) lastBuy[k] = e.date; });
  const sum = dueSummary(entries);
  let list = loadCustomers().map(c=> ({ c, k: c.phone ? "p:" + c.phone : "n:" + c.name }))
    .map(x=> Object.assign(x, { due: isAdmin() ? r2(sum.map[x.k] || 0) : 0, last: lastBuy[x.k] }))
    .filter(x=> (!q || x.c.name.toLowerCase().includes(q) || String(x.c.phone || "").includes(q)) && (!CUST_ONLY_DUE || x.due > 0))
    .sort((a,b)=> b.due - a.due || String(b.last || "").localeCompare(String(a.last || "")));
  if(!list.length){ $("cBox").innerHTML = `<div class="empty">${q || CUST_ONLY_DUE ? "এমন কোনো গ্রাহক নেই।" : "এখনো কোনো গ্রাহক নেই। বিক্রির সময় \"👤 গ্রাহক বাছুন\" দিয়েও যোগ করা যায়।"}</div>`; return; }
  $("cBox").innerHTML = `<table class="t"><thead><tr><th>নাম</th><th>মোবাইল</th><th class="r">শেষ কেনা</th>${isAdmin() ? '<th class="r">বাকি</th>' : ""}</tr></thead><tbody>
    ${list.slice(0, 300).map((x, i)=> `<tr data-ci="${i}" style="cursor:pointer"><td><b>${esc(x.c.name)}</b></td><td>${x.c.phone ? `<a href="tel:${esc(x.c.phone)}" onclick="event.stopPropagation()">${esc(x.c.phone)}</a>` : "—"}</td><td class="r">${x.last ? fmtDate(x.last) : "—"}</td>${isAdmin() ? `<td class="r num ${x.due > 0 ? "bad" : ""}">${money(x.due)}</td>` : ""}</tr>`).join("")}
  </tbody></table>`;
  $("cBox").querySelectorAll("[data-ci]").forEach(tr=> tr.onclick = ()=>{ const c = list[+tr.dataset.ci].c; openCustomerLedger(c.name, c.phone || ""); });
}
function openCustomerLedger(name, phone){
  const entries = loadEntries().filter(e=> sameCust(e, name, phone)).sort((a,b)=> String(b.date).localeCompare(String(a.date)));
  const due = custDue(name, phone);
  const admin = isAdmin();
  const dueItems = entries.filter(e=> Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0) > 0);
  const deposits = entries.filter(e=> Number(e.depositAmount) > 0);
  const buys = entries.filter(e=> !(Number(e.depositAmount) > 0) && e.item !== "Deposit Received");
  openModal(`<div class="head"><h3>👤 ${esc(name)}</h3><button class="x" type="button" data-close aria-label="বন্ধ">✕</button></div>
    <div class="hint">${phone ? `📱 <a href="tel:${esc(phone)}">${esc(phone)}</a>` : "মোবাইল নেই"} · মোট ${bn(new Set(buys.map(e=> e.billId || e.invoiceNo || e.id)).size)} বার কেনা</div>
    ${admin ? `<div class="calc" style="display:flex; justify-content:space-between; align-items:center"><span>বর্তমান বাকি</span><b class="num ${due > 0 ? "bad" : ""}" style="font-size:20px">${money(due)}</b></div>
    ${dueItems.length ? `<h3 style="font-size:16px; margin:14px 0 6px">যেগুলোর বাকি আছে</h3><table class="t"><thead><tr><th>তারিখ</th><th>ওষুধ</th><th class="r">বাকি</th></tr></thead><tbody>${dueItems.map(e=> `<tr><td>${fmtDate(e.date)}</td><td>${esc(e.item)}</td><td class="r num">${money(Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0))}</td></tr>`).join("")}</tbody></table>` : ""}
    ${deposits.length ? `<h3 style="font-size:16px; margin:14px 0 6px">আদায়</h3><table class="t"><tbody>${deposits.slice(0, 10).map(e=> `<tr><td>${fmtDate(e.date)}</td><td>${e.paymentMethod === "bank" ? "ব্যাংক/বিকাশ" : "নগদ"}</td><td class="r num">${money(e.depositAmount)}</td></tr>`).join("")}</tbody></table>` : ""}` : ""}
    <h3 style="font-size:16px; margin:14px 0 6px">সাম্প্রতিক কেনা</h3>
    ${buys.length ? `<table class="t"><tbody>${buys.slice(0, 12).map(e=> `<tr><td>${fmtDate(e.date)}</td><td>${esc(e.item)}</td><td class="r num">${money(e.price)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">এখনো কিছু কেনেননি।</div>`}
    <div class="foot">
      <button class="btn ghost" type="button" id="clSell">🛒 এঁকে বিক্রি করুন</button>
      ${admin && due > 0 ? `<button class="btn green" type="button" id="clPay">💵 বাকি আদায়</button>` : ""}
    </div>`);
  $("clSell").onclick = ()=>{ closeModal(); CUST = { name, phone }; go("pos"); };
  if($("clPay")) $("clPay").onclick = ()=> openDueCollect(name, phone);
}
function openDueCollect(name, phone){
  const due = custDue(name, phone);
  openModal(`<div class="head"><h3>💵 ${esc(name)} — বাকি আদায়</h3><button class="x" type="button" data-close aria-label="বন্ধ">✕</button></div>
    <div class="calc">বর্তমান বাকি: <b>${money(due)}</b></div>
    <div class="row2"><div><label class="f">কত টাকা নিচ্ছেন *</label><input class="in num" id="dcAmt" inputmode="decimal" value="${due}"></div>
      <div><label class="f">কীভাবে</label><select class="in" id="dcVia"><option value="cash">নগদ</option><option value="bank">ব্যাংক / বিকাশ / নগদ অ্যাপ</option></select></div></div>
    <div class="hint" id="dcHint"></div>
    <div class="foot"><button class="btn ghost" type="button" data-close>বাতিল</button><button class="btn green" type="button" id="dcSave">✅ আদায় করুন</button></div>`);
  const hint = ()=>{ const a = Number($("dcAmt").value) || 0; $("dcHint").textContent = a > due ? "বাকি শোধ — গ্রাহককে ফেরত দিন " + money(a - due) : (a > 0 ? "নতুন বাকি থাকবে " + money(due - a) : ""); };
  $("dcAmt").oninput = hint; hint();
  $("dcSave").onclick = ()=>{
    const amt = r2(Number($("dcAmt").value) || 0);
    if(!(amt > 0)){ toast("টাকার পরিমাণ লিখুন"); return; }
    const take = Math.min(amt, due);
    const all = readJSON("phone-shop-entries", []);
    const del = readJSON("phone-shop-deleted-entry-ids", []);
    let left = take;
    all.filter(e=> !del.includes(e.id) && sameCust(e, name, phone) && Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0) > 0)
      .sort((a,b)=> new Date(a.date) - new Date(b.date))
      .forEach(e=>{ if(left <= 0) return; const d = Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0); const ap = Math.min(d, left); e.paid = r2((Number(e.paid) || 0) + ap); left = r2(left - ap); });
    const method = $("dcVia").value;
    all.unshift({ id: uid(), name, item: "Deposit Received", phone, cost: 0, price: 0, paid: 0, depositAmount: take, paymentMethod: method,
      note: CUR() + " " + take + " deposited (ফার্মেসি)", status: "নগদ", invoiceNo: nextInvoiceNo(all), date: new Date().toISOString(), soldBy: (SESSION && SESSION.name) || "এডমিন", source: "pharmacy" });
    localStorage.setItem("phone-shop-entries", JSON.stringify(all));
    const log = readJSON("bcc-due-log", []); log.unshift({ date: new Date().toISOString(), name, amount: take });
    localStorage.setItem("bcc-due-log", JSON.stringify(log.slice(0, 500)));
    pushNow();
    toast("✅ " + money(take) + " আদায় হয়েছে" + (amt > due ? " · ফেরত " + money(amt - due) : ""));
    openCustomerLedger(name, phone);
    if(CUR_PAGE === "customers") pageCustomers();
  };
}


/* =====================================================================
   📦 স্টক ব্যবস্থাপনা
   • স্টক      — সব ওষুধ, কতটা আছে, কেনা দামে মূল্য (এডমিন), ছাঁকনি
   • গণনা      — তাকে গুনে যা পাওয়া গেল সেটা বসালে পার্থক্য ঠিক হয়
   • নষ্ট/মেয়াদ — ভাঙা/নষ্ট বা মেয়াদ শেষ ওষুধ বাদ (ব্যাচ ধরে)
   • ফেরত      — কোম্পানিকে ফেরত; সরবরাহকারীর বাকি থেকে টাকা কমে
   • খতিয়ান    — কে কবে কী বদলালেন (শেষ ৩০০টা, hb-pharma-stock-log)
   সব বদল পিসে হয়, ব্যাচ বাছা থাকলে সেই ব্যাচ থেকে, না থাকলে আগে মেয়াদ শেষ হওয়াটা থেকে।
   ===================================================================== */
const SLOG_KEY = "hb-pharma-stock-log";
let STOCK_TAB = "list", STOCK_FILTER = "all", STOCK_Q = "";

function stockLog(rec){
  const log = readJSON(SLOG_KEY, []);
  log.unshift(Object.assign({ id: uid(), date: new Date().toISOString(), by: (SESSION && SESSION.name) || "" }, rec));
  localStorage.setItem(SLOG_KEY, JSON.stringify(log.slice(0, 300)));
}
// ব্যাচ থেকে কমানো — batchIdx দিলে সেই ব্যাচ, না দিলে আগে মেয়াদ শেষ হওয়াটা থেকে
function takeFromBatches(p, pieces, batchIdx){
  let left = pieces;
  const bs = p.batches || [];
  if(batchIdx != null && bs[batchIdx]){ const t = Math.min(left, Number(bs[batchIdx].qty) || 0); bs[batchIdx].qty = (Number(bs[batchIdx].qty) || 0) - t; left -= t; }
  bs.filter(b=> b && Number(b.qty) > 0).sort((a,b)=> String(a.expiryDate || "9999").localeCompare(String(b.expiryDate || "9999")))
    .forEach(b=>{ if(left <= 0) return; const t = Math.min(left, Number(b.qty) || 0); b.qty = (Number(b.qty) || 0) - t; left -= t; });
}
// একটা খোঁজার ঘর + তালিকা, যেকোনো জায়গায় ওষুধ বাছার জন্য
function medPicker(inp, drop, onChoose){
  let kb = 0, hits = [];
  const draw = ()=>{
    hits = loadProducts().filter(p=> medMatches(p, inp.value.trim())).slice(0, 30);
    drop.hidden = !hits.length || document.activeElement !== inp;
    drop.innerHTML = hits.map((p, k)=> `<div class="${k === kb ? "kb" : ""}" data-pick="${esc(p.id)}"><b>${esc(p.name)}</b> <small>${esc(p.genericName || "")} · স্টক ${esc(stockText(p))}</small></div>`).join("");
    drop.querySelectorAll("[data-pick]").forEach(d=> d.onmousedown = (e)=>{ e.preventDefault(); pick(d.dataset.pick); });
  };
  const pick = (id)=>{ const p = loadProducts().find(x=> x.id === id); if(!p) return; inp.value = p.name; drop.hidden = true; onChoose(p); };
  inp.addEventListener("focus", ()=>{ kb = 0; draw(); });
  inp.addEventListener("input", ()=>{ kb = 0; draw(); });
  inp.addEventListener("blur", ()=> setTimeout(()=>{ drop.hidden = true; }, 120));
  inp.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowDown"){ e.preventDefault(); kb = Math.min(hits.length - 1, kb + 1); draw(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); kb = Math.max(0, kb - 1); draw(); }
    else if(e.key === "Enter"){ e.preventDefault(); if(hits[kb]) pick(hits[kb].id); }
  });
}
const piecesFrom = (p, box, pc)=> Math.max(0, Math.floor(Number(box) || 0)) * packOf(p).perBox + Math.max(0, Math.floor(Number(pc) || 0));

function pageStock(){
  const tabs = [["list","📦 স্টক"],["count","🔢 গণনা ও সমন্বয়"],["damage","🗑️ নষ্ট / মেয়াদোত্তীর্ণ"],["return","↩️ কোম্পানিকে ফেরত"],["log","📜 খতিয়ান"]]
    .filter(([k])=> can("staffWriteOff") || !["count","damage","return"].includes(k));
  if(!tabs.some(t=> t[0] === STOCK_TAB)) STOCK_TAB = "list";
  $("page").innerHTML = `<div class="pageHead"><h1>স্টক ব্যবস্থাপনা</h1></div>
    <div class="tabs">${tabs.map(([k,l])=> `<button type="button" data-st="${k}" class="${k === STOCK_TAB ? "on" : ""}">${l}</button>`).join("")}</div>
    <div id="stBody"></div>`;
  document.querySelectorAll("[data-st]").forEach(b=> b.onclick = ()=>{ STOCK_TAB = b.dataset.st; pageStock(); });
  ({ list: stockList, count: stockCount, damage: stockDamage, return: stockReturn, log: stockLogView })[STOCK_TAB]();
}

function stockList(){
  const prods = loadProducts();
  const t0 = new Date(todayStr()).getTime();
  const expiredPieces = (p)=> (p.batches || []).filter(b=> b && Number(b.qty) > 0 && b.expiryDate && new Date(b.expiryDate).getTime() < t0).reduce((a,b)=> a + Number(b.qty), 0);
  const counts = { all: prods.length, low: prods.filter(isLow).length, out: prods.filter(p=> !(Number(p.qty) > 0)).length, exp: prods.filter(p=> expiredPieces(p) > 0).length };
  const val = prods.reduce((a,p)=> a + (Number(p.buy) || 0) * Math.max(0, Number(p.qty) || 0), 0);
  const sale = prods.reduce((a,p)=> a + pcPrice(p) * Math.max(0, Number(p.qty) || 0), 0);
  $("stBody").innerHTML = `
    ${isAdmin() ? `<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="stat b"><div class="ic">📦</div><div><div class="lbl">স্টকের মূল্য (কেনা দামে)</div><div class="val num">${money(val)}</div></div></div>
      <div class="stat g"><div class="ic">💰</div><div><div class="lbl">বিক্রি দামে</div><div class="val num">${money(sale)}</div><div class="sub">সম্ভাব্য লাভ ${money(sale - val)}</div></div></div>
      <div class="stat o"><div class="ic">💊</div><div><div class="lbl">মোট ওষুধ</div><div class="val num">${bn(prods.length)}</div></div></div>
    </div>` : ""}
    <div class="toolbar"><input class="in" id="stQ" placeholder="🔍 নাম, জেনেরিক বা কোম্পানি" value="${esc(STOCK_Q)}">
      <div class="tabs" style="margin:0">${[["all","সব"],["low","কম স্টক"],["out","শেষ"],["exp","মেয়াদ শেষ"]].map(([k,l])=> `<button type="button" data-sf="${k}" class="${k === STOCK_FILTER ? "on" : ""}">${l} (${bn(counts[k])})</button>`).join("")}</div></div>
    <div class="panel" style="padding:6px 8px; overflow-x:auto" id="stList"></div>`;
  document.querySelectorAll("[data-sf]").forEach(b=> b.onclick = ()=>{ STOCK_FILTER = b.dataset.sf; stockList(); });
  const draw = ()=>{
    let list = prods.filter(p=> medMatches(p, STOCK_Q));
    if(STOCK_FILTER === "low") list = list.filter(isLow);
    else if(STOCK_FILTER === "out") list = list.filter(p=> !(Number(p.qty) > 0));
    else if(STOCK_FILTER === "exp") list = list.filter(p=> expiredPieces(p) > 0);
    list.sort((a,b)=> String(a.name || "").localeCompare(String(b.name || ""), "en"));
    $("stList").innerHTML = list.length ? `<table class="t" style="min-width:560px"><thead><tr><th>নাম</th><th class="r">স্টক</th><th class="r">ন্যূনতম</th><th>নিকটতম মেয়াদ</th>${isAdmin() ? '<th class="r">মূল্য (কেনা)</th>' : ""}</tr></thead><tbody>
      ${list.map(p=>{ const ex = nearestExpiry(p); const xp = expiredPieces(p); return `<tr data-edit="${esc(p.id)}" style="cursor:pointer">
        <td><b>${esc(p.name)}</b>${p.rackLocation ? `<div class="hint">📍 ${esc(p.rackLocation)}</div>` : ""}${xp ? `<div class="hint bad">মেয়াদ শেষ: ${esc(stockText(p, xp))}</div>` : ""}</td>
        <td class="r num ${isLow(p) || !(p.qty > 0) ? "bad" : ""}">${esc(stockText(p))}</td>
        <td class="r num">${Number(p.min) > 0 ? esc(stockText(p, p.min)) : "—"}</td>
        <td>${ex ? `<span class="chip ${ex.days < 0 ? "red" : ex.days <= 30 ? "org" : ""}">${fmtDate(ex.date)}</span>` : "—"}</td>
        ${isAdmin() ? `<td class="r num">${money((Number(p.buy) || 0) * Math.max(0, Number(p.qty) || 0))}</td>` : ""}
      </tr>`; }).join("")}</tbody></table>` : `<div class="empty">এই ছাঁকনিতে কোনো ওষুধ নেই।</div>`;
    $("stList").querySelectorAll("[data-edit]").forEach(tr=> tr.onclick = ()=> openMedForm(tr.dataset.edit));
  };
  $("stQ").oninput = ()=>{ STOCK_Q = $("stQ").value.trim(); draw(); };
  draw();
}

/* 🔢 গণনা — গুনে পাওয়া সংখ্যা বসালে পার্থক্য ঠিক হয় */
function stockCount(){
  let P = null;
  $("stBody").innerHTML = `<div class="panel stForm">
    <h2>তাকে গুনে যা পেলেন</h2>
    <div class="hint">খাতায় এক রকম আর তাকে আরেক রকম হলে — গুনে আসল সংখ্যাটা বসান। পার্থক্যটা খতিয়ানে লেখা থাকবে।</div>
    <label class="f">ওষুধ</label><div class="pick"><input class="in" id="scQ" placeholder="নাম লিখে খুঁজুন…" autocomplete="off"><div class="drop" id="scD" hidden></div></div>
    <div id="scInfo"></div>
    <div class="row2"><div><label class="f">গুনে পাওয়া বক্স</label><input class="in num" id="scBox" inputmode="numeric" placeholder="০"></div><div><label class="f">খুচরা পিস</label><input class="in num" id="scPc" inputmode="numeric" placeholder="০"></div></div>
    <label class="f">কারণ</label><input class="in" id="scWhy" placeholder="যেমন: মাসিক গণনা, ভুল এন্ট্রি">
    <div class="calc" id="scCalc" hidden></div>
    <div class="foot"><button class="btn" type="button" id="scSave">💾 সমন্বয় করুন</button></div></div>`;
  const calc = ()=>{
    if(!P){ $("scCalc").hidden = true; return; }
    const counted = piecesFrom(P, $("scBox").value, $("scPc").value);
    const diff = counted - (Number(P.qty) || 0);
    $("scCalc").hidden = false;
    $("scCalc").innerHTML = `খাতায়: <b>${esc(stockText(P))}</b> · গুনে: <b>${esc(stockText(P, counted))}</b><br>পার্থক্য: <b class="${diff < 0 ? "neg" : diff > 0 ? "gain" : ""}">${diff > 0 ? "+" : diff < 0 ? "−" : ""}${esc(stockText(P, Math.abs(diff)))}</b>${isAdmin() && diff ? ` (${money(Math.abs(diff) * (Number(P.buy) || 0))})` : ""}`;
  };
  medPicker($("scQ"), $("scD"), (p)=>{ P = p; $("scInfo").innerHTML = `<div class="hint">খাতায় আছে: <b>${esc(stockText(p))}</b>${packOf(p).perBox > 1 ? " · ১ বক্স = " + bn(packOf(p).perBox) + " পিস" : ""}</div>`; $("scBox").focus(); calc(); });
  ["scBox","scPc"].forEach(x=> $(x).oninput = calc);
  $("scSave").onclick = ()=>{
    if(!P){ toast("ওষুধ বাছুন"); return; }
    if($("scBox").value === "" && $("scPc").value === ""){ toast("গুনে পাওয়া সংখ্যা লিখুন"); return; }
    const prods = loadProducts(); const p = prods.find(x=> x.id === P.id);
    const counted = piecesFrom(p, $("scBox").value, $("scPc").value);
    const diff = counted - (Number(p.qty) || 0);
    if(!diff){ toast("খাতা আর গণনা মিলে আছে — কিছু বদলাতে হবে না"); return; }
    if(!confirm(`${p.name}: ${diff > 0 ? "+" : "−"}${stockText(p, Math.abs(diff))}\nস্টক হবে ${stockText(p, counted)}। ঠিক আছে?`)) return;
    if(diff < 0) takeFromBatches(p, -diff);
    p.qty = counted;
    saveProducts(prods); syncBazarStock([p]);
    stockLog({ type:"adjust", pid:p.id, name:p.name, pieces: diff, value: r2(diff * (Number(p.buy) || 0)), reason: $("scWhy").value.trim() || "গণনা" });
    pushNow(); toast("✅ স্টক ঠিক করা হয়েছে"); stockCount(); refreshBell();
  };
}

/* 🗑️ নষ্ট / মেয়াদোত্তীর্ণ — ব্যাচ ধরে বাদ */
function stockDamage(){
  let P = null;
  const t0 = new Date(todayStr()).getTime();
  const expired = [];
  loadProducts().forEach(p=> (p.batches || []).forEach((b, i)=>{ if(b && Number(b.qty) > 0 && b.expiryDate && new Date(b.expiryDate).getTime() < t0) expired.push({ p, b, i }); }));
  $("stBody").innerHTML = `
    ${expired.length ? `<div class="panel" style="margin-bottom:14px"><h2 class="warn">মেয়াদ শেষ হয়ে গেছে — তাক থেকে সরান</h2>
      <table class="t"><thead><tr><th>নাম</th><th>ব্যাচ</th><th>মেয়াদ</th><th class="r">পরিমাণ</th><th></th></tr></thead><tbody>
      ${expired.map((x, k)=> `<tr><td>${esc(x.p.name)}</td><td>${esc(x.b.batchNo || "—")}</td><td class="bad">${fmtDate(x.b.expiryDate)}</td><td class="r num">${esc(stockText(x.p, x.b.qty))}</td><td class="r"><button class="btn red" type="button" data-wo="${k}">বাদ দিন</button></td></tr>`).join("")}
      </tbody></table></div>` : ""}
    <div class="panel stForm"><h2>নষ্ট / ভাঙা / হারানো ওষুধ বাদ দিন</h2>
      <label class="f">ওষুধ</label><div class="pick"><input class="in" id="sdQ" placeholder="নাম লিখে খুঁজুন…" autocomplete="off"><div class="drop" id="sdD" hidden></div></div>
      <label class="f">ব্যাচ</label><select class="in" id="sdBatch"><option value="">আগে মেয়াদ শেষ হওয়াটা থেকে</option></select>
      <div class="row2"><div><label class="f">বক্স</label><input class="in num" id="sdBox" inputmode="numeric" placeholder="০"></div><div><label class="f">পিস</label><input class="in num" id="sdPc" inputmode="numeric" placeholder="০"></div></div>
      <label class="f">কারণ</label><select class="in" id="sdWhy"><option>নষ্ট / ভাঙা</option><option>মেয়াদ শেষ</option><option>হারানো</option><option>নমুনা / ফ্রি দেওয়া</option><option>অন্যান্য</option></select>
      <div class="calc" id="sdCalc" hidden></div>
      <div class="foot"><button class="btn red" type="button" id="sdSave">🗑️ স্টক থেকে বাদ দিন</button></div></div>`;
  $("stBody").querySelectorAll("[data-wo]").forEach(b=> b.onclick = ()=>{
    const x = expired[+b.dataset.wo];
    if(!confirm(`${x.p.name} — ব্যাচ ${x.b.batchNo || "—"}, ${stockText(x.p, x.b.qty)} স্টক থেকে বাদ দেবেন?`)) return;
    writeOff(x.p.id, Number(x.b.qty), x.i, "মেয়াদ শেষ");
    stockDamage();
  });
  const calc = ()=>{
    if(!P){ $("sdCalc").hidden = true; return; }
    const n = piecesFrom(P, $("sdBox").value, $("sdPc").value);
    $("sdCalc").hidden = !n;
    $("sdCalc").innerHTML = `বাদ যাবে: <b class="neg">${esc(stockText(P, n))}</b>${isAdmin() ? ` · ক্ষতি ${money(n * (Number(P.buy) || 0))}` : ""}<br>বাকি থাকবে: <b>${esc(stockText(P, Math.max(0, (Number(P.qty) || 0) - n)))}</b>`;
  };
  medPicker($("sdQ"), $("sdD"), (p)=>{
    P = p;
    $("sdBatch").innerHTML = `<option value="">আগে মেয়াদ শেষ হওয়াটা থেকে</option>` + (p.batches || []).map((b, i)=> b && Number(b.qty) > 0 ? `<option value="${i}">${esc(b.batchNo || "ব্যাচ নম্বর নেই")} · ${b.expiryDate ? fmtDate(b.expiryDate) : "মেয়াদ নেই"} · ${esc(stockText(p, b.qty))}</option>` : "").join("");
    $("sdBox").focus(); calc();
  });
  ["sdBox","sdPc"].forEach(x=> $(x).oninput = calc);
  $("sdSave").onclick = ()=>{
    if(!P){ toast("ওষুধ বাছুন"); return; }
    const n = piecesFrom(P, $("sdBox").value, $("sdPc").value);
    if(!n){ toast("কতটা বাদ দেবেন লিখুন"); return; }
    if(n > (Number(P.qty) || 0)){ toast("স্টকে এতটা নেই"); return; }
    if(!confirm(`${P.name}: ${stockText(P, n)} স্টক থেকে বাদ দেবেন?`)) return;
    writeOff(P.id, n, $("sdBatch").value === "" ? null : +$("sdBatch").value, $("sdWhy").value);
    stockDamage();
  };
}
function writeOff(pid, pieces, batchIdx, why){
  const prods = loadProducts(); const p = prods.find(x=> x.id === pid); if(!p) return;
  pieces = Math.min(pieces, Number(p.qty) || 0);
  takeFromBatches(p, pieces, batchIdx);
  p.qty = Math.max(0, (Number(p.qty) || 0) - pieces);
  saveProducts(prods); syncBazarStock([p]);
  stockLog({ type:"damage", pid, name:p.name, pieces: -pieces, value: -r2(pieces * (Number(p.buy) || 0)), reason: why });
  pushNow(); toast("🗑️ বাদ দেওয়া হয়েছে"); refreshBell();
}

/* ↩️ কোম্পানিকে ফেরত — স্টক কমে, সরবরাহকারীর বাকি থেকে টাকা কমে */
function stockReturn(){
  let P = null;
  const sups = loadSuppliers();
  $("stBody").innerHTML = `<div class="panel stForm"><h2>কোম্পানি / সরবরাহকারীকে ফেরত</h2>
    <div class="hint">মেয়াদ শেষ হওয়ার আগে বা ভুল ওষুধ এলে ফেরত দিন। ফেরতের দাম সরবরাহকারীর বাকি থেকে কমে যাবে।</div>
    <label class="f">সরবরাহকারী *</label><select class="in" id="srSup"><option value="">— বেছে নিন —</option>${sups.map(s=> `<option value="${esc(s.id)}">${esc(s.name)}${isAdmin() && Number(s.due) > 0 ? " (বাকি " + esc(money(s.due)) + ")" : ""}</option>`).join("")}</select>
    <label class="f">ওষুধ</label><div class="pick"><input class="in" id="srQ" placeholder="নাম লিখে খুঁজুন…" autocomplete="off"><div class="drop" id="srD" hidden></div></div>
    <label class="f">ব্যাচ</label><select class="in" id="srBatch"><option value="">আগে মেয়াদ শেষ হওয়াটা থেকে</option></select>
    <div class="row3"><div><label class="f">বক্স</label><input class="in num" id="srBox" inputmode="numeric" placeholder="০"></div><div><label class="f">পিস</label><input class="in num" id="srPc" inputmode="numeric" placeholder="০"></div>
      <div><label class="f">ফেরতের মোট দাম</label><input class="in num" id="srVal" inputmode="decimal" placeholder="০"></div></div>
    <div class="calc" id="srCalc" hidden></div>
    <div class="foot"><button class="btn" type="button" id="srSave">↩️ ফেরত দিন</button></div></div>`;
  let valTouched = false;
  $("srVal").oninput = ()=>{ valTouched = true; calc(); };
  const calc = ()=>{
    if(!P){ $("srCalc").hidden = true; return; }
    const n = piecesFrom(P, $("srBox").value, $("srPc").value);
    if(!valTouched) $("srVal").value = n ? r2(n * (Number(P.buy) || 0)) : "";
    $("srCalc").hidden = !n;
    $("srCalc").innerHTML = `ফেরত যাবে: <b>${esc(stockText(P, n))}</b> · বাকি থেকে কমবে: <b>${money(Number($("srVal").value) || 0)}</b>`;
  };
  medPicker($("srQ"), $("srD"), (p)=>{
    P = p; valTouched = false;
    $("srBatch").innerHTML = `<option value="">আগে মেয়াদ শেষ হওয়াটা থেকে</option>` + (p.batches || []).map((b, i)=> b && Number(b.qty) > 0 ? `<option value="${i}">${esc(b.batchNo || "ব্যাচ নম্বর নেই")} · ${b.expiryDate ? fmtDate(b.expiryDate) : "মেয়াদ নেই"} · ${esc(stockText(p, b.qty))}</option>` : "").join("");
    $("srBox").focus(); calc();
  });
  ["srBox","srPc"].forEach(x=> $(x).oninput = calc);
  $("srSave").onclick = ()=>{
    const sid = $("srSup").value; if(!sid){ toast("সরবরাহকারী বাছুন"); return; }
    if(!P){ toast("ওষুধ বাছুন"); return; }
    const n = piecesFrom(P, $("srBox").value, $("srPc").value);
    if(!n){ toast("কতটা ফেরত দেবেন লিখুন"); return; }
    if(n > (Number(P.qty) || 0)){ toast("স্টকে এতটা নেই"); return; }
    const val = r2(Math.max(0, Number($("srVal").value) || 0));
    const sList = loadSuppliers(); const s = sList.find(x=> x.id === sid);
    if(!confirm(`${s.name}-কে ${P.name} ${stockText(P, n)} ফেরত, দাম ${money(val)}।\nঠিক আছে?`)) return;
    const prods = loadProducts(); const p = prods.find(x=> x.id === P.id);
    takeFromBatches(p, n, $("srBatch").value === "" ? null : +$("srBatch").value);
    p.qty = Math.max(0, (Number(p.qty) || 0) - n);
    saveProducts(prods); syncBazarStock([p]);
    if(val > 0){
      // সাধারণ POS-এ "ফেরত" ধরন নেই — বাকি কমানোর লেনদেন "payment" হিসেবে লেখা, নোটে ফেরত
      s.due = r2(Math.max(0, (Number(s.due) || 0) - val));
      localStorage.setItem("shop-suppliers", JSON.stringify(sList));
      const tx = readJSON("shop-supplier-txns", []); tx.push({ id: uid(), supplierId: s.id, type: "payment", amount: val, note: "↩️ ওষুধ ফেরত: " + p.name + " " + stockText(p, n), date: new Date().toISOString() });
      localStorage.setItem("shop-supplier-txns", JSON.stringify(tx));
    }
    stockLog({ type:"return", pid:p.id, name:p.name, pieces: -n, value: -val, reason: "ফেরত → " + s.name });
    pushNow(); toast("✅ ফেরত হয়েছে"); stockReturn(); refreshBell();
  };
}

/* =====================================================================
   📊 রিপোর্ট — শুধু এডমিন
   সাধারণ POS-এর একই নিয়মে: বিক্রি = নগদ-বিক্রি/বাকি/বদলি লাইনের দাম,
   লাভ = দাম − কেনা দাম, ফেরত আলাদা, ক্রয় = সরবরাহকারীর "purchase" লেনদেন।
   পুরো দোকানের খাতা থেকে (সাধারণ POS-এর বিক্রিও এখানে আসে)।
   ===================================================================== */
const SALE_ST = ["বাকি", "নগদ-বিক্রি", "বদলি"];
let REP = { from: null, to: null, view: "daily" };
const dkey = (d)=> d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
function repRange(){
  if(!REP.from){ const d = new Date(); REP.from = dkey(new Date(d.getFullYear(), d.getMonth(), 1)); REP.to = dkey(d); }
  return { f: new Date(REP.from + "T00:00:00").getTime(), t: new Date(REP.to + "T23:59:59.999").getTime() };
}
const inRange = (iso, R)=>{ const x = new Date(iso).getTime(); return !isNaN(x) && x >= R.f && x <= R.t; };

function repData(){
  const R = repRange();
  const all = loadEntries().filter(e=> inRange(e.date, R));
  const sales = all.filter(e=> SALE_ST.includes(e.status) && !(Number(e.depositAmount) > 0));
  const returns = all.filter(e=> e.status === "ফেরত");
  const deposits = all.filter(e=> Number(e.depositAmount) > 0);
  const exp = readJSON("shop-expenses", []).filter(x=> inRange(x.date, R));
  const delExp = readJSON("shop-deleted-expense-ids", []);
  const expenses = exp.filter(x=> !delExp.includes(x.id) && x.category !== "সাপ্লায়ার পেমেন্ট");
  const sTx = readJSON("shop-supplier-txns", []).filter(t=> inRange(t.date, R));
  const purchases = sTx.filter(t=> t.type === "purchase" && !/পুরাতন বাকি/.test(t.note || ""));
  const sum = (arr, f)=> r2(arr.reduce((a,x)=> a + (Number(f(x)) || 0), 0));
  return {
    R, sales, returns, deposits, expenses, purchases, sTx,
    totalSales: sum(sales, e=> e.price), cost: sum(sales, e=> e.cost),
    profit: sum(sales, e=> (Number(e.price) || 0) - (Number(e.cost) || 0)),
    returnVal: sum(returns, e=> e.returnValue), expense: sum(expenses, x=> x.amount),
    purchase: sum(purchases, t=> t.amount), depositIn: sum(deposits, e=> e.depositAmount),
    newDue: sum(sales, e=> Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0)),
    bills: new Set(sales.map(e=> e.billId || e.invoiceNo || e.id)).size,
  };
}

      <div class="stat b"><div class="ic">📥</div><div><div class="lbl">মোট ক্রয়</div><div class="val num">${money(D.purchase)}</div><div class="sub">${bn(D.purchases.length)}টি ক্রয়</div></div></div>
      <div class="stat o"><div class="ic">💰</div><div><div class="lbl">মোট লাভ</div><div class="val num">${money(D.profit)}</div><div class="sub">বিক্রি − কেনা দাম</div></div></div>
      <div class="stat r"><div class="ic">💸</div><div><div class="lbl">মোট ব্যয়</div><div class="val num">${money(D.expense)}</div><div class="sub">খরচের খাতা (সরবরাহকারীর টাকা বাদে)</div></div></div>
    </div>
    <div class="rGrid">
      <div class="panel rList">${views.map(([k,l])=> `<button type="button" data-rv="${k}" class="${k === REP.view ? "on" : ""}">${l}</button>`).join("")}</div>
      <div class="panel" id="rBody" style="overflow-x:auto"></div>

  $("rPrint").onclick = ()=>{ document.body.classList.add("printReport"); window.print(); setTimeout(()=> document.body.classList.remove("printReport"), 500); };
  ({ daily: repDaily, meds: repMeds, staff: repStaff, profit: repProfit, stock: repStock, expiry: repExpiry, customers: repCustomers, suppliers: repSuppliers })[REP.view](D);

const rangeTitle = ()=> `<div class="hint" style="margin:-6px 0 10px">${fmtDate(REP.from)} — ${fmtDate(REP.to)}</div>`;
function tbl(head, rows, foot){
  if(!rows.length) return `<div class="empty">এই সময়ে কিছু নেই।</div>`;
  return `<table class="t" style="min-width:520px"><thead><tr>${head.map(h=> `<th class="${h[1] || ""}">${h[0]}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody>${foot ? `<tfoot><tr style="font-weight:700">${foot.map((f,i)=> `<td class="${head[i][1] || ""}">${f}</td>`).join("")}</tr></tfoot>` : ""}</table>`;
}

function repDaily(D){
  const by = {};
  D.sales.forEach(e=>{ const k = dkey(new Date(e.date)); const o = by[k] = by[k] || { bills:new Set(), sale:0, profit:0, cash:0, bank:0, due:0 };
    o.bills.add(e.billId || e.invoiceNo || e.id); o.sale += Number(e.price) || 0; o.profit += (Number(e.price) || 0) - (Number(e.cost) || 0);
    const due = Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0); o.due += due;
    if(e.paymentMethod === "bank") o.bank += (Number(e.price) || 0) - due; else o.cash += (Number(e.price) || 0) - due; });
  const keys = Object.keys(by).sort().reverse();
  $("rBody").innerHTML = `<h2>🗓️ দৈনিক বিক্রয়</h2>${rangeTitle()}` + tbl(
    [["তারিখ"],["ইনভয়েস","r"],["বিক্রয়","r"],["নগদ","r"],["ব্যাংক/বিকাশ","r"],["বাকি","r"],["লাভ","r"]],
    keys.map(k=>{ const o = by[k]; return `<tr><td>${fmtDate(k)}</td><td class="r num">${bn(o.bills.size)}</td><td class="r num">${money(o.sale)}</td><td class="r num">${money(o.cash)}</td><td class="r num">${money(o.bank)}</td><td class="r num">${money(o.due)}</td><td class="r num">${money(o.profit)}</td></tr>`; }),
    ["মোট", bn(D.bills), money(D.totalSales), money(keys.reduce((a,k)=> a + by[k].cash, 0)), money(keys.reduce((a,k)=> a + by[k].bank, 0)), money(D.newDue), money(D.profit)]);

function repMeds(D){

function repProfit(D){
  // স্টক থেকে বাদ (নষ্ট/মেয়াদ) — খতিয়ান থেকে
  const lossLog = readJSON(SLOG_KEY, []).filter(r=> r.type === "damage" && inRange(r.date, D.R));
  const loss = r2(lossLog.reduce((a,r)=> a + Math.abs(Number(r.value) || 0), 0));
  const net = r2(D.profit - D.returnVal - D.expense - loss);
  const line = (l, v, cls)=> `<div style="display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line)"><span>${l}</span><b class="num ${cls || ""}">${v}</b></div>`;

    ${line("মোট বিক্রয়", money(D.totalSales))}
    ${line("− বিক্রিত ওষুধের কেনা দাম", money(D.cost))}
    ${line("= মোট লাভ (গ্রস)", money(D.profit), "gain")}
    ${line("− বিক্রি ফেরত", money(D.returnVal))}
    ${line("− খরচ (ভাড়া, বেতন, বিল…)", money(D.expense))}
    ${line("− নষ্ট / মেয়াদ শেষে বাদ", money(loss))}
    <div style="display:flex; justify-content:space-between; padding:12px 0; font-size:20px"><b>নিট ${net >= 0 ? "লাভ" : "ক্ষতি"}</b><b class="num ${net >= 0 ? "gain" : "neg"}">${money(Math.abs(net))}</b></div>
    <div class="hint">এই সময়ে বাকি আদায় হয়েছে ${money(D.depositIn)} · নতুন বাকি পড়েছে ${money(D.newDue)}</div></div>`;
}
function repStock(){
  const prods = loadProducts().slice().sort((a,b)=> String(a.name || "").localeCompare(String(b.name || ""), "en"));
  const val = r2(prods.reduce((a,p)=> a + (Number(p.buy) || 0) * Math.max(0, Number(p.qty) || 0), 0));
  $("rBody").innerHTML = `<h2>📦 স্টক রিপোর্ট</h2><div class="hint" style="margin:-6px 0 10px">আজকের অবস্থা</div>` + tbl(
    [["ওষুধ"],["জেনেরিক"],["স্টক","r"],["কেনা দাম (পিস)","r"],["মূল্য","r"]],
    prods.map(p=> `<tr><td>${esc(p.name)}</td><td>${esc(p.genericName || "—")}</td><td class="r num ${isLow(p) ? "bad" : ""}">${esc(stockText(p))}</td><td class="r num">${money(p.buy || 0)}</td><td class="r num">${money((Number(p.buy) || 0) * Math.max(0, Number(p.qty) || 0))}</td></tr>`),
    ["মোট", "", "", "", money(val)]);
}
function repExpiry(){
  const t0 = new Date(todayStr()).getTime(); const rows = [];
  loadProducts().forEach(p=> (p.batches || []).forEach(b=>{ if(!b || !(Number(b.qty) > 0) || !b.expiryDate) return; const days = Math.round((new Date(b.expiryDate).getTime() - t0) / 864e5); if(days <= 90) rows.push({ p, b, days }); }));
  rows.sort((a,b)=> a.days - b.days);
  const val = r2(rows.reduce((a,x)=> a + (Number(x.p.buy) || 0) * Number(x.b.qty), 0));
  $("rBody").innerHTML = `<h2>⏳ মেয়াদোত্তীর্ণ রিপোর্ট</h2><div class="hint" style="margin:-6px 0 10px">মেয়াদ শেষ বা ৯০ দিনের মধ্যে শেষ হবে</div>` + tbl(
    [["ওষুধ"],["ব্যাচ"],["মেয়াদ"],["বাকি দিন","r"],["পরিমাণ","r"],["মূল্য (কেনা)","r"]],
    rows.map(x=> `<tr><td>${esc(x.p.name)}</td><td>${esc(x.b.batchNo || "—")}</td><td>${fmtDate(x.b.expiryDate)}</td><td class="r num ${x.days < 0 ? "bad" : x.days <= 30 ? "bad" : ""}">${x.days < 0 ? "শেষ" : bn(x.days)}</td><td class="r num">${esc(stockText(x.p, x.b.qty))}</td><td class="r num">${money((Number(x.p.buy) || 0) * Number(x.b.qty))}</td></tr>`),
    ["মোট", "", "", "", "", money(val)]);
}
function repCustomers(D){
  const by = {};
  D.sales.forEach(e=>{ if(!e.name || e.name === "ওয়াক-ইন কাস্টমার" || e.name === "Unknown Customer") return; const k = e.phone ? "p:" + e.phone : "n:" + e.name; const o = by[k] = by[k] || { name:e.name, phone:e.phone, bills:new Set(), sale:0 }; o.bills.add(e.billId || e.invoiceNo || e.id); o.sale += Number(e.price) || 0; });
  const dues = dueSummary(loadEntries()).map;

}

/* =====================================================================
   📒 হিসাব (Accounts) — শুধু এডমিন
   নগদ/ব্যাংকের হিসাব সাধারণ POS-এর opsCalcCashBankBalance()-এর হুবহু নিয়মে:
   শুরুর টাকা + বিক্রিতে পাওয়া (paid) + বাকি আদায় (status "নগদ") ± নগদ↔ব্যাংক বদল
   + হাতে যোগ করা টাকা − খরচ (ফেরত না হওয়া) − ফেরতে নগদ দেওয়া
   ===================================================================== */
const EXP_CATS = ["দোকান ভাড়া","বিদ্যুৎ বিল","পরিবহন","মেরামত/রক্ষণাবেক্ষণ","স্টাফ বেতন","স্টাফ অন্যান্য টাকা","সাপ্লায়ার পেমেন্ট","অন্যান্য"];
const CLOSE_KEY = "hb-pharma-closings";
function activeExpenses(){ const del = readJSON("shop-deleted-expense-ids", []); return readJSON("shop-expenses", []).filter(x=> x && !x.refunded && !del.includes(x.id)); }
function cashBank(){
  let cash = Number(localStorage.getItem("ops-opening-cash")) || 0, bank = Number(localStorage.getItem("ops-opening-bank")) || 0;
  loadEntries().forEach(e=>{
    const pm = e.paymentMethod || "cash";
    if(SALE_ST.includes(e.status)){ if(pm === "cash") cash += Number(e.paid) || 0; else bank += Number(e.paid) || 0; }
    if(e.status === "নগদ"){ const a = Number(e.depositAmount) || 0; if(pm === "cash") cash += a; else bank += a; }
    if(e.status === "ফেরত" && e.cashBack === "yes") cash -= Number(e.returnValue) || 0;
  });
  readJSON("cash-bank-transfers", []).forEach(t=>{ const a = Number(t.amount) || 0; if(t.from === "bank" && t.to === "cash"){ bank -= a; cash += a; } else if(t.from === "cash" && t.to === "bank"){ cash -= a; bank += a; } });
  activeExpenses().forEach(x=>{ const a = Number(x.amount) || 0; if((x.method || "cash") === "bank") bank -= a; else cash -= a; });
  readJSON("shop-cash-adjustments", []).forEach(a=>{ const v = Number(a.amount) || 0; if((a.method || "cash") === "bank") bank += v; else cash += v; });
  return { cash: r2(cash), bank: r2(bank) };
}
// আজকের নগদ/ব্যাংক আসা-যাওয়া
function todayFlows(){
  const t = todayStr(); const isT = (iso)=> dkey(new Date(iso)) === t;
  const f = { cashIn:0, bankIn:0, cashOut:0, bankOut:0, sales:0, deposits:0, expenses:0 };
  loadEntries().forEach(e=>{ if(!isT(e.date)) return; const pm = e.paymentMethod || "cash";
    if(SALE_ST.includes(e.status)){ const v = Number(e.paid) || 0; f.sales += v; if(pm === "cash") f.cashIn += v; else f.bankIn += v; }
    if(e.status === "নগদ"){ const v = Number(e.depositAmount) || 0; f.deposits += v; if(pm === "cash") f.cashIn += v; else f.bankIn += v; }
    if(e.status === "ফেরত" && e.cashBack === "yes") f.cashOut += Number(e.returnValue) || 0; });
  activeExpenses().forEach(x=>{ if(!isT(x.date)) return; const v = Number(x.amount) || 0; f.expenses += v; if((x.method || "cash") === "bank") f.bankOut += v; else f.cashOut += v; });
  readJSON("shop-cash-adjustments", []).forEach(a=>{ if(!isT(a.date)) return; const v = Number(a.amount) || 0; const bank = (a.method || "cash") === "bank";
    if(v >= 0){ if(bank) f.bankIn += v; else f.cashIn += v; } else { if(bank) f.bankOut += -v; else f.cashOut += -v; } });
  return f;
}

      </div>

  $("aExp").onclick = openExpenseForm;

    if($("dcCount").value === ""){ toast("গুনে কত পেলেন লিখুন"); return; }
    const counted = r2(Number($("dcCount").value) || 0), diff = r2(counted - B.cash), note = $("dcNote").value.trim();
    const cl = readJSON(CLOSE_KEY, []); cl.unshift({ id: uid(), date: new Date().toISOString(), expected: B.cash, counted, diff, note, by: (SESSION && SESSION.name) || "", cashIn: F.cashIn, cashOut: F.cashOut });
    localStorage.setItem(CLOSE_KEY, JSON.stringify(cl.slice(0, 120)));
    if($("dcFix").checked && Math.abs(diff) >= 0.01){
      const a = readJSON("shop-cash-adjustments", []); a.push({ id: uid(), amount: diff, method: "cash", note: "দিন শেষের হিসাবে পার্থক্য" + (note ? " · " + note : ""), date: new Date().toISOString(), by: (SESSION && SESSION.name) || "" });
      localStorage.setItem("shop-cash-adjustments", JSON.stringify(a));
    }
    closeModal(); pushNow(); toast(Math.abs(diff) < 0.01 ? "✅ হিসাব মিলেছে" : "🔒 হিসাব বন্ধ — পার্থক্য " + money(Math.abs(diff))); pageAccounts();
  };
}

async function pageUsers(){
  $("page").innerHTML = `<div class="pageHead"><h1>ব্যবহারকারী</h1>${isAdmin() ? `<button class="btn" type="button" id="addStaffBtn">➕ নতুন স্টাফ</button>` : ""}</div><div class="panel" id="usersBox"><div class="empty">লোড হচ্ছে…</div></div>`;
  if($("addStaffBtn")) $("addStaffBtn").onclick = openAddStaff;
  const entries = loadEntries();
  const t = todayStr();
  const todayBy = {};
  entries.forEach(e=>{ const d = new Date(e.date); if(isNaN(d)) return; const k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); if(k !== t) return; todayBy[e.soldBy || "এডমিন"] = (todayBy[e.soldBy || "এডমিন"] || 0) + (Number(e.price) || 0); });
  let members = [];
  try{ const qs = await db.collection("shops").doc(SESSION.shopId).collection("members").get(); members = qs.docs.map(d=> d.data()); }catch(e){}
  const rows = [{ name: SESSION.name || "এডমিন", role: "admin", email: "" }].concat(members.filter(m=> m.role === "subuser"));
  $("usersBox").innerHTML = `<table class="t"><thead><tr><th>নাম</th><th>ভূমিকা</th><th class="r">আজকের বিক্রি</th></tr></thead><tbody>
    ${rows.map(m=> `<tr><td><b>${esc(m.name)}</b>${m.email ? `<div class="hint">${esc(m.email)}</div>` : ""}</td><td>${m.role === "admin" ? "এডমিন" : "স্টাফ"}</td><td class="r num">${money(todayBy[m.name] || 0)}</td></tr>`).join("")}
  </tbody></table>
  <p class="hint" style="margin-top:12px">স্টাফরা নিজের ইমেইল-পাসওয়ার্ডে <b>honeybeebazar.com/login.html</b> থেকে লগইন করলে সরাসরি এই ফার্মেসি অ্যাপে ঢোকেন। বিক্রি ও স্টকের কাজ করতে পারেন — টাকার হিসাব দেখতে পারেন না। প্রতিটা বিক্রিতে কে বিক্রি করলেন সেটা রসিদে থাকে।<br>স্টাফ কী কী করতে পারবেন (ডিসকাউন্ট, বাকি, ক্রয়, নষ্ট বাদ) — ⚙️ সেটিংস থেকে ঠিক করুন।</p>`;
}

function openAddStaff(){
  openModal(`<div class="head"><h3>➕ নতুন স্টাফ</h3><button class="x" type="button" data-close aria-label="বন্ধ">✕</button></div>
    <label class="f">স্টাফের নাম *</label><input class="in" id="stName" maxlength="40" placeholder="যেমন: রাকিব">
    <label class="f">ইমেইল * <span class="hint">(এটা দিয়েই লগইন করবেন)</span></label><input class="in" id="stEmail" type="email" autocomplete="off" placeholder="rakib@gmail.com">
    <label class="f">পাসওয়ার্ড * <span class="hint">(কমপক্ষে ৬ অক্ষর)</span></label><input class="in" id="stPass" type="text" autocomplete="off" placeholder="যেমন: rakib123">
    <div class="hint" id="stMsg" style="min-height:18px; margin-top:8px; color:var(--red)"></div>
    <div class="foot"><button class="btn ghost" type="button" data-close>বাতিল</button><button class="btn" type="button" id="stSave">✅ স্টাফ তৈরি করুন</button></div>`);
  $("stSave").onclick = async ()=>{
    const name = $("stName").value.trim(), email = $("stEmail").value.trim().toLowerCase(), pass = $("stPass").value;
    if(!name){ $("stMsg").textContent = "নাম দিন"; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $("stMsg").textContent = "সঠিক ইমেইল দিন"; return; }
    if(pass.length < 6){ $("stMsg").textContent = "পাসওয়ার্ড কমপক্ষে ৬ অক্ষর"; return; }
    if(typeof secondaryAuth === "undefined"){ $("stMsg").textContent = "পাতা রিফ্রেশ করে আবার চেষ্টা করুন"; return; }
    const btn = $("stSave"); btn.disabled = true; btn.textContent = "⏳ তৈরি হচ্ছে…";
    try{
      const cred = await secondaryAuth.createUserWithEmailAndPassword(email, pass);
      const uid = cred.user.uid;
      const now = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection("users").doc(uid).set({ uid, shopId: SESSION.shopId, role: "subuser", name, email, createdAt: now });
      await db.collection("shops").doc(SESSION.shopId).collection("members").doc(uid).set({ uid, name, role: "subuser", email, createdAt: now });
      await secondaryAuth.signOut().catch(()=>{});
      openModal(`<div class="head"><h3>✅ স্টাফ তৈরি হয়েছে</h3></div>
        <div class="calc">স্টাফকে এই তথ্য দিন:<br>🌐 <b>honeybeebazar.com/login.html</b><br>📧 ইমেইল: <b>${esc(email)}</b><br>🔑 পাসওয়ার্ড: <b>${esc(pass)}</b></div>
        <div class="hint" style="margin-top:8px">লগইন করলেই সরাসরি এই ফার্মেসি অ্যাপ খুলবে।</div>
        <div class="foot"><button class="btn" type="button" data-close>ঠিক আছে</button></div>`);
      if(CUR_PAGE === "users") setTimeout(pageUsers, 300);
    }catch(e){
      btn.disabled = false; btn.textContent = "✅ স্টাফ তৈরি করুন";
      const c = e && e.code;
      $("stMsg").textContent = c === "auth/email-already-in-use" ? "এই ইমেইলে আগেই একাউন্ট আছে — অন্য ইমেইল দিন"
        : c === "auth/invalid-email" ? "ইমেইলটা ঠিক নেই" : c === "auth/weak-password" ? "পাসওয়ার্ড আরও শক্ত দিন" : ("তৈরি হয়নি: " + (e.message || e));
    }
  };
}

/* =====================================================================
   📄 প্রেসক্রিপশন (দোকানের দিক)
   গ্রাহক Bazar থেকে ছবি পাঠান → এখানে দেখে ওষুধ, দাম আর খাওয়ার নিয়ম
   লিখে পাঠানো হয়। ছবি আর নিয়ম কোর্স শেষের ৩ দিন পর নিজে মুছে যায়।
   ===================================================================== */
let RX_LIST = [], RX_UNSUB = null, RX_FIRST = true, RX_TAB = "new";
const RX_TABS = [["new","🆕 নতুন"],["quoted","💬 দাম পাঠানো"],["accepted","✅ অর্ডার হয়েছে"],["closed","বাতিল"]];
const RX_FOOD = { after:"খাবারের পরে", before:"খাবারের আগে", any:"যেকোনো সময়" };
function rxListen(){
  if(RX_UNSUB || !SESSION || !SESSION.shopId || typeof db === "undefined") return;
  RX_UNSUB = db.collection("prescriptions").where("shopId","==",SESSION.shopId).onSnapshot(qs=>{
    RX_LIST = qs.docs.map(d=> ({ id:d.id, ...d.data() }))
      .sort((a,b)=> (b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0) - (a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0));
    if(!RX_FIRST) qs.docChanges().forEach(c=>{ if(c.type === "added" && c.doc.data().status === "new") toast("📄 নতুন প্রেসক্রিপশন এসেছে", 4000); });
    RX_FIRST = false;
    renderNav();
    if(CUR_PAGE === "rx" && !document.querySelector(".modal")) pageRx();
  }, err=> console.warn("prescriptions listen failed", err));
}
function rxWhen(r){ return r.createdAt && r.createdAt.toDate ? r.createdAt.toDate().toLocaleString("bn-BD", { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" }) : ""; }
function pageRx(){
  const inTab = r=> RX_TAB === "closed" ? ["rejected","cancelled"].includes(r.status) : r.status === RX_TAB;
  const list = RX_LIST.filter(inTab);
  const cnt = k=> RX_LIST.filter(r=> k === "closed" ? ["rejected","cancelled"].includes(r.status) : r.status === k).length;
  $("page").innerHTML = `<div class="pageHead"><h1>📄 প্রেসক্রিপশন</h1><div class="date">গ্রাহক Bazar থেকে ছবি পাঠান — দেখে ওষুধ, দাম আর খাওয়ার নিয়ম লিখে পাঠান</div></div>
    <div class="tabs">${RX_TABS.map(([k,l])=> `<button type="button" data-rxt="${k}" class="${k === RX_TAB ? "on" : ""}">${l} (${bn(cnt(k))})</button>`).join("")}</div>
    <div class="panel" style="padding:8px">${list.length ? list.map(r=> `
      <div data-rxo="${esc(r.id)}" style="display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--line); cursor:pointer">
        <div style="font-size:26px">📄</div>
        <div style="flex:1; min-width:0">
          <div style="font-weight:700">${esc(r.customerName || "গ্রাহক")} <span class="hint">· 📞 ${esc(r.phone || "")}</span></div>
          <div class="hint">${esc(rxWhen(r))}${r.note ? " · " + esc(r.note) : ""}</div>
        </div>
        ${r.total ? `<b class="num">${money(r.total)}</b>` : ""}

/* =====================================================================
   📍 দোকানের লোকেশন — POS-এর হুবহু একই কোড। না থাকলে Bazar-এ ডেলিভারি অর্ডার নেওয়া যায় না
   (ডেলিভারি চার্জ এখান থেকেই মাপা হয়, রাইডারও এটা ধরে আসেন)।
   ===================================================================== */
const HB_LOC_MAX_ACCURACY_M = 100;
const HB_LOC_GOOD_ACCURACY_M = 25;
const HB_LOC_LISTEN_MS = 20000;

function hbGetAccurateFix(onProgress){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation) return reject(new Error("nosupport"));
    let best = null, done = false, watchId = null, timer = null;
    const finish = (err)=>{
      if(done) return; done = true;
      if(watchId !== null) navigator.geolocation.clearWatch(watchId);
      clearTimeout(timer);
      if(best) resolve(best); else reject(err || new Error("timeout"));
    };
    watchId = navigator.geolocation.watchPosition((p)=>{
      if(!best || p.coords.accuracy < best.coords.accuracy) best = p;
      if(onProgress) onProgress(Math.round(best.coords.accuracy));
      if(best.coords.accuracy <= HB_LOC_GOOD_ACCURACY_M) finish();
    }, (err)=>{ if(!best) finish(err); }, { enableHighAccuracy: true, maximumAge: 0, timeout: HB_LOC_LISTEN_MS });
    timer = setTimeout(()=> finish(), HB_LOC_LISTEN_MS);
  });
}

/* ছোট পর্দা: ম্যাপে পিন + তিনটা বাটন। ফেরত দেয় "save" | "retry" | "cancel" */
function hbLocConfirm(lat, lng, acc, placeName){
  return new Promise((resolve)=>{
    const d = 0.0025;
    const src = "https://www.openstreetmap.org/export/embed.html?bbox="
      + (lng-d) + "%2C" + (lat-d) + "%2C" + (lng+d) + "%2C" + (lat+d) + "&layer=mapnik&marker=" + lat + "%2C" + lng;
    const good = acc <= HB_LOC_MAX_ACCURACY_M;
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;";
    ov.innerHTML =
      '<div style="background:#1f1609;color:#fff8e8;border:1px solid rgba(255,209,102,.3);border-radius:16px;max-width:420px;width:100%;padding:16px;font-family:inherit;">'
      + '<div style="font-weight:800;font-size:15px;margin-bottom:8px;">📍 ' + placeName + ' অবস্থান ঠিক আছে?</div>'
      + '<iframe src="' + src + '" style="width:100%;height:230px;border:0;border-radius:10px;background:#333;"></iframe>'
      + '<div style="font-size:12.5px;margin:10px 0;line-height:1.6;">'
      + (good
          ? '✅ নির্ভুলতা প্রায় <b>' + acc + ' মিটার</b>। লাল পিনটা ' + placeName + ' উপরে থাকলে সেভ করুন।'
          : '⚠️ লোকেশন অস্পষ্ট — প্রায় <b>' + acc + ' মিটার</b> এদিক-ওদিক হতে পারে, তাই সেভ করা যাবে না।<br>দরজার কাছে বা খোলা জায়গায় গিয়ে আবার চেষ্টা করুন, ফোনের লোকেশন "High accuracy" রাখুন।')
      + '</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
      + (good ? '<button data-a="save" style="flex:1;padding:12px;border:0;border-radius:10px;font-weight:800;background:#2fbf71;color:#fff;font-family:inherit;">✅ ঠিক আছে, সেভ করুন</button>' : '')
      + '<button data-a="retry" style="flex:1;padding:12px;border:0;border-radius:10px;font-weight:700;background:#ffb703;color:#1a1206;font-family:inherit;">🔄 আবার নিন</button>'
      + '<button data-a="cancel" style="padding:12px 14px;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:transparent;color:#fff8e8;font-family:inherit;">বাতিল</button>'
      + '</div></div>';
    ov.addEventListener("click", (e)=>{
      const a = e.target && e.target.getAttribute && e.target.getAttribute("data-a");
      if(!a) return;
      ov.remove(); resolve(a);
    });
    document.body.appendChild(ov);
  });
}

/* পুরো কাজ: GPS নেওয়া → মিলিয়ে দেখা → সেভ। docRef = shops/{id} বা restaurants/{uid} */
async function hbCaptureStoreLocation(docRef, uid, placeName, setBusyText){
  while(true){
    let pos;
    try{
      pos = await hbGetAccurateFix((acc)=> setBusyText && setBusyText("📍 খোঁজা হচ্ছে... (±" + acc + " মি)"));
    }catch(err){
      setBusyText && setBusyText(null);
      alert(err && err.message === "nosupport" ? "এই ফোনে লোকেশন সাপোর্ট নেই।"
        : "লোকেশন পাওয়া যায়নি — ফোনের Location চালু আছে কিনা আর এই সাইটকে অনুমতি দেওয়া আছে কিনা দেখুন।");
      return null;
    }
    setBusyText && setBusyText(null);
    const lat = pos.coords.latitude, lng = pos.coords.longitude, acc = Math.round(pos.coords.accuracy);
    const choice = await hbLocConfirm(lat, lng, acc, placeName);
    if(choice === "cancel") return null;
    if(choice === "retry") continue;
    const now = firebase.firestore.FieldValue.serverTimestamp();
    const loc = { lat: lat, lng: lng, accuracyM: acc, updatedAt: now, updatedBy: uid };
    const batch = db.batch();
    batch.set(docRef, { storeLocation: loc }, { merge: true });
    batch.set(docRef.collection("locationLog").doc(), { lat: lat, lng: lng, accuracyM: acc, by: uid, at: now });
    await batch.commit();
    return { lat: lat, lng: lng, accuracyM: acc };
  }
}

/* উপরের লাল ব্যানার। loc না থাকলে দেখায়, থাকলে সরিয়ে দেয়। */

    el = document.createElement("div");
    el.id = "hbLocBanner";
    el.style.cssText = "position:sticky;top:0;z-index:9999;background:#b3261e;color:#fff;padding:10px 14px;font-size:13px;font-weight:700;line-height:1.5;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.35);";
    document.body.insertBefore(el, document.body.firstChild);
  }
  el.innerHTML = '<span style="flex:1;">📍 ' + placeName + ' লোকেশন দেওয়া নেই — Honey Bee Bazar-এ ডেলিভারি অর্ডার আসবে না।'
    + (canSet ? '' : '<br><span style="font-weight:400;">দোকানের মালিক (এডমিন) লগইন করে লোকেশন দিন।</span>') + '</span>'
    + (canSet ? '<button type="button" style="flex-shrink:0;padding:9px 12px;border:0;border-radius:9px;background:#fff;color:#b3261e;font-weight:800;font-family:inherit;">এখনই দিন</button>' : '');
  const b = el.querySelector("button");
  if(b) b.onclick = onClick;
}


let __phHasLoc = null;
async function phSetShopLocation(btn){
  if(!isAdmin()){ alert("শুধু দোকানের মালিক (এডমিন) লোকেশন দিতে পারবেন।"); return; }
  const orig = btn ? btn.textContent : "";
  const setBusy = (t)=>{ if(btn){ btn.textContent = t || orig; btn.disabled = !!t; } const bb = document.querySelector("#hbLocBanner button"); if(bb){ bb.disabled = !!t; bb.textContent = t ? "⏳" : "এখনই দিন"; } };
  try{
    const loc = await hbCaptureStoreLocation(db.collection("shops").doc(SESSION.shopId), SESSION.uid || (auth.currentUser && auth.currentUser.uid), "দোকানের", setBusy);
    if(!loc) return;
    __phHasLoc = true;
    hbShowLocBanner(true);
    alert("✅ দোকানের লোকেশন সেভ হয়েছে (±" + loc.accuracyM + " মিটার)। এখন Bazar থেকে ডেলিভারি অর্ডার আসবে।");
    if(CUR_PAGE === "settings") go("settings");
  }catch(e){ setBusy(null); alert("সেভ করা যায়নি: " + (e.code || e.message)); }
}

/* =====================================================================
   শুরু
   ===================================================================== */
auth.onAuthStateChanged(async (user)=>{
  const s = getSession();
  if(!user || !s || !s.shopId || (s.role !== "admin" && s.role !== "subuser")){ location.replace(s && !s.shopId ? "shop-ledger-app.html" : "login.html"); return; }
  SESSION = s;
  $("gateMsg").textContent = "ক্লাউড থেকে খাতা মেলানো হচ্ছে…";
  try{ await Promise.race([pullCloudToLocalStorage(s.shopId), new Promise((_, rej)=> setTimeout(()=> rej(new Error("timeout")), 12000))]); }catch(e){}
  try{
    const sd = await db.collection("shops").doc(s.shopId).get();
    const info = sd.exists ? sd.data() : {};
    if(info.status === "blocked"){ $("gateMsg").textContent = "🔒 একাউন্ট ব্লক করা আছে — এডমিনের সাথে যোগাযোগ করুন।"; return; }
    if(info.currencySymbol) localStorage.setItem("shop-currency-symbol", info.currencySymbol);
    setTimeout(()=>{ try{ hbAskShopPhone(s.shopId, info, s.role); }catch(e){} }, 1500);
    // 📍 লোকেশন না থাকলে উপরে লাল ব্যানার (শুধু Bazar-এ থাকা দোকানে)
    __phHasLoc = !!(info.storeLocation && info.storeLocation.lat != null);
    if(info.onlineEnabled !== false && (!info.countryCode || info.countryCode === "BD"))
      hbShowLocBanner(__phHasLoc, "দোকানের", s.role === "admin", function(){ phSetShopLocation(this); });
  }catch(e){}
  enableAutoSync(s.shopId);
  // 💊 ফার্মেসি হিসেবে নিবন্ধিত দোকানে মোড প্রথমবার নিজে থেকেই চালু হয় (সব ফোনে সিঙ্ক),
  // যাতে কোনো ফোনে সাধারণ POS খুললেও সোজা এখানে চলে আসে
  if(s.shopType === "pharmacy" && localStorage.getItem("hb-pharmacy-mode") === null) localStorage.setItem("hb-pharmacy-mode", "1");
  watchAppDataChanges(s.shopId, ()=>{
    // অন্য ফোনে (স্টাফ) বিক্রি/স্টক বদলালে এখানেও সাথে সাথে দেখা যায়
    if(localStorage.getItem("hb-pharmacy-mode") === "0" && !isAdmin()){ location.replace("shop-ledger-app.html"); return; }
    if(!document.querySelector(".modal")) go(CUR_PAGE); else refreshBell();
  });

  $("shopName").textContent = localStorage.getItem("shop-title") || s.shopName || "ফার্মেসি";
  $("meName").textContent = s.name || "—";
  $("meRole").textContent = isAdmin() ? "এডমিন" : "স্টাফ";
  netLabel();
  $("gate").remove(); $("app").hidden = false; $("bnav").hidden = false;
  const start = (location.hash || "").replace("#", "");
  rxListen();
  go(["dash","pos","rx","meds","alerts","purchase","suppliers","customers","stock"].includes(start) || MENU.some(m=> m.key === start && (!m.admin || isAdmin())) ? start : "dash");
});
</script>
