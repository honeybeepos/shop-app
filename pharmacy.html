<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E2430">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Honey Bee ফার্মেসি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  💊 Honey Bee ফার্মেসি মোড
  ─────────────────────────────────────────────────────────────
  সাধারণ POS (shop-ledger-app.html) আর এই পাতা একই খাতা ব্যবহার করে —
  প্রোডাক্ট (bcc-products), বিক্রি (phone-shop-entries), ক্যাটাগরি সব একই।
  firebase-init.js-এর সিঙ্ক ইঞ্জিন localStorage ↔ Firestore মিলিয়ে রাখে,
  তাই এখানে বিক্রি করলে সাধারণ POS-এর হিসাবেও দেখা যায়, আর মোড বদলালে কিছু হারায় না।

  ওষুধের হিসাব সবসময় "পিস"-এ রাখা হয় (p.qty, p.buy, p.sell = ১ পিসের),
  আর বক্স/পাতা শুধু দেখানো ও বিক্রির সময় গুণ করে বের করা হয় —
  ঠিক সাধারণ POS যেভাবে স্টক কমায় (bccAdjustStockForSale), তার সাথে মিল রেখে।

  মোড চালু/বন্ধ: localStorage "hb-pharmacy-mode" = "1" (দোকানের সব ফোনে সিঙ্ক হয়)।
  শুধু এডমিন বদলাতে পারেন; সাব-ইউজার (স্টাফ) বিক্রি ও স্টকের কাজ করতে পারেন,
  টাকার হিসাব (মোট বিক্রি, স্টকের দাম) দেখেন না — সাধারণ POS-এর নিয়মের মতোই।
-->
<style>
  :root{
    --honey:#F4B400; --honey-deep:#D99A00; --honey-soft:#FFF4D1;
    --ink:#1E2430; --ink-2:#2A3140; --ink-3:#5B6474; --muted:#8A93A3;
    --paper:#F5F6F8; --card:#FFFFFF; --line:#E6E8EC;
    --green:#1F9D55; --green-soft:#E3F5EA; --red:#E5484D; --red-soft:#FDECEC; --blue:#2F6FED; --blue-soft:#E8F0FE;
    --r-lg:16px; --r-md:12px; --r-sm:9px;
    --nav-h:62px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; overflow-x:hidden; }
  body{ background:var(--paper); color:var(--ink); font-family:'Hind Siliguri', system-ui, sans-serif; font-size:15px; line-height:1.5; -webkit-tap-highlight-color:transparent; }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:3px solid var(--honey); outline-offset:2px; }
  .num{ font-variant-numeric:tabular-nums; }
  [hidden]{ display:none !important; }

  /* ── লোডিং পর্দা ── */
  #gate{ position:fixed; inset:0; z-index:200; background:var(--honey-soft); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  #gate .bee{ font-size:52px; }
  #gate b{ font-size:22px; }
  #gate span{ color:var(--ink-3); }

  /* ── কাঠামো: ডেস্কটপে বাঁয়ে মেনু, মোবাইলে নিচে ── */
  .app{ display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
  .side{ background:var(--ink); color:#C9CFDA; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:18px 12px; }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 18px; }
  .brand .logo{ width:40px; height:40px; border-radius:12px; background:var(--honey); display:grid; place-items:center; font-size:22px; }
  .brand b{ display:block; color:#fff; font-size:17px; line-height:1.15; }
  .brand small{ color:var(--honey); font-size:12px; }
  .nav{ display:flex; flex-direction:column; gap:2px; flex:1; overflow:auto; }
  .nav button{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; color:inherit; padding:10px 12px; border-radius:10px; font-size:15px; }
  .nav button .ic{ width:22px; text-align:center; font-size:17px; }
  .nav button:hover{ background:var(--ink-2); color:#fff; }
  .nav button.on{ background:var(--honey); color:var(--ink); font-weight:700; }
  .nav .soon{ margin-left:auto; font-size:11px; color:var(--muted); }
  .nav button.on .soon{ color:var(--ink-2); }
  .side .modeBtn{ margin-top:10px; background:var(--ink-2); border:1px solid #3A4254; color:#fff; padding:10px 12px; border-radius:10px; text-align:left; font-size:14px; }

  .main{ min-width:0; display:flex; flex-direction:column; }
  .top{ position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:10px 22px; }
  .top .shop{ font-weight:700; padding:7px 12px; border:1px solid var(--line); border-radius:var(--r-sm); white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .top .search{ flex:1; max-width:520px; position:relative; }
  .top .search input{ width:100%; padding:9px 12px 9px 36px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--paper); }
  .top .search::before{ content:"🔍"; position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.6; }
  .top .bell{ position:relative; background:none; border:0; font-size:20px; padding:6px; }
  .top .bell i{ position:absolute; top:0; right:0; background:var(--red); color:#fff; font-style:normal; font-size:11px; min-width:17px; height:17px; border-radius:9px; display:grid; place-items:center; padding:0 4px; }
  .top .me{ display:flex; align-items:center; gap:8px; margin-left:auto; }
  .top .me .av{ width:34px; height:34px; border-radius:50%; background:var(--honey-soft); display:grid; place-items:center; }
  .top .me b{ display:block; font-size:14px; line-height:1.2; }
  .top .me small{ color:var(--muted); font-size:12px; }
  .top .menuBtn{ display:none; background:none; border:0; font-size:22px; padding:4px; }
  .sync{ font-size:12px; color:var(--muted); white-space:nowrap; }

  .page{ padding:22px; max-width:1320px; width:100%; }
  .page h1{ font-size:26px; margin:0 0 4px; line-height:1.2; }
  .pageHead{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .pageHead .date{ color:var(--ink-3); font-size:14px; }

  /* ── কার্ড ও টেবিল ── */
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 18px; }
  .panel h2{ font-size:17px; margin:0 0 12px; }
  .panel h2.warn{ color:var(--red); }
  .stats{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; margin-bottom:16px; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; display:flex; gap:12px; align-items:flex-start; }
  .stat .ic{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:21px; flex-shrink:0; }
  .stat .lbl{ color:var(--ink-3); font-size:14px; }
  .stat .val{ font-size:26px; font-weight:700; line-height:1.15; }
  .stat .sub{ color:var(--muted); font-size:13px; }
  .stat.g .ic{ background:var(--green-soft); } .stat.g .val{ color:var(--green); }
  .stat.b .ic{ background:var(--blue-soft); } .stat.b .val{ color:var(--blue); }
  .stat.o .ic{ background:var(--honey-soft); } .stat.o .val{ color:var(--honey-deep); }
  .stat.r .ic{ background:var(--red-soft); } .stat.r .val{ color:var(--red); }
  .grid2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; margin-bottom:16px; }
  table.t{ width:100%; border-collapse:collapse; font-size:14px; }
  table.t th{ text-align:left; font-weight:600; color:var(--ink-3); background:var(--paper); padding:8px 10px; border-bottom:1px solid var(--line); }
  table.t td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.t tr:last-child td{ border-bottom:0; }
  table.t td.r, table.t th.r{ text-align:right; white-space:nowrap; }
  .bad{ color:var(--red); font-weight:700; }
  .empty{ color:var(--muted); text-align:center; padding:18px 8px; font-size:14px; }

  /* ৭ দিনের বিক্রির কলাম */
  .bars{ display:flex; align-items:flex-end; gap:12px; height:190px; padding:8px 4px 0; border-bottom:1px solid var(--line); }
  .bars .col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; }
  .bars .col i{ display:block; width:100%; max-width:40px; background:var(--honey); border-radius:6px 6px 0 0; min-height:2px; }
  .bars .col.today i{ background:var(--honey-deep); }
  .bars .col small{ font-size:11px; color:var(--ink-3); }
  .barsLbl{ display:flex; gap:12px; padding:6px 4px 0; }
  .barsLbl span{ flex:1; text-align:center; font-size:12px; color:var(--ink-3); }

  /* ── বোতাম, ফর্ম ── */
  .btn{ border:0; border-radius:var(--r-sm); padding:10px 16px; font-weight:700; background:var(--honey); color:var(--ink); }
  .btn.ghost{ background:var(--card); border:1px solid var(--line); font-weight:600; }
  .btn.green{ background:var(--green); color:#fff; }
  .btn.red{ background:var(--red-soft); color:var(--red); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  label.f{ display:block; font-size:13.5px; color:var(--ink-3); font-weight:600; margin:10px 0 4px; }
  .in{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-sm); background:#fff; }
  .in:focus{ border-color:var(--honey); outline:none; box-shadow:0 0 0 3px var(--honey-soft); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .hint{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .calc{ background:var(--honey-soft); border-radius:var(--r-md); padding:10px 12px; font-size:14px; margin-top:10px; line-height:1.7; }
  .calc b{ color:var(--ink); }

  /* ── বিক্রয় (POS) ── */
  .pos{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:14px; align-items:start; }
  .medList{ max-height:calc(100vh - 230px); overflow:auto; }
  .med{ display:flex; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid var(--line); cursor:pointer; border-radius:8px; }
  .med:hover, .med.kb{ background:var(--honey-soft); }
  .med .pill{ width:38px; height:38px; border-radius:10px; background:var(--blue-soft); display:grid; place-items:center; font-size:18px; flex-shrink:0; }
  .med .nm{ font-weight:700; line-height:1.25; }
  .med .gn{ font-size:12.5px; color:var(--muted); }
  .med .st{ font-size:12.5px; color:var(--ink-3); }
  .med .st.low{ color:var(--red); font-weight:600; }
  .med .pr{ margin-left:auto; text-align:right; white-space:nowrap; }
  .med .pr b{ display:block; }
  .med .pr small{ color:var(--muted); font-size:12px; }
  .med .add{ width:34px; height:34px; border-radius:9px; border:0; background:var(--honey); font-size:20px; font-weight:700; flex-shrink:0; }
  .med.out{ opacity:.45; cursor:not-allowed; }

  .cart table.t td{ padding:8px 6px; }
  .unitSeg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .unitSeg button{ border:0; background:#fff; padding:4px 9px; font-size:13px; }
  .unitSeg button.on{ background:var(--ink); color:#fff; font-weight:600; }
  .qty{ display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .qty button{ border:0; background:var(--paper); width:30px; height:30px; font-size:17px; font-weight:700; }
  .qty input{ width:44px; border:0; text-align:center; height:30px; }
  .x{ border:0; background:none; color:var(--red); font-size:18px; padding:2px 6px; }
  .totals{ margin-top:10px; border-top:1px solid var(--line); padding-top:8px; }
  .totals div{ display:flex; justify-content:space-between; align-items:center; padding:3px 0; font-size:15px; }
  .totals .grand{ font-size:21px; font-weight:700; }
  .totals input{ width:110px; text-align:right; padding:5px 8px; border:1px solid var(--line); border-radius:8px; }
  .pay{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .pay button{ flex:1; min-width:110px; border:1px solid var(--line); background:var(--blue-soft); color:var(--blue); border-radius:var(--r-sm); padding:10px; font-weight:700; }
  .pay button.on{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .done{ width:100%; margin-top:10px; padding:14px; font-size:17px; }
  .custRow{ margin-top:12px; }
  .custChip{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--honey-soft); border-radius:var(--r-sm); padding:8px 10px; font-size:14px; }
  .pay button.due{ background:var(--honey-soft); color:var(--honey-deep); }
  .pay button.due.on{ background:var(--honey-deep); color:#fff; border-color:var(--honey-deep); }
  .keys{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .keys span{ font-size:12.5px; color:var(--ink-3); background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:4px 9px; }

  /* ── ক্রয় ── */
  .pHead{ display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; }
  .pLines td{ padding:6px 5px; }
  .pLines .in{ padding:7px 8px; }
  .pLines td.nm{ min-width:200px; }
  .pLines [data-f="batch"]{ width:110px; } .pLines [data-f="exp"]{ width:150px; }
  .pLines [data-f="n"]{ width:80px; } .pLines [data-f="unit"]{ width:88px; } .pLines [data-f="rate"]{ width:110px; }
  .pLines td:nth-child(7){ min-width:96px; white-space:nowrap; }
  .pick{ position:relative; }
  .pick .drop{ position:absolute; left:0; right:0; top:100%; z-index:30; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 24px rgba(20,24,32,.12); max-height:240px; overflow:auto; }
  .pick .drop div{ padding:8px 10px; cursor:pointer; font-size:14px; }
  .pick .drop div:hover, .pick .drop div.kb{ background:var(--honey-soft); }
  .pick .drop small{ color:var(--muted); }
  .pSum{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; margin-top:12px; align-items:start; }
  .pSum .totals input{ width:130px; }
  .hist .row{ display:flex; justify-content:space-between; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); }
  .hist .row:last-child{ border-bottom:0; }

  /* ── ওষুধের তালিকা ── */
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar .in{ flex:1; min-width:200px; }
  .chip{ display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:var(--paper); color:var(--ink-3); }
  .chip.red{ background:var(--red-soft); color:var(--red); }
  .chip.org{ background:var(--honey-soft); color:var(--honey-deep); }

  /* ── মোডাল ── */
  .modal{ position:fixed; inset:0; z-index:100; background:rgba(20,24,32,.55); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal .box{ background:var(--card); border-radius:var(--r-lg); width:100%; max-width:640px; max-height:92vh; overflow:auto; padding:18px 20px; }
  .modal .head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .modal .head h3{ margin:0; font-size:19px; }
  .modal .foot{ display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:24px; z-index:300; font-size:14px; max-width:92vw; text-align:center; }

  /* রসিদ */
  .receipt{ font-size:13px; max-width:320px; margin:0 auto; }
  .receipt .c{ text-align:center; }
  .receipt table{ width:100%; border-collapse:collapse; }
  .receipt td{ padding:3px 0; vertical-align:top; }
  .receipt hr{ border:0; border-top:1px dashed #999; margin:8px 0; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ position:absolute; left:0; top:0; width:100%; }
  }

  /* ── আসছে পাতা ── */
  .soonBox{ text-align:center; padding:40px 20px; }
  .soonBox .big{ font-size:44px; }

  /* ── মোবাইল ── */
  .bnav{ display:none; }
  @media (max-width: 1100px){
    .stats{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  }
  @media (max-width: 900px){
    .app{ grid-template-columns:1fr; }
    .side{ position:fixed; left:0; top:0; bottom:0; width:260px; z-index:60; transform:translateX(-100%); transition:transform .22s ease; }
    .side.open{ transform:none; box-shadow:0 0 0 100vmax rgba(20,24,32,.45); }
    .top{ padding:10px 14px; background:var(--honey); border-bottom:0; }
    .top .menuBtn{ display:block; }
    .top .shop{ background:rgba(255,255,255,.55); border:0; max-width:140px; }
    .top .search{ display:none; }
    .top .me small, .top .me b{ display:none; }
    .sync{ display:none; }
    .page{ padding:14px 14px calc(var(--nav-h) + 20px); }
    .page h1{ font-size:22px; }
    .stats{ gap:10px; }
    .stat{ padding:12px; flex-direction:column; gap:6px; }
    .stat .ic{ width:36px; height:36px; font-size:18px; }
    .stat .val{ font-size:21px; }
    .grid2{ grid-template-columns:1fr; }
    .pos{ grid-template-columns:1fr; }
    .medList{ max-height:none; }
    .row3{ grid-template-columns:1fr 1fr; }
    .bnav{ display:flex; position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--card); border-top:1px solid var(--line); height:calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); }
    .bnav button{ flex:1; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:12px; color:var(--ink-3); }
    .bnav button .ic{ font-size:20px; }
    .bnav button.on{ color:var(--ink); font-weight:700; }
    .bnav button.on .ic{ background:var(--honey-soft); border-radius:12px; padding:0 12px; }
    .keys{ display:none; }
    /* মোবাইলে কার্ট টেবিল নয় — প্রতিটা ওষুধ একটা সারি: নাম উপরে, নিচে একক · পরিমাণ · মোট · ✕ */
    .cart table.t thead{ display:none; }
    .cart table.t, .cart table.t tbody{ display:block; }
    .cart table.t tr{ display:grid; grid-template-columns:auto auto 1fr auto; gap:6px 8px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
    .cart table.t td{ padding:0; border:0; }
    .cart table.t td:first-child{ grid-column:1 / -1; }
    .unitSeg button{ padding:6px 10px; }
    /* ওষুধের তালিকার টেবিল মোবাইলে পাশে স্ক্রল হয়, পাতা নয় */
    #medsBox{ overflow-x:auto; }
    .pHead{ grid-template-columns:1fr 1fr; }
    .pHead > :first-child{ grid-column:1 / -1; }
    .pSum{ grid-template-columns:1fr; }
    /* ক্রয়ের প্রতিটা লাইন মোবাইলে একটা কার্ড */
    .pLines thead{ display:none; }
    .pLines, .pLines tbody{ display:block; }
    .pLines tr{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 0; border-bottom:1px solid var(--line); }
    .pLines td{ padding:0 !important; border:0 !important; }
    .pLines td.nm{ grid-column:1 / -1; min-width:0; }
    .pLines [data-f]{ width:100% !important; }
    .pLines td[data-l]::before{ content:attr(data-l); display:block; font-size:12px; color:var(--muted); }
    #medsBox table.t{ min-width:560px; }
    .pay button{ min-width:0; }
    /* মোবাইলে কার্ট নিচে আটকে থাকা "মোট + বিক্রি" বার */
    .cartBar{ position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index:40; background:var(--ink); color:#fff; display:flex; align-items:center; gap:12px; padding:10px 14px; }
    .cartBar b{ font-size:18px; }
    /* কার্ট-বার থাকলে পাতার নিচে বাড়তি জায়গা — নইলে "বিক্রি সম্পন্ন" বোতাম ঢাকা পড়ত */
    body.hasCart .page{ padding-bottom:calc(var(--nav-h) + 92px + env(safe-area-inset-bottom)); }
    .cartBar .btn{ margin-left:auto; }
    .modal{ align-items:flex-end; padding:0; }
    .modal .box{ border-radius:20px 20px 0 0; max-height:94vh; }
  }
  @media (min-width: 901px){ .cartBar{ display:none !important; } }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<div id="gate"><div class="bee">🐝</div><b>Honey Bee ফার্মেসি</b><span id="gateMsg">খাতা খোলা হচ্ছে…</span></div>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><div class="logo">🐝</div><div><b>Honey Bee</b><small>Pharmacy Management</small></div></div>
    <nav class="nav" id="nav"></nav>
    <button class="modeBtn" id="modeBtn" type="button">↩️ সাধারণ POS-এ ফিরুন</button>
  </aside>

  <div class="main">
    <header class="top">
      <button class="menuBtn" id="menuBtn" type="button" aria-label="মেনু">☰</button>
      <div class="shop" id="shopName">—</div>
      <div class="search"><input id="topSearch" placeholder="ওষুধ, বারকোড বা জেনেরিক নাম লিখুন…" autocomplete="off"></div>
      <span class="sync" id="syncTxt">🟢 অনলাইন</span>
      <button class="bell" id="bellBtn" type="button" title="মেয়াদ ও কম স্টকের সতর্কতা">🔔<i id="bellN" hidden>0</i></button>
      <div class="me"><div class="av">👤</div><div><b id="meName">—</b><small id="meRole">—</small></div></div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<nav class="bnav" id="bnav" hidden></nav>
<div id="modalRoot"></div>
<div id="printArea" style="position:fixed; left:-9999px; top:0;"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
/* =====================================================================
   ছোট হেল্পার
   ===================================================================== */
const $ = (id)=> document.getElementById(id);
const esc = (s)=> String(s == null ? "" : s).replace(/[&<>"']/g, c=> ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const BN = "০১২৩৪৫৬৭৮৯";
const bn = (v)=> String(v).replace(/[0-9]/g, d=> BN[d]);
const r2 = (n)=> Math.round((Number(n) || 0) * 100) / 100;
const CUR = ()=> localStorage.getItem("shop-currency-symbol") || "৳";
function money(n){
  const v = r2(n);
  const s = Number.isInteger(v) ? v.toLocaleString("en-IN") : v.toLocaleString("en-IN", { minimumFractionDigits:2, maximumFractionDigits:2 });
  return CUR() + " " + bn(s);
}
function toast(msg, ms){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=> t.remove(), ms || 2400);
}
const readJSON = (k, d)=>{ try{ const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; }catch(e){ return d; } };
const todayStr = ()=>{ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

let SESSION = null;
const isAdmin = ()=> SESSION && SESSION.role === "admin";

/* =====================================================================
   খাতা — সাধারণ POS-এর একই localStorage কী
   ===================================================================== */
function loadProducts(){
  const del = readJSON("bcc-deleted-product-ids", []);
  const all = readJSON("bcc-products", []);
  return del.length ? all.filter(p=> !del.includes(p.id)) : all;
}
// মোছা প্রোডাক্টগুলোও রেখে সেভ করা হয় (সাধারণ POS-এর মতোই — মোছার তালিকা আলাদা থাকে)
function saveProducts(list){
  const del = readJSON("bcc-deleted-product-ids", []);
  const hidden = del.length ? readJSON("bcc-products", []).filter(p=> del.includes(p.id) && !list.some(x=> x.id === p.id)) : [];
  localStorage.setItem("bcc-products", JSON.stringify(list.concat(hidden)));
}
function loadEntries(){
  const del = readJSON("phone-shop-deleted-entry-ids", []);
  const all = readJSON("phone-shop-entries", []);
  return del.length ? all.filter(e=> !del.includes(e.id)) : all;
}

/* 👥 গ্রাহক ও বাকি — সাধারণ POS-এর একই নিয়ম:
   গ্রাহক চেনা হয় মোবাইল থাকলে মোবাইলে, না থাকলে নামে; বাকি = প্রতিটা বিক্রির (price − paid) যোগফল। */
const custKey = (name, phone)=> (phone ? phone : "") + "|" + (name || "");
function loadCustomers(){
  const del = readJSON("phone-shop-deleted-customer-keys", []);
  return readJSON("phone-shop-customers", []).filter(c=> c && c.name && !del.includes(custKey(c.name, c.phone)));
}
const sameCust = (e, name, phone)=> phone ? e.phone === phone : e.name === name;
function custDue(name, phone, entries){
  return r2((entries || loadEntries()).filter(e=> sameCust(e, name, phone)).reduce((a,e)=> a + Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0), 0));
}
function ensureCustomer(name, phone){
  if(!name || name === "ওয়াক-ইন কাস্টমার") return;
  const list = readJSON("phone-shop-customers", []);
  if(list.some(c=> phone ? c.phone === phone : (c.name === name && !c.phone))) return;
  list.push({ name, phone: phone || "" });
  localStorage.setItem("phone-shop-customers", JSON.stringify(list));
}

/* ওষুধের একক — সব হিসাব পিসে, বক্স/পাতা শুধু গুণ করে */
function packOf(p){
  const pps = Math.max(1, Number(p.piecesPerStrip) || 1);
  const spb = Math.max(1, Number(p.stripsPerBox) || 1);
  return { pps, spb, perBox: pps * spb };
}
function unitsOf(p){
  const k = packOf(p);
  const u = [{ key:"pc", label:"পিস", n:1 }];
  if(k.pps > 1) u.push({ key:"strip", label:"পাতা", n:k.pps });
  if(k.perBox > k.pps || (k.pps === 1 && k.spb > 1)) u.push({ key:"box", label:"বক্স", n:k.perBox });
  return u;
}
function stockText(p, qty){
  const q = Math.max(0, Math.floor(qty == null ? Number(p.qty) || 0 : qty));
  const k = packOf(p);
  if(k.perBox <= 1) return bn(q) + " পিস";
  const parts = [];
  let rest = q;
  const boxes = Math.floor(rest / k.perBox); rest -= boxes * k.perBox;
  if(boxes) parts.push(bn(boxes) + " বক্স");
  if(k.pps > 1){ const st = Math.floor(rest / k.pps); rest -= st * k.pps; if(st) parts.push(bn(st) + " পাতা"); }
  if(rest || !parts.length) parts.push(bn(rest) + " পিস");
  return parts.join(" ");
}
const pcPrice = (p)=> Number(p.offerPrice) > 0 && Number(p.offerPrice) < Number(p.sell) ? Number(p.offerPrice) : Number(p.sell) || 0;
const isLow = (p)=> (Number(p.qty) || 0) <= (Number(p.min) || 0) && (Number(p.min) || 0) > 0;
function nearestExpiry(p){
  const t0 = new Date(todayStr()).getTime();
  let best = null;
  (p.batches || []).forEach(b=>{
    if(!b || !b.expiryDate || !(Number(b.qty) > 0)) return;
    const days = Math.round((new Date(b.expiryDate).getTime() - t0) / 86400000);
    if(!best || days < best.days) best = { days, date: b.expiryDate, batchNo: b.batchNo || "", qty: Number(b.qty) || 0 };
  });
  return best;
}
const fmtDate = (s)=>{ if(!s) return "—"; const d = new Date(s); if(isNaN(d)) return esc(s); return bn(d.toLocaleDateString("bn-BD", { day:"numeric", month:"short", year:"numeric" })); };

// 💊 "ওষুধ" ক্যাটাগরি — না থাকলে একবার বানানো হয় (সাধারণ POS-এর ক্যাটাগরি তালিকাতেই)
const MED_CAT_ID = "cat-medicine";
function ensureMedCategory(){
  const cats = readJSON("bcc-categories", []);
  if(cats.some(c=> c && c.id === MED_CAT_ID)) return;
  cats.push({ id: MED_CAT_ID, name: "💊 ওষুধ", subs: [] });
  localStorage.setItem("bcc-categories", JSON.stringify(cats));
}

/* =====================================================================
   মেনু
   ===================================================================== */
const MENU = [
  { key:"dash",      ic:"🏠", label:"ড্যাশবোর্ড" },
  { key:"pos",       ic:"🛒", label:"বিক্রয় (POS)" },
  { key:"meds",      ic:"💊", label:"ওষুধের তালিকা" },
  { key:"purchase",  ic:"📥", label:"ক্রয়" },
  { key:"stock",     ic:"📦", label:"স্টক ব্যবস্থাপনা", soon:true },
  { key:"suppliers", ic:"🚚", label:"সরবরাহকারী" },
  { key:"customers", ic:"👥", label:"গ্রাহক" },
  { key:"reports",   ic:"📊", label:"রিপোর্ট", soon:true, admin:true },
  { key:"branches",  ic:"🏬", label:"শাখা ব্যবস্থাপনা", soon:true, admin:true },
  { key:"users",     ic:"🧑‍⚕️", label:"ব্যবহারকারী", admin:true },
  { key:"accounts",  ic:"📒", label:"হিসাব (Accounts)", soon:true, admin:true },
  { key:"settings",  ic:"⚙️", label:"সেটিংস", soon:true, admin:true },
];
const BNAV = [
  { key:"dash", ic:"🏠", label:"হোম" }, { key:"pos", ic:"🛒", label:"বিক্রয়" },
  { key:"meds", ic:"💊", label:"ওষুধ" }, { key:"alerts", ic:"⏳", label:"সতর্কতা" },
  { key:"more", ic:"☰", label:"আরও" },
];
let CUR_PAGE = "dash";
function renderNav(){
  const items = MENU.filter(m=> !m.admin || isAdmin());
  $("nav").innerHTML = items.map(m=> `<button type="button" data-go="${m.key}" class="${m.key === CUR_PAGE ? "on" : ""}"><span class="ic">${m.ic}</span>${esc(m.label)}${m.soon ? '<span class="soon">শীঘ্রই</span>' : ""}</button>`).join("");
  $("bnav").innerHTML = BNAV.map(m=> `<button type="button" data-go="${m.key}" class="${m.key === CUR_PAGE ? "on" : ""}"><span class="ic">${m.ic}</span>${m.label}</button>`).join("");
}
document.addEventListener("click", (e)=>{
  const b = e.target.closest("[data-go]"); if(!b) return;
  const k = b.dataset.go;
  if(k === "more"){ $("side").classList.add("open"); return; }
  $("side").classList.remove("open");
  go(k);
});
$("menuBtn").addEventListener("click", ()=> $("side").classList.toggle("open"));
$("side").addEventListener("click", (e)=>{ if(e.target === $("side")) $("side").classList.remove("open"); });

function go(k){
  CUR_PAGE = k;
  document.body.classList.remove("hasCart");
  try{ history.replaceState(null, "", "#" + k); }catch(e){}
  renderNav();
  window.scrollTo(0, 0);
  const P = { dash: pageDash, pos: pagePos, meds: pageMeds, alerts: pageAlerts, users: pageUsers, purchase: pagePurchase, suppliers: pageSuppliers, customers: pageCustomers }[k];
  if(P) P(); else pageSoon(k);
  refreshBell();
}

/* =====================================================================
   🏠 ড্যাশবোর্ড
   ===================================================================== */
function salesByDay(entries){
  const map = {};
  entries.forEach(e=>{
    if(!e || !e.date) return;
    const d = String(e.date).slice(0, 10);
    // date ISO (UTC) — দোকানের স্থানীয় তারিখ বের করতে Date দিয়ে পড়া
    const dt = new Date(e.date); const k = isNaN(dt) ? d : dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
    map[k] = map[k] || { total:0, bills:new Set() };
    map[k].total += Number(e.price) || 0;
    map[k].bills.add(e.billId || e.invoiceNo || e.id);
  });
  return map;
}
function pageDash(){
  const prods = loadProducts();
  const entries = loadEntries();
  const byDay = salesByDay(entries);
  const today = byDay[todayStr()] || { total:0, bills:new Set() };
  const stockVal = prods.reduce((s,p)=> s + (Number(p.buy) || 0) * Math.max(0, Number(p.qty) || 0), 0);
  const expiring = [];
  prods.forEach(p=> (p.batches || []).forEach(b=>{
    if(!b || !b.expiryDate || !(Number(b.qty) > 0)) return;
    const days = Math.round((new Date(b.expiryDate).getTime() - new Date(todayStr()).getTime()) / 86400000);
    if(days <= 30) expiring.push({ p, b, days });
  }));
  expiring.sort((a,b)=> a.days - b.days);
  const low = prods.filter(isLow).sort((a,b)=> (a.qty||0) - (b.qty||0));

  const days = [];
  for(let i = 6; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    days.push({ k, label: bn(d.getDate()) + " " + d.toLocaleDateString("bn-BD", { month:"short" }), v: (byDay[k] || { total:0 }).total, today: i === 0 });
  }
  const mx = Math.max(1, ...days.map(d=> d.v));
  const admin = isAdmin();
  const dueInfo = dueSummary(entries);

  $("page").innerHTML = `
    <div class="pageHead"><h1>ড্যাশবোর্ড</h1><div class="date">আজকের তারিখ: ${bn(new Date().toLocaleDateString("bn-BD", { day:"numeric", month:"long", year:"numeric", weekday:"long" }))}</div></div>
    <div class="stats">
      ${admin ? `<div class="stat g"><div class="ic">🧾</div><div><div class="lbl">আজকের বিক্রয়</div><div class="val num">${money(today.total)}</div><div class="sub">${bn(today.bills.size)}টি ইনভয়েস</div></div></div>
      <div class="stat b"><div class="ic">📦</div><div><div class="lbl">মোট স্টক ভ্যালু (কেনা দামে)</div><div class="val num">${money(stockVal)}</div><div class="sub">${bn(prods.length)}টি আইটেম</div></div></div>`
      : `<div class="stat b"><div class="ic">💊</div><div><div class="lbl">মোট ওষুধ</div><div class="val num">${bn(prods.length)}</div><div class="sub">তালিকায় আছে</div></div></div>`}
      <div class="stat o" data-go="alerts" style="cursor:pointer"><div class="ic">⏳</div><div><div class="lbl">মেয়াদোত্তীর্ণ সতর্কতা</div><div class="val num">${bn(expiring.length)}</div><div class="sub">পরবর্তী ৩০ দিনে</div></div></div>
      ${admin ? `<div class="stat r" data-go="customers" style="cursor:pointer"><div class="ic">📒</div><div><div class="lbl">বাকি আদায়যোগ্য</div><div class="val num">${money(dueInfo.total)}</div><div class="sub">${bn(dueInfo.count)} জন গ্রাহক</div></div></div>`
      : `<div class="stat r" data-go="alerts" style="cursor:pointer"><div class="ic">📉</div><div><div class="lbl">কম স্টক</div><div class="val num">${bn(low.length)}</div><div class="sub">ন্যূনতমের নিচে</div></div></div>`}
    </div>
    ${admin ? `<div class="panel" style="margin-bottom:16px">
      <h2>গত ৭ দিনের বিক্রয়</h2>
      <div class="bars">${days.map(d=> `<div class="col${d.today ? " today" : ""}" title="${esc(d.label)}: ${esc(money(d.v))}"><small class="num">${d.v ? bn(Math.round(d.v)) : ""}</small><i style="height:${Math.max(1, d.v / mx * 100)}%"></i></div>`).join("")}</div>
      <div class="barsLbl">${days.map(d=> `<span>${esc(d.label)}</span>`).join("")}</div>
    </div>` : ""}
    <div class="grid2">
      <div class="panel"><h2 class="warn">মেয়াদোত্তীর্ণ ওষুধ (পরবর্তী ৩০ দিন)</h2>${expiryTable(expiring.slice(0, 8))}</div>
      <div class="panel"><h2 class="warn">কম স্টক (সতর্কতা)</h2>${lowTable(low.slice(0, 8))}</div>
    </div>`;
}
function expiryTable(list){
  if(!list.length) return `<div class="empty">৩০ দিনের মধ্যে কোনো ওষুধের মেয়াদ শেষ হচ্ছে না।</div>`;
  return `<table class="t"><thead><tr><th>নাম</th><th>ব্যাচ</th><th>মেয়াদ</th><th class="r">পরিমাণ</th></tr></thead><tbody>${list.map(x=> `<tr><td>${esc(x.p.name)}</td><td>${esc(x.b.batchNo || "—")}</td><td class="${x.days < 0 ? "bad" : ""}">${fmtDate(x.b.expiryDate)}${x.days < 0 ? " (শেষ)" : ""}</td><td class="r num">${esc(stockText(x.p, x.b.qty))}</td></tr>`).join("")}</tbody></table>`;
}
function lowTable(list){
  if(!list.length) return `<div class="empty">কোনো ওষুধ ন্যূনতম স্টকের নিচে নেই। "ন্যূনতম স্টক" দিলে এখানে সতর্ক করা হবে।</div>`;
  return `<table class="t"><thead><tr><th>নাম</th><th class="r">বর্তমান স্টক</th><th class="r">ন্যূনতম</th></tr></thead><tbody>${list.map(p=> `<tr><td>${esc(p.name)}</td><td class="r bad num">${esc(stockText(p))}</td><td class="r num">${esc(stockText(p, p.min))}</td></tr>`).join("")}</tbody></table>`;
}
function pageAlerts(){
  const prods = loadProducts();
  const expiring = [];
  prods.forEach(p=> (p.batches || []).forEach(b=>{
    if(!b || !b.expiryDate || !(Number(b.qty) > 0)) return;
    const days = Math.round((new Date(b.expiryDate).getTime() - new Date(todayStr()).getTime()) / 86400000);
    if(days <= 90) expiring.push({ p, b, days });
  }));
  expiring.sort((a,b)=> a.days - b.days);
  const low = prods.filter(isLow);
  $("page").innerHTML = `<div class="pageHead"><h1>সতর্কতা</h1></div>
    <div class="panel" style="margin-bottom:14px"><h2 class="warn">মেয়াদ শেষ হচ্ছে (৯০ দিনের মধ্যে)</h2>${expiryTable(expiring)}</div>
    <div class="panel"><h2 class="warn">কম স্টক</h2>${lowTable(low)}</div>`;
}
function refreshBell(){
  const prods = loadProducts();
  let n = prods.filter(isLow).length;
  prods.forEach(p=>{ const e = nearestExpiry(p); if(e && e.days <= 30) n++; });
  $("bellN").hidden = !n; $("bellN").textContent = bn(n);
}
$("bellBtn").addEventListener("click", ()=> go("alerts"));

/* =====================================================================
   🛒 বিক্রয় (POS)
   ===================================================================== */
let CART = [];          // { pid, unit, n }  n = কত একক (পিস/পাতা/বক্স)
let PAY = "cash";       // cash | card | mobile | due
let CUST = null;        // { name, phone } — বাছা গ্রাহক (না থাকলে ওয়াক-ইন)
let DISCOUNT = 0;
let KB = 0;             // কিবোর্ডে বাছা ওষুধের ক্রম
let POS_Q = "";

function medMatches(p, q){
  if(!q) return true;
  q = q.toLowerCase();
  return String(p.name || "").toLowerCase().includes(q) || String(p.genericName || "").toLowerCase().includes(q)
      || String(p.code || "").toLowerCase() === q || String((p.pharma && p.pharma.company) || "").toLowerCase().includes(q);
}
function cartPieces(pid, skipIdx){
  return CART.reduce((s, c, i)=>{
    if(c.pid !== pid || i === skipIdx) return s;
    const p = loadProducts().find(x=> x.id === pid); if(!p) return s;
    const u = unitsOf(p).find(x=> x.key === c.unit) || { n:1 };
    return s + u.n * c.n;
  }, 0);
}
function lineOf(c, prods){
  const p = prods.find(x=> x.id === c.pid); if(!p) return null;
  const u = unitsOf(p).find(x=> x.key === c.unit) || unitsOf(p)[0];
  const pieces = u.n * c.n;
  const unitPrice = r2(pcPrice(p) * u.n);
  return { p, u, pieces, unitPrice, total: r2(unitPrice * c.n) };
}
function cartTotals(){
  const prods = loadProducts();
  const lines = CART.map(c=> lineOf(c, prods)).filter(Boolean);
  const sub = r2(lines.reduce((s,l)=> s + l.total, 0));
  const disc = Math.min(sub, Math.max(0, Number(DISCOUNT) || 0));
  return { lines, sub, disc, net: r2(sub - disc) };
}

function pagePos(){
  $("page").innerHTML = `
    <div class="pageHead"><h1>বিক্রয় (POS)</h1></div>
    <div class="pos">
      <div class="panel">
        <input class="in" id="posQ" placeholder="🔍 নাম, জেনেরিক বা বারকোড লিখুন…" autocomplete="off" value="${esc(POS_Q)}">
        <div class="medList" id="medList" style="margin-top:8px"></div>
      </div>
      <div class="panel cart" id="cartPanel"></div>
    </div>
    <div class="cartBar" id="cartBar" hidden></div>`;
  const q = $("posQ");
  q.addEventListener("input", ()=>{ POS_Q = q.value.trim(); KB = 0; renderMedList(); });
  q.addEventListener("keydown", (e)=>{
    const rows = [...document.querySelectorAll("#medList .med:not(.out)")];
    if(e.key === "ArrowDown"){ e.preventDefault(); KB = Math.min(rows.length - 1, KB + 1); renderMedList(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); KB = Math.max(0, KB - 1); renderMedList(); }
    else if(e.key === "Enter"){ e.preventDefault(); const r = rows[KB]; if(r) addToCart(r.dataset.pid); }
  });
  if(window.innerWidth > 900) q.focus();
  renderMedList(); renderCart();
}
function renderMedList(){
  const box = $("medList"); if(!box) return;
  const prods = loadProducts().filter(p=> medMatches(p, POS_Q))
    .sort((a,b)=> String(a.name || "").localeCompare(String(b.name || ""), "en"));
  if(!prods.length){
    box.innerHTML = `<div class="empty">${POS_Q ? "এই নামে কোনো ওষুধ নেই।" : "এখনো কোনো ওষুধ যোগ করা হয়নি।"}<br><button class="btn" type="button" data-go="meds" style="margin-top:10px">➕ ওষুধ যোগ করুন</button></div>`;
    return;
  }
  let i = -1;
  box.innerHTML = prods.slice(0, 200).map(p=>{
    const left = (Number(p.qty) || 0) - cartPieces(p.id);
    const out = left <= 0;
    if(!out) i++;
    const k = packOf(p);
    return `<div class="med${out ? " out" : ""}${!out && i === KB ? " kb" : ""}" data-pid="${esc(p.id)}">
      <div class="pill">💊</div>
      <div style="min-width:0">
        <div class="nm">${esc(p.name)}</div>
        ${p.genericName ? `<div class="gn">${esc(p.genericName)}</div>` : ""}
        <div class="st${isLow(p) || out ? " low" : ""}">${out ? "স্টক নেই" : "স্টক: " + esc(stockText(p, left))}</div>
      </div>
      <div class="pr"><b class="num">${money(pcPrice(p))}</b><small>প্রতি পিস${k.pps > 1 ? " · পাতা " + money(pcPrice(p) * k.pps) : ""}</small></div>
      <button class="add" type="button" ${out ? "disabled" : ""} aria-label="কার্টে যোগ করুন">+</button>
    </div>`;
  }).join("");
  box.querySelectorAll(".med:not(.out)").forEach(el=> el.addEventListener("click", ()=> addToCart(el.dataset.pid)));
}
function addToCart(pid){
  const p = loadProducts().find(x=> x.id === pid); if(!p) return;
  const units = unitsOf(p);
  // ট্যাবলেট সাধারণত পাতায় বিক্রি হয় — পাতা থাকলে সেটাই আগে বাছা থাকে
  const def = units.find(u=> u.key === "strip") || units[0];
  const free = (Number(p.qty) || 0) - cartPieces(pid);
  const unit = free >= def.n ? def : units[0];
  if(free < unit.n){ toast("স্টক নেই"); return; }
  const same = CART.findIndex(c=> c.pid === pid && c.unit === unit.key);
  if(same > -1) CART[same].n += 1; else CART.push({ pid, unit: unit.key, n: 1 });
  renderMedList(); renderCart();
}
function renderCart(){
  const box = $("cartPanel"); if(!box) return;
  const T = cartTotals();
  if(!T.lines.length){
    box.innerHTML = `<h2>কার্ট</h2><div class="empty">বাম পাশের তালিকা থেকে ওষুধে চাপ দিন।<br>কিবোর্ডে: নাম লিখে ↑ ↓ দিয়ে বাছুন, Enter চাপুন।</div>${keysHtml()}`;
    $("cartBar").hidden = true;
    document.body.classList.remove("hasCart");
    return;
  }
  box.innerHTML = `
    <h2>কার্ট (${bn(T.lines.length)})</h2>
    <table class="t"><thead><tr><th>নাম</th><th>একক</th><th>পরিমাণ</th><th class="r">মোট</th><th></th></tr></thead><tbody>
    ${T.lines.map((l, i)=> `<tr>
      <td><b>${esc(l.p.name)}</b><div class="hint">${money(l.unitPrice)} / ${esc(l.u.label)}</div></td>
      <td>${l.p && unitsOf(l.p).length > 1 ? `<span class="unitSeg">${unitsOf(l.p).map(u=> `<button type="button" class="${u.key === l.u.key ? "on" : ""}" data-unit="${i}:${u.key}">${u.label}</button>`).join("")}</span>` : esc(l.u.label)}</td>
      <td><span class="qty"><button type="button" data-q="${i}:-1" aria-label="কমান">−</button><input class="num" inputmode="numeric" data-qi="${i}" value="${CART[i].n}"><button type="button" data-q="${i}:1" aria-label="বাড়ান">+</button></span></td>
      <td class="r num">${money(l.total)}</td>
      <td><button class="x" type="button" data-del="${i}" aria-label="সরান">✕</button></td>
    </tr>`).join("")}
    </tbody></table>
    <div class="totals">
      <div><span>মোট</span><span class="num">${money(T.sub)}</span></div>
      <div><span>ডিসকাউন্ট</span><input class="num" id="discIn" inputmode="decimal" value="${DISCOUNT || ""}" placeholder="০"></div>
      <div class="grand"><span>পরিশোধ</span><span class="num">${money(T.net)}</span></div>
    </div>
    <div class="custRow">
      ${CUST ? `<div class="custChip"><span>👤 <b>${esc(CUST.name)}</b>${CUST.phone ? " · " + esc(CUST.phone) : ""}${isAdmin() && custDue(CUST.name, CUST.phone) > 0 ? ` · <span class="bad">আগের বাকি ${money(custDue(CUST.name, CUST.phone))}</span>` : ""}</span><button class="x" type="button" id="custClear" aria-label="গ্রাহক সরান">✕</button></div>`
             : `<button class="btn ghost" type="button" id="custPick" style="width:100%">👤 গ্রাহক বাছুন (F5) — না বাছলে ওয়াক-ইন</button>`}
    </div>
    <div class="pay">
      <button type="button" data-pay="cash" class="${PAY === "cash" ? "on" : ""}">💵 নগদ (F1)</button>
      <button type="button" data-pay="card" class="${PAY === "card" ? "on" : ""}">💳 কার্ড (F2)</button>
      <button type="button" data-pay="mobile" class="${PAY === "mobile" ? "on" : ""}">📱 বিকাশ/নগদ (F3)</button>
      <button type="button" data-pay="due" class="${PAY === "due" ? "on due" : "due"}">📒 বাকি (F6)</button>
    </div>
    <button class="btn green done" type="button" id="doneBtn">✅ বিক্রি সম্পন্ন (F4)</button>
    ${keysHtml()}`;
  box.querySelectorAll("[data-unit]").forEach(b=> b.onclick = ()=>{
    const [i, key] = b.dataset.unit.split(":"); const c = CART[+i];
    const p = loadProducts().find(x=> x.id === c.pid); const u = unitsOf(p).find(x=> x.key === key);
    const free = (Number(p.qty) || 0) - cartPieces(c.pid, +i);
    if(u.n * c.n > free){ c.n = Math.floor(free / u.n); if(c.n < 1){ toast("এত " + u.label + " স্টকে নেই"); return; } }
    c.unit = key; renderMedList(); renderCart();
  });
  box.querySelectorAll("[data-q]").forEach(b=> b.onclick = ()=>{ const [i, d] = b.dataset.q.split(":"); setQty(+i, CART[+i].n + Number(d)); });
  box.querySelectorAll("[data-qi]").forEach(inp=> inp.onchange = ()=> setQty(+inp.dataset.qi, Math.floor(Number(inp.value) || 0)));
  box.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=>{ CART.splice(+b.dataset.del, 1); renderMedList(); renderCart(); });
  box.querySelectorAll("[data-pay]").forEach(b=> b.onclick = ()=>{ PAY = b.dataset.pay; renderCart(); if(PAY === "due" && !CUST) openCustomerPicker(); });
  if($("custPick")) $("custPick").onclick = ()=> openCustomerPicker();
  if($("custClear")) $("custClear").onclick = ()=>{ CUST = null; if(PAY === "due") PAY = "cash"; renderCart(); };
  $("discIn").onchange = ()=>{ DISCOUNT = Math.max(0, Number($("discIn").value) || 0); renderCart(); };
  $("doneBtn").onclick = completeSale;
  const bar = $("cartBar");
  bar.hidden = false;
  document.body.classList.add("hasCart");
  bar.innerHTML = `<div><small style="opacity:.75">${bn(T.lines.length)}টি আইটেম</small><br><b class="num">${money(T.net)}</b></div><button class="btn" type="button" id="barGo">কার্ট দেখুন</button>`;
  $("barGo").onclick = ()=> $("cartPanel").scrollIntoView({ behavior:"smooth", block:"start" });
}
function keysHtml(){ return `<div class="keys"><span>F1 নগদ</span><span>F2 কার্ড</span><span>F3 মোবাইল ব্যাংকিং</span><span>F4 বিক্রি সম্পন্ন</span><span>F5 গ্রাহক</span><span>F6 বাকি</span><span>F8 কার্ট খালি</span></div>`; }

/* 👤 গ্রাহক বাছাই — নাম বা মোবাইল লিখে খোঁজা; না পেলে নতুন গ্রাহক হিসেবে যোগ */
function openCustomerPicker(onPick){
  openModal(`<div class="head"><h3>👤 গ্রাহক বাছুন</h3><button class="x" type="button" data-close aria-label="বন্ধ">✕</button></div>
    <input class="in" id="cpQ" placeholder="নাম বা মোবাইল লিখুন…" autocomplete="off">
    <div id="cpList" style="margin-top:8px; max-height:46vh; overflow:auto"></div>
    <div class="row2" id="cpNew" style="margin-top:10px">
      <div><label class="f">নতুন গ্রাহকের নাম</label><input class="in" id="cpName"></div>
      <div><label class="f">মোবাইল</label><input class="in" id="cpPhone" inputmode="tel"></div>
    </div>
    <div class="foot"><button class="btn ghost" type="button" data-close>বাতিল</button><button class="btn" type="button" id="cpAdd">➕ নতুন গ্রাহক নিয়ে এগোন</button></div>`);
  const entries = loadEntries();
  const draw = ()=>{
    const q = $("cpQ").value.trim().toLowerCase();
    const list = loadCustomers().filter(c=> !q || c.name.toLowerCase().includes(q) || String(c.phone || "").includes(q)).slice(0, 40);
    $("cpList").innerHTML = list.length ? list.map((c, i)=>{ const d = custDue(c.name, c.phone, entries); return `<div class="med" data-cp="${i}"><div class="pill">👤</div><div><div class="nm">${esc(c.name)}</div><div class="gn">${esc(c.phone || "মোবাইল নেই")}</div></div>${isAdmin() && d > 0 ? `<div class="pr"><b class="bad num">${money(d)}</b><small>বাকি</small></div>` : ""}</div>`; }).join("")
      : `<div class="empty">${q ? "এই নামে কেউ নেই — নিচে নতুন গ্রাহক হিসেবে যোগ করুন।" : "এখনো কোনো গ্রাহক নেই।"}</div>`;
    $("cpList").querySelectorAll("[data-cp]").forEach(el=> el.onclick = ()=>{ const c = list[+el.dataset.cp]; pick({ name: c.name, phone: c.phone || "" }); });
    if(q && !$("cpName").value && !/^[0-9+\s-]+$/.test(q)) $("cpName").placeholder = $("cpQ").value.trim();
    if(q && /^[0-9+\s-]+$/.test(q)) $("cpPhone").placeholder = $("cpQ").value.trim();
  };
  const pick = (c)=>{ closeModal(); if(onPick) onPick(c); else { CUST = c; renderCart(); } };
  $("cpQ").oninput = draw; draw();
  $("cpAdd").onclick = ()=>{
    const q = $("cpQ").value.trim();
    const name = $("cpName").value.trim() || (!/^[0-9+\s-]+$/.test(q) ? q : "");
    const phone = $("cpPhone").value.trim() || (/^[0-9+\s-]+$/.test(q) ? q : "");
    if(!name){ toast("গ্রাহকের নাম লিখুন"); $("cpName").focus(); return; }
    if(phone && !/^[0-9+\-\s]{6,20}$/.test(phone)){ toast("মোবাইল নম্বর ঠিক নেই"); return; }
    ensureCustomer(name, phone); pushNow();
    pick({ name, phone });
  };
}
function setQty(i, n){
  const c = CART[i]; if(!c) return;
  if(n < 1){ CART.splice(i, 1); renderMedList(); renderCart(); return; }
  const p = loadProducts().find(x=> x.id === c.pid); const u = unitsOf(p).find(x=> x.key === c.unit) || { n:1, label:"পিস" };
  const free = (Number(p.qty) || 0) - cartPieces(c.pid, i);
  if(u.n * n > free){ n = Math.floor(free / u.n); toast("স্টকে আছে " + stockText(p, free)); if(n < 1) return; }
  c.n = n; renderMedList(); renderCart();
}
document.addEventListener("keydown", (e)=>{
  if(CUR_PAGE !== "pos" || document.querySelector(".modal")) return;
  const map = { F1:"cash", F2:"card", F3:"mobile", F6:"due" };
  if(map[e.key]){ e.preventDefault(); PAY = map[e.key]; renderCart(); if(PAY === "due" && !CUST) openCustomerPicker(); }
  else if(e.key === "F5"){ e.preventDefault(); openCustomerPicker(); }
  else if(e.key === "F4"){ e.preventDefault(); if(CART.length) completeSale(); }
  else if(e.key === "F8"){ e.preventDefault(); if(CART.length && confirm("কার্ট খালি করবেন?")){ CART = []; DISCOUNT = 0; renderMedList(); renderCart(); } }
});

/* সাধারণ POS-এর একই ইনভয়েস নম্বরের ধারা (INV-000123) */
function nextInvoiceNo(entries){
  let maxN = 0;
  entries.forEach(e=>{ if(!e.invoiceNo) return; const n = parseInt(String(e.invoiceNo).replace(/[^0-9]/g, ""), 10); if(!isNaN(n) && n > maxN) maxN = n; });
  const stored = parseInt(localStorage.getItem("shop-invoice-counter"), 10);
  if(!isNaN(stored) && stored > maxN) maxN = stored;
  localStorage.setItem("shop-invoice-counter", String(maxN + 1));
  return "INV-" + String(maxN + 1).padStart(6, "0");
}

let SELLING = false;
async function completeSale(){
  if(SELLING) return;
  const T = cartTotals();
  if(!T.lines.length) return;
  // শেষবার স্টক মিলিয়ে নেওয়া — অন্য স্টাফ এর মধ্যে বিক্রি করে থাকতে পারেন
  const prods = loadProducts();
  for(const l of T.lines){
    const p = prods.find(x=> x.id === l.p.id);
    const need = T.lines.filter(x=> x.p.id === l.p.id).reduce((s,x)=> s + x.pieces, 0);
    if(!p || (Number(p.qty) || 0) < need){ toast("⚠️ " + l.p.name + " — স্টকে নেই, কার্ট দেখে নিন"); renderMedList(); return; }
  }
  if(PAY === "due" && !CUST){ toast("বাকিতে বিক্রি করতে আগে গ্রাহক বাছুন"); openCustomerPicker(); return; }
  SELLING = true;
  const all = readJSON("phone-shop-entries", []);
  const billId = uid();
  const invoiceNo = nextInvoiceNo(all);
  const when = new Date().toISOString();
  const isDue = PAY === "due";
  const paymentMethod = isDue ? null : (PAY === "cash" ? "cash" : "bank"); // সাধারণ POS শুধু cash/bank চেনে
  const payLabel = { cash:"নগদ", card:"কার্ড", mobile:"মোবাইল ব্যাংকিং", due:"বাকি" }[PAY];
  const cName = CUST ? CUST.name : "ওয়াক-ইন কাস্টমার", cPhone = CUST ? (CUST.phone || "") : "";
  // ডিসকাউন্ট প্রতিটা লাইনে দামের অনুপাতে ভাগ — যাতে লাভের হিসাব ঠিক থাকে
  let discLeft = T.disc;
  const newEntries = T.lines.map((l, i)=>{
    const share = i === T.lines.length - 1 ? discLeft : r2(T.disc * (l.total / (T.sub || 1)));
    discLeft = r2(discLeft - share);
    const price = r2(l.total - share);
    const unitCost = Number(l.p.buy) || 0;
    return {
      id: uid(), name: cName, phone: cPhone,
      item: l.p.name + (l.u.key === "pc" ? "" : " (" + bn(l.pieces / l.u.n) + " " + l.u.label + ")"),
      productId: l.p.id, qty: l.pieces, unitPrice: r2(price / l.pieces), unitCost,
      cost: r2(unitCost * l.pieces), price, paid: isDue ? 0 : price, paymentMethod, payVia: PAY,
      note: "💊 " + bn(l.pieces / l.u.n) + " " + l.u.label + " = " + bn(l.pieces) + " পিস", status: isDue ? "বাকি" : "নগদ-বিক্রি",
      billId, invoiceNo, date: when, soldBy: (SESSION && SESSION.name) || "এডমিন", source: "pharmacy"
    };
  });

  // স্টক কমানো — আগে যেটার মেয়াদ আগে শেষ হবে সেই ব্যাচ থেকে (FEFO)
  const touched = [];
  T.lines.forEach(l=>{
    const p = prods.find(x=> x.id === l.p.id); if(!p) return;
    p.qty = Math.max(0, (Number(p.qty) || 0) - l.pieces);
    let left = l.pieces;
    (p.batches || []).filter(b=> b && Number(b.qty) > 0)
      .sort((a,b)=> String(a.expiryDate || "9999").localeCompare(String(b.expiryDate || "9999")))
      .forEach(b=>{ if(left <= 0) return; const take = Math.min(left, Number(b.qty) || 0); b.qty = (Number(b.qty) || 0) - take; left -= take; });
    if(!touched.includes(p)) touched.push(p);
  });

  try{
    localStorage.setItem("phone-shop-entries", JSON.stringify(newEntries.concat(all)));
    saveProducts(prods);
    syncBazarStock(touched);
    if(CUST) ensureCustomer(CUST.name, CUST.phone);
    showReceipt(newEntries, T, payLabel);
    CART = []; DISCOUNT = 0; POS_Q = ""; CUST = null; PAY = "cash";
    if(CUR_PAGE === "pos") pagePos();
    refreshBell();
    pushNow();
  }catch(e){
    toast("সেভ করা যায়নি — আবার চেষ্টা করুন");
  }
  SELLING = false;
}

/* Bazar-এ প্রকাশিত ওষুধের স্টক মিলিয়ে রাখা — শেষ হলে Bazar থেকে সরে যায় (সাধারণ POS-এর মতোই) */
function syncBazarStock(list){
  if(!SESSION || !SESSION.shopId || typeof db === "undefined") return;
  let changed = false;
  list.forEach(p=>{
    if(!p.published) return;
    const ref = db.collection("shops").doc(SESSION.shopId).collection("publicStock").doc(p.id);
    if((Number(p.qty) || 0) <= 0){ p.published = false; changed = true; ref.delete().catch(()=>{}); }
    else ref.set({ stockQty: Number(p.qty) || 0, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true }).catch(()=>{});
  });
  if(changed){ const all = loadProducts(); list.forEach(p=>{ const x = all.find(y=> y.id === p.id); if(x) x.published = p.published; }); saveProducts(all); }
}

function saveMed(old){
  const name = $("fName").value.trim();
  if(!name){ toast("ওষুধের নাম লিখুন"); return; }
  const pps = Math.max(1, Math.floor(Number($("fPps").value) || 1)), spb = Math.max(1, Math.floor(Number($("fSpb").value) || 1));
  const per = pps * spb;
  const boxBuy = Number($("fBoxBuy").value) || 0, boxMrp = Number($("fBoxMrp").value) || 0;
  if(!(boxMrp > 0)){ toast("বক্সের বিক্রি দাম (MRP) লিখুন"); return; }
  if(boxBuy > boxMrp && !confirm("কেনা দাম বিক্রি দামের চেয়ে বেশি — তবুও সেভ করবেন?")) return;
  const add = Math.floor(Number($("fAddBox").value) || 0) * per + Math.floor(Number($("fAddPc").value) || 0);
  if(add < 0){ toast("স্টক ঋণাত্মক হতে পারে না"); return; }
  const exp = $("fExp").value, batchNo = $("fBatch").value.trim();
  const list = loadProducts();
  if(!old && list.some(x=> String(x.name || "").trim().toLowerCase() === name.toLowerCase())){
    toast("এই নামে ওষুধ আগে থেকেই আছে — তালিকা থেকে খুলে স্টক যোগ করুন"); return;
  }
  ensureMedCategory();
  const p = old ? list.find(x=> x.id === old.id) : { id: uid(), catId: MED_CAT_ID, subId: "", subSubId: "", unit: "pcs", productType: "batch", variants: [], batches: [], qty: 0, published: false, image: null, imageId: null, imageUrl: null, note: "" };
  Object.assign(p, {
    name, genericName: $("fGen").value.trim() || null, rackLocation: $("fRack").value.trim() || null,
    code: $("fCode").value.trim(), piecesPerStrip: pps, stripsPerBox: spb,
    buy: r2(boxBuy / per * 10000) / 10000, sell: r2(boxMrp / per * 10000) / 10000,
    min: Math.max(0, Math.floor(Number($("fMin").value) || 0)),
    pharma: { company: $("fCo").value.trim() || null, form: $("fForm").value, boxBuy, boxMrp },
  });
  if(!p.productType || p.productType === "standard") p.productType = "batch";
  if(add > 0){
    p.qty = (Number(p.qty) || 0) + add;
    p.batches = p.batches || [];
    p.batches.push({ batchNo, expiryDate: exp || "", qty: add, addedAt: Date.now() });
  }
  if(!old) list.push(p);
  saveProducts(list);
  if(p.published) syncBazarStock([p]);
  closeModal();
  toast(old ? "✅ বদলানো হয়েছে" : "✅ ওষুধ যোগ হয়েছে");
  pushNow();
  if(CUR_PAGE === "meds") renderMeds(); else if(CUR_PAGE === "pos"){ renderMedList(); } else if(CUR_PAGE === "purchase"){ renderPurLines(); }
  refreshBell();
}


/* =====================================================================
   📥 ক্রয় (Purchase) — সরবরাহকারীর কাছ থেকে ওষুধ কেনা
   স্টক বাড়ে (ব্যাচ ও মেয়াদসহ), পিসের কেনা দাম নতুন দামে বদলায়, আর
   সরবরাহকারীর হিসাব সাধারণ POS-এর একই খাতায় যায়:
     shop-suppliers      { id, name, phone, note, due }
     shop-supplier-txns  { id, supplierId, type:'purchase'|'payment', amount, note, date }
   তাই সাধারণ POS-এর "সাপ্লায়ার" পাতায় বাকি ঠিকঠাক মিলে থাকে।
   ===================================================================== */
const PDRAFT_KEY = "hb-pharma-purchase-draft";
const PHIST_KEY = "hb-pharma-purchases";
let PUR = null;   // { supplierId, invNo, date, discount, paid, lines:[{pid, batch, exp, n, unit, rate}] }

function blankPurchase(){ return { supplierId:"", invNo:"", date: todayStr(), discount:0, paid:"", lines:[ { pid:"", batch:"", exp:"", n:"", unit:"box", rate:"" } ] }; }
const loadSuppliers = ()=> readJSON("shop-suppliers", []);
function purLine(l, prods){
  const p = prods.find(x=> x.id === l.pid);
  if(!p) return null;
  const u = unitsOf(p).find(x=> x.key === l.unit) || unitsOf(p)[0];
  const n = Math.max(0, Number(l.n) || 0), rate = Math.max(0, Number(l.rate) || 0);
  return { p, u, n, rate, pieces: n * u.n, total: r2(n * rate) };
}
function purTotals(){
  const prods = loadProducts();
  const lines = PUR.lines.map(l=> purLine(l, prods));
  const sub = r2(lines.reduce((s,l)=> s + (l ? l.total : 0), 0));
  const disc = Math.min(sub, Math.max(0, Number(PUR.discount) || 0));
  const net = r2(sub - disc);
  const paid = PUR.paid === "" ? net : Math.min(net, Math.max(0, Number(PUR.paid) || 0));
  return { lines, sub, disc, net, paid, due: r2(net - paid) };
}

// পুরনো কেনা দাম আগে থেকে বসানো — বদলাতে চাইলে বদলানো যায়
function prefillRate(l){
  const p = loadProducts().find(x=> x.id === l.pid); if(!p) return;
  const u = unitsOf(p).find(x=> x.key === l.unit); if(!u) return;
  if(Number(p.buy) > 0) l.rate = String(r2(Number(p.buy) * u.n));
}
function wirePicker(inp){
  const i = +inp.dataset.pq, drop = document.querySelector(`[data-pd="${i}"]`);
  let kb = 0, hits = [];
  const draw = ()=>{
    const q = inp.value.trim();
    hits = loadProducts().filter(p=> medMatches(p, q)).slice(0, 30);
    drop.hidden = !hits.length || document.activeElement !== inp;
    drop.innerHTML = hits.map((p, k)=> `<div class="${k === kb ? "kb" : ""}" data-pick="${esc(p.id)}"><b>${esc(p.name)}</b> <small>${esc(p.genericName || "")} · স্টক ${esc(stockText(p))}</small></div>`).join("");
    drop.querySelectorAll("[data-pick]").forEach(d=> d.onmousedown = (e)=>{ e.preventDefault(); choose(d.dataset.pick); });
  };
  const choose = (pid)=>{
    const l = PUR.lines[i]; l.pid = pid;
    const p = loadProducts().find(x=> x.id === pid);
    const units = unitsOf(p); l.unit = units[units.length - 1].key; // সাধারণত বক্সে কেনা হয়
    prefillRate(l);
    renderPurLines();
    const q = $("pBody").querySelector(`[data-f="batch"][data-i="${i}"]`); if(q) q.focus();
  };
  inp.addEventListener("focus", ()=>{ kb = 0; draw(); });
  inp.addEventListener("input", ()=>{ kb = 0; draw(); });
  inp.addEventListener("blur", ()=> setTimeout(()=>{ drop.hidden = true; }, 120));
  inp.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowDown"){ e.preventDefault(); kb = Math.min(hits.length - 1, kb + 1); draw(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); kb = Math.max(0, kb - 1); draw(); }
    else if(e.key === "Enter"){ e.preventDefault(); if(hits[kb]) choose(hits[kb].id); }
  });
}

function completePurchase(){
  const T = purTotals();
  const sup = loadSuppliers().find(s=> s.id === PUR.supplierId);
  if(!sup){ toast("সরবরাহকারী বেছে নিন"); $("pSup").focus(); return; }
  const lines = T.lines.map((L, i)=> L ? Object.assign({ raw: PUR.lines[i] }, L) : null).filter(L=> L && L.n > 0);
  if(!lines.length){ toast("অন্তত একটা ওষুধের পরিমাণ লিখুন"); return; }
  const bad = lines.find(L=> !(L.rate > 0));
  if(bad){ toast("⚠️ " + bad.p.name + " — ক্রয়দর লিখুন"); return; }
  if(!confirm(`${sup.name}-এর কাছ থেকে ${bn(lines.length)}টি ওষুধ, মোট ${money(T.net)}।\nপরিশোধ ${money(T.paid)}${T.due > 0 ? ", বাকি " + money(T.due) : ""}।\n\nস্টকে যোগ করবেন?`)) return;

  const prods = loadProducts();
  const touched = [];
  lines.forEach(L=>{
    const p = prods.find(x=> x.id === L.p.id); if(!p) return;
    p.qty = (Number(p.qty) || 0) + L.pieces;
    p.batches = p.batches || [];
    p.batches.push({ batchNo: (L.raw.batch || "").trim(), expiryDate: L.raw.exp || "", qty: L.pieces, addedAt: Date.now(), supplierId: sup.id, invoiceNo: PUR.invNo || "" });
    // নতুন কেনা দাম — পিস ও বক্সের হিসাবে
    p.buy = r2(L.rate / L.u.n * 10000) / 10000;
    p.pharma = Object.assign({}, p.pharma || {}, { boxBuy: r2(p.buy * packOf(p).perBox) });
    if(!p.productType || p.productType === "standard") p.productType = "batch";
    if(!touched.includes(p)) touched.push(p);
  });
  saveProducts(prods);
  syncBazarStock(touched);

  // সরবরাহকারীর হিসাব — সাধারণ POS-এর একই নিয়মে
  const sups = loadSuppliers(); const s = sups.find(x=> x.id === sup.id);
  s.due = r2(Math.max(0, (Number(s.due) || 0) + T.due));
  localStorage.setItem("shop-suppliers", JSON.stringify(sups));
  const txns = readJSON("shop-supplier-txns", []);
  const when = PUR.date && PUR.date !== todayStr() ? new Date(PUR.date + "T12:00:00").toISOString() : new Date().toISOString();
  const note = "💊 ফার্মেসি ক্রয়" + (PUR.invNo ? " · ইনভয়েস " + PUR.invNo : "") + " · " + lines.length + "টি ওষুধ";
  txns.push({ id: uid(), supplierId: s.id, type: "purchase", amount: T.net, note, date: when });
  if(T.paid > 0) txns.push({ id: uid(), supplierId: s.id, type: "payment", amount: T.paid, note: T.due > 0 ? "আংশিক পরিশোধ (ক্রয়ের সময়)" : "ক্রয়ের সাথে সাথে পরিশোধ", date: when });
  localStorage.setItem("shop-supplier-txns", JSON.stringify(txns));

  // সাম্প্রতিক ক্রয়ের তালিকা (শেষ ১০০টা)
  const hist = readJSON(PHIST_KEY, []);
  hist.unshift({ id: uid(), supplierId: s.id, supplierName: s.name, invNo: PUR.invNo || "", date: when, net: T.net, paid: T.paid, due: T.due, by: (SESSION && SESSION.name) || "",
    items: lines.map(L=> ({ name: L.p.name, n: L.n, unit: L.u.label, rate: L.rate, batch: L.raw.batch || "", exp: L.raw.exp || "" })) });
  localStorage.setItem(PHIST_KEY, JSON.stringify(hist.slice(0, 100)));

  localStorage.removeItem(PDRAFT_KEY);
  PUR = blankPurchase();
  pushNow();
  toast("✅ ক্রয় সম্পন্ন — স্টকে যোগ হয়েছে");
  pagePurchase(); refreshBell();
}

/* =====================================================================

function openSupplierLedger(id){
  const s = loadSuppliers().find(x=> x.id === id); if(!s) return;
  const txns = readJSON("shop-supplier-txns", []).filter(t=> t.supplierId === id).sort((a,b)=> String(a.date).localeCompare(String(b.date)));
  // খাতায় লেখা নেই এমন পুরনো বাকি থাকলে (যেমন আগে হাতে বসানো) শুরুতে "আগের বাকি" সারি —
  // যাতে শেষ স্থিতি সবসময় বর্তমান বাকির সাথে মেলে
  const net = txns.reduce((a,t)=> a + (t.type === "purchase" ? 1 : -1) * (Number(t.amount) || 0), 0);
  const opening = r2((Number(s.due) || 0) - net);
  let bal = opening;
  const rows = txns.map(t=>{ bal += (t.type === "purchase" ? 1 : -1) * (Number(t.amount) || 0); return { t, bal: r2(bal) }; });
  if(Math.abs(opening) >= 0.01) rows.unshift({ t: { date: txns.length ? txns[0].date : new Date().toISOString(), note: "আগের বাকি", type: opening > 0 ? "purchase" : "payment", amount: Math.abs(opening) }, bal: opening });
  rows.reverse();
  const admin = isAdmin();
  openModal(`<div class="head"><h3>🚚 ${esc(s.name)}</h3><button class="x" type="button" data-close aria-label="বন্ধ">✕</button></div>
    <div class="hint">${s.phone ? "📱 " + esc(s.phone) : ""}${s.note ? " · " + esc(s.note) : ""}</div>
    ${admin ? `<div class="calc" style="display:flex; justify-content:space-between; align-items:center"><span>বর্তমান বাকি (আমাদের দেনা)</span><b class="num ${Number(s.due) > 0 ? "bad" : ""}" style="font-size:20px">${money(s.due || 0)}</b></div>
    <h3 style="font-size:16px; margin:16px 0 6px">লেনদেনের খাতা</h3>

      ${rows.map(({t, bal})=> `<tr><td>${fmtDate(t.date)}</td><td>${esc(t.note || (t.type === "purchase" ? "ক্রয়" : "পরিশোধ"))}</td><td class="r num">${t.type === "purchase" ? money(t.amount) : ""}</td><td class="r num">${t.type === "payment" ? money(t.amount) : ""}</td><td class="r num">${money(bal)}</td></tr>`).join("")}
    </tbody></table>` : `<div class="empty">এখনো কোনো লেনদেন নেই।</div>`}` : `<div class="empty">টাকার হিসাব শুধু এডমিন দেখতে পারেন।</div>`}
    <div class="foot">
      <button class="btn ghost" type="button" id="supBuy">📥 এর কাছ থেকে ক্রয়</button>

function openSupplierPay(id){
  const s = loadSuppliers().find(x=> x.id === id); if(!s) return;
  const due = Number(s.due) || 0;
  openModal(`<div class="head"><h3>💵 ${esc(s.name)} — বাকি পরিশোধ</h3><button class="x" type="button" data-close aria-label="বন্ধ">✕</button></div>

    <div class="row2"><div><label class="f">কত টাকা দিচ্ছেন *</label><input class="in num" id="spAmt" inputmode="decimal" value="${due}"></div>

    <label class="f">নোট</label><input class="in" id="spNote" placeholder="যেমন: প্রতিনিধির হাতে দেওয়া">
    <div class="foot"><button class="btn ghost" type="button" data-close>বাতিল</button><button class="btn green" type="button" id="spSave">✅ পরিশোধ করুন</button></div>`);
  $("spSave").onclick = ()=>{
    const amt = r2(Number($("spAmt").value) || 0);
    if(!(amt > 0)){ toast("টাকার পরিমাণ লিখুন"); return; }

    const sups = loadSuppliers(); const x = sups.find(y=> y.id === id);
    x.due = r2(Math.max(0, (Number(x.due) || 0) - amt));
    localStorage.setItem("shop-suppliers", JSON.stringify(sups));
    const note = ($("spNote").value.trim() || "বাকি পরিশোধ") + ($("spVia").value === "bank" ? " (ব্যাংক/বিকাশ)" : "");

    const ex = readJSON("shop-expenses", []); ex.push({ id: uid(), category: "সাপ্লায়ার পেমেন্ট", person: x.name, amount: amt, note, date: new Date().toISOString() });
    localStorage.setItem("shop-expenses", JSON.stringify(ex));
    pushNow(); toast("✅ " + money(amt) + " পরিশোধ হয়েছে");
    openSupplierLedger(id);
    if(CUR_PAGE === "suppliers") pageSuppliers();
  };

/* =====================================================================
   👥 গ্রাহক — বাকি ও আদায়
   বাকি আদায় সাধারণ POS-এর মতোই: টাকা সবচেয়ে পুরনো বাকি থেকে কাটে (paid বাড়ে),
   একটা "Deposit Received" জমার লাইন যোগ হয় (নগদ/ব্যাংকের হিসাবের জন্য),
   আর bcc-due-log-এ আদায়ের খতিয়ান থাকে।
   ===================================================================== */
function dueSummary(entries){
  const map = {};
  entries.forEach(e=>{
    const d = Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0); if(d <= 0) return;
    const k = e.phone ? "p:" + e.phone : "n:" + e.name;
    map[k] = (map[k] || 0) + d;
  });
  const vals = Object.values(map);
  return { total: r2(vals.reduce((a,b)=> a + b, 0)), count: vals.length, map };
}
let CUST_Q = "", CUST_ONLY_DUE = false;
function pageCustomers(){
  const entries = loadEntries();
  const sum = dueSummary(entries);
  $("page").innerHTML = `
    <div class="pageHead"><h1>গ্রাহক</h1><button class="btn" type="button" id="cAdd">➕ নতুন গ্রাহক</button></div>
    ${isAdmin() ? `<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr)); max-width:640px">
      <div class="stat b"><div class="ic">👥</div><div><div class="lbl">মোট গ্রাহক</div><div class="val num">${bn(loadCustomers().length)}</div></div></div>
      <div class="stat r"><div class="ic">📒</div><div><div class="lbl">বাকি আদায়যোগ্য</div><div class="val num">${money(sum.total)}</div><div class="sub">${bn(sum.count)} জনের কাছে</div></div></div>
    </div>` : ""}
    <div class="toolbar"><input class="in" id="cQ" placeholder="🔍 নাম বা মোবাইল দিয়ে খুঁজুন" value="${esc(CUST_Q)}">
      ${isAdmin() ? `<label style="display:flex; align-items:center; gap:6px; font-size:14px"><input type="checkbox" id="cDue"${CUST_ONLY_DUE ? " checked" : ""}> শুধু যাদের বাকি আছে</label>` : ""}</div>
    <div class="panel" style="padding:6px 8px" id="cBox"></div>`;
  $("cAdd").onclick = ()=> openCustomerPicker((c)=>{ toast("✅ " + c.name + " যোগ হয়েছে"); pageCustomers(); });
  $("cQ").oninput = ()=>{ CUST_Q = $("cQ").value.trim(); renderCustomers(); };
  if($("cDue")) $("cDue").onchange = ()=>{ CUST_ONLY_DUE = $("cDue").checked; renderCustomers(); };
  renderCustomers();
}
function renderCustomers(){
  const entries = loadEntries();
  const q = CUST_Q.toLowerCase();
  const lastBuy = {};
  entries.forEach(e=>{ const k = e.phone ? "p:" + e.phone : "n:" + e.name; if(!lastBuy[k] || String(e.date) > String(lastBuy[k])) lastBuy[k] = e.date; });
  const sum = dueSummary(entries);
  let list = loadCustomers().map(c=> ({ c, k: c.phone ? "p:" + c.phone : "n:" + c.name }))
    .map(x=> Object.assign(x, { due: isAdmin() ? r2(sum.map[x.k] || 0) : 0, last: lastBuy[x.k] }))
    .filter(x=> (!q || x.c.name.toLowerCase().includes(q) || String(x.c.phone || "").includes(q)) && (!CUST_ONLY_DUE || x.due > 0))
    .sort((a,b)=> b.due - a.due || String(b.last || "").localeCompare(String(a.last || "")));
  if(!list.length){ $("cBox").innerHTML = `<div class="empty">${q || CUST_ONLY_DUE ? "এমন কোনো গ্রাহক নেই।" : "এখনো কোনো গ্রাহক নেই। বিক্রির সময় \"👤 গ্রাহক বাছুন\" দিয়েও যোগ করা যায়।"}</div>`; return; }
  $("cBox").innerHTML = `<table class="t"><thead><tr><th>নাম</th><th>মোবাইল</th><th class="r">শেষ কেনা</th>${isAdmin() ? '<th class="r">বাকি</th>' : ""}</tr></thead><tbody>
    ${list.slice(0, 300).map((x, i)=> `<tr data-ci="${i}" style="cursor:pointer"><td><b>${esc(x.c.name)}</b></td><td>${x.c.phone ? `<a href="tel:${esc(x.c.phone)}" onclick="event.stopPropagation()">${esc(x.c.phone)}</a>` : "—"}</td><td class="r">${x.last ? fmtDate(x.last) : "—"}</td>${isAdmin() ? `<td class="r num ${x.due > 0 ? "bad" : ""}">${money(x.due)}</td>` : ""}</tr>`).join("")}
  </tbody></table>`;
  $("cBox").querySelectorAll("[data-ci]").forEach(tr=> tr.onclick = ()=>{ const c = list[+tr.dataset.ci].c; openCustomerLedger(c.name, c.phone || ""); });
}
function openCustomerLedger(name, phone){
  const entries = loadEntries().filter(e=> sameCust(e, name, phone)).sort((a,b)=> String(b.date).localeCompare(String(a.date)));
  const due = custDue(name, phone);
  const admin = isAdmin();
  const dueItems = entries.filter(e=> Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0) > 0);
  const deposits = entries.filter(e=> Number(e.depositAmount) > 0);
  const buys = entries.filter(e=> !(Number(e.depositAmount) > 0) && e.item !== "Deposit Received");
  openModal(`<div class="head"><h3>👤 ${esc(name)}</h3><button class="x" type="button" data-close aria-label="বন্ধ">✕</button></div>
    <div class="hint">${phone ? `📱 <a href="tel:${esc(phone)}">${esc(phone)}</a>` : "মোবাইল নেই"} · মোট ${bn(new Set(buys.map(e=> e.billId || e.invoiceNo || e.id)).size)} বার কেনা</div>
    ${admin ? `<div class="calc" style="display:flex; justify-content:space-between; align-items:center"><span>বর্তমান বাকি</span><b class="num ${due > 0 ? "bad" : ""}" style="font-size:20px">${money(due)}</b></div>
    ${dueItems.length ? `<h3 style="font-size:16px; margin:14px 0 6px">যেগুলোর বাকি আছে</h3><table class="t"><thead><tr><th>তারিখ</th><th>ওষুধ</th><th class="r">বাকি</th></tr></thead><tbody>${dueItems.map(e=> `<tr><td>${fmtDate(e.date)}</td><td>${esc(e.item)}</td><td class="r num">${money(Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0))}</td></tr>`).join("")}</tbody></table>` : ""}
    ${deposits.length ? `<h3 style="font-size:16px; margin:14px 0 6px">আদায়</h3><table class="t"><tbody>${deposits.slice(0, 10).map(e=> `<tr><td>${fmtDate(e.date)}</td><td>${e.paymentMethod === "bank" ? "ব্যাংক/বিকাশ" : "নগদ"}</td><td class="r num">${money(e.depositAmount)}</td></tr>`).join("")}</tbody></table>` : ""}` : ""}
    <h3 style="font-size:16px; margin:14px 0 6px">সাম্প্রতিক কেনা</h3>
    ${buys.length ? `<table class="t"><tbody>${buys.slice(0, 12).map(e=> `<tr><td>${fmtDate(e.date)}</td><td>${esc(e.item)}</td><td class="r num">${money(e.price)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">এখনো কিছু কেনেননি।</div>`}
    <div class="foot">
      <button class="btn ghost" type="button" id="clSell">🛒 এঁকে বিক্রি করুন</button>
      ${admin && due > 0 ? `<button class="btn green" type="button" id="clPay">💵 বাকি আদায়</button>` : ""}
    </div>`);
  $("clSell").onclick = ()=>{ closeModal(); CUST = { name, phone }; go("pos"); };
  if($("clPay")) $("clPay").onclick = ()=> openDueCollect(name, phone);
}
function openDueCollect(name, phone){
  const due = custDue(name, phone);
  openModal(`<div class="head"><h3>💵 ${esc(name)} — বাকি আদায়</h3><button class="x" type="button" data-close aria-label="বন্ধ">✕</button></div>
    <div class="calc">বর্তমান বাকি: <b>${money(due)}</b></div>
    <div class="row2"><div><label class="f">কত টাকা নিচ্ছেন *</label><input class="in num" id="dcAmt" inputmode="decimal" value="${due}"></div>
      <div><label class="f">কীভাবে</label><select class="in" id="dcVia"><option value="cash">নগদ</option><option value="bank">ব্যাংক / বিকাশ / নগদ অ্যাপ</option></select></div></div>
    <div class="hint" id="dcHint"></div>
    <div class="foot"><button class="btn ghost" type="button" data-close>বাতিল</button><button class="btn green" type="button" id="dcSave">✅ আদায় করুন</button></div>`);
  const hint = ()=>{ const a = Number($("dcAmt").value) || 0; $("dcHint").textContent = a > due ? "বাকি শোধ — গ্রাহককে ফেরত দিন " + money(a - due) : (a > 0 ? "নতুন বাকি থাকবে " + money(due - a) : ""); };
  $("dcAmt").oninput = hint; hint();
  $("dcSave").onclick = ()=>{
    const amt = r2(Number($("dcAmt").value) || 0);
    if(!(amt > 0)){ toast("টাকার পরিমাণ লিখুন"); return; }
    const take = Math.min(amt, due);
    const all = readJSON("phone-shop-entries", []);
    const del = readJSON("phone-shop-deleted-entry-ids", []);
    let left = take;
    all.filter(e=> !del.includes(e.id) && sameCust(e, name, phone) && Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0) > 0)
      .sort((a,b)=> new Date(a.date) - new Date(b.date))
      .forEach(e=>{ if(left <= 0) return; const d = Math.max((Number(e.price) || 0) - (Number(e.paid) || 0), 0); const ap = Math.min(d, left); e.paid = r2((Number(e.paid) || 0) + ap); left = r2(left - ap); });
    const method = $("dcVia").value;
    all.unshift({ id: uid(), name, item: "Deposit Received", phone, cost: 0, price: 0, paid: 0, depositAmount: take, paymentMethod: method,
      note: CUR() + " " + take + " deposited (ফার্মেসি)", status: "নগদ", invoiceNo: nextInvoiceNo(all), date: new Date().toISOString(), soldBy: (SESSION && SESSION.name) || "এডমিন", source: "pharmacy" });
    localStorage.setItem("phone-shop-entries", JSON.stringify(all));
    const log = readJSON("bcc-due-log", []); log.unshift({ date: new Date().toISOString(), name, amount: take });
    localStorage.setItem("bcc-due-log", JSON.stringify(log.slice(0, 500)));
    pushNow();
    toast("✅ " + money(take) + " আদায় হয়েছে" + (amt > due ? " · ফেরত " + money(amt - due) : ""));
    openCustomerLedger(name, phone);
    if(CUR_PAGE === "customers") pageCustomers();
  };
}

function openModal(inner){
  $("modalRoot").innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="box">${inner}</div></div>`;
  const m = $("modalRoot").firstElementChild;
  m.addEventListener("click", (e)=>{ if(e.target === m || e.target.closest("[data-close]")) closeModal(); });
  const f = m.querySelector("input, select, button"); if(f && window.innerWidth > 900) f.focus();
}
function closeModal(){ $("modalRoot").innerHTML = ""; }
document.addEventListener("keydown", (e)=>{ if(e.key === "Escape" && $("modalRoot").innerHTML) closeModal(); });

$("modeBtn").addEventListener("click", async ()=>{

/* =====================================================================
   সিঙ্ক
   ===================================================================== */
async function pushNow(wait){
  try{
    const p = pushLocalStorageToCloud();
    if(wait) await Promise.race([p, new Promise(r=> setTimeout(r, 8000))]);
  }catch(e){}
}
function netLabel(){ $("syncTxt").textContent = navigator.onLine ? "🟢 অনলাইন" : "🔴 অফলাইন — ফোনে সেভ হচ্ছে"; }
window.addEventListener("online", ()=>{ netLabel(); pushNow(); });
window.addEventListener("offline", netLabel);

/* =====================================================================
   শুরু
   ===================================================================== */
auth.onAuthStateChanged(async (user)=>{
  const s = getSession();
  if(!user || !s || !s.shopId || (s.role !== "admin" && s.role !== "subuser")){ location.replace(s && !s.shopId ? "shop-ledger-app.html" : "login.html"); return; }
  SESSION = s;
  $("gateMsg").textContent = "ক্লাউড থেকে খাতা মেলানো হচ্ছে…";
  try{ await Promise.race([pullCloudToLocalStorage(s.shopId), new Promise((_, rej)=> setTimeout(()=> rej(new Error("timeout")), 12000))]); }catch(e){}
  try{
    const sd = await db.collection("shops").doc(s.shopId).get();
    const info = sd.exists ? sd.data() : {};
    if(info.status === "blocked"){ $("gateMsg").textContent = "🔒 একাউন্ট ব্লক করা আছে — এডমিনের সাথে যোগাযোগ করুন।"; return; }
    if(info.currencySymbol) localStorage.setItem("shop-currency-symbol", info.currencySymbol);
  }catch(e){}
  enableAutoSync(s.shopId);
  watchAppDataChanges(s.shopId, ()=>{
    // অন্য ফোনে (স্টাফ) বিক্রি/স্টক বদলালে এখানেও সাথে সাথে দেখা যায়
    if(localStorage.getItem("hb-pharmacy-mode") === "0" && !isAdmin()){ location.replace("shop-ledger-app.html"); return; }
    if(!document.querySelector(".modal")) go(CUR_PAGE); else refreshBell();
  });

  $("shopName").textContent = localStorage.getItem("shop-title") || s.shopName || "ফার্মেসি";
  $("meName").textContent = s.name || "—";
  $("meRole").textContent = isAdmin() ? "এডমিন" : "স্টাফ";
  if(!isAdmin()) $("modeBtn").textContent = "↩️ সাধারণ POS দেখুন";
  netLabel();
  $("gate").remove(); $("app").hidden = false; $("bnav").hidden = false;
  const start = (location.hash || "").replace("#", "");
  go(["dash","pos","meds","alerts","purchase","suppliers","customers"].includes(start) || MENU.some(m=> m.key === start && (!m.admin || isAdmin())) ? start : "dash");
});
</script>
