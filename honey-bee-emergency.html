<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚑 Honey Bee Transport — বুক করুন</title>
<meta name="theme-color" content="#7f1d1d">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{ --red:#dc2626; --dark:#1a1206; --card:#2b1010; --border:rgba(239,68,68,0.25); --ok:#16a34a; --muted:#c9a8a8; }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{ min-height:100vh; background:linear-gradient(160deg,#1a1206,#3d0f0f); color:#fff8e8; font-family:'Noto Sans Bengali','Space Mono',sans-serif; }
  .wrap{ max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  header{ text-align:center; margin-bottom:16px; }
  header .hex{ font-size:42px; }
  header h1{ margin:8px 0 2px; font-size:18px; font-weight:800; }
  header p{ margin:0; font-size:11px; color:#fca5a5; letter-spacing:1.3px; text-transform:uppercase; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; }
  label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .mapEl{ width:100%; height:220px; border-radius:12px; overflow:hidden; margin-bottom:10px; background:#111; }
  .hint{ font-size:11.5px; color:var(--muted); margin:0 0 10px; }
  .btn{ width:100%; padding:13px; border:none; border-radius:11px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; background:var(--red); color:#fff; }
  .btn.grey{ background:transparent; border:1px solid var(--border); color:var(--muted); }

  .statusBox{ text-align:center; padding:24px 16px; }
  .statusBox .ic{ font-size:44px; margin-bottom:10px; }
  .statusBox h3{ margin:0 0 6px; font-size:15px; }
  .statusBox p{ font-size:12.5px; color:var(--muted); margin:0; }
  .pulseDot{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ok); animation:pulse 1.2s infinite; margin-right:6px; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

  .driverInfoRow{ display:flex; align-items:center; gap:12px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .driverInfoRow .ic{ font-size:32px; }
  .driverInfoRow .info{ flex:1; text-align:left; }
  .driverInfoRow .name{ font-weight:700; font-size:14px; }
  .driverInfoRow .meta{ font-size:11.5px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hex">🚑</div>
    <h1>Honey Bee Transport</h1>
    <p>এখনই বুক করুন</p>
  </header>

  <div id="screenBook">
    <div class="card">
      <label>📍 পিকআপ লোকেশন</label>
      <div class="mapEl" id="pickupMapEl"></div>
      <p class="hint" id="pickupHint">GPS দিয়ে স্বয়ংক্রিয়ভাবে পিকআপ বসানো হয়েছে — চাইলে ম্যাপে ট্যাপ করে বদলাতে পারেন।</p>

      <label>🏁 ড্রপ-অফ লোকেশন</label>
      <div class="mapEl" id="dropMapEl"></div>
      <p class="hint" id="dropHint">ম্যাপে ট্যাপ করে গন্তব্য বসান।</p>

      <button class="btn" id="bookBtn">🚕 এখন বুক করুন</button>
    </div>
  </div>

  <div id="screenStatus" style="display:none;">
    <div class="card statusBox">
      <div class="ic" id="statusIcon">🔍</div>
      <h3 id="statusTitle"><span class="pulseDot"></span>কাছের ড্রাইভার খোঁজা হচ্ছে...</h3>
      <p id="statusSub">একটু অপেক্ষা করুন</p>
      <div class="driverInfoRow" id="driverInfoRow" style="display:none;">
        <div class="ic">🚑</div>
        <div class="info">
          <div class="name" id="statusDriverName">—</div>
          <div class="meta" id="statusDriverMeta">—</div>
        </div>
      </div>
    </div>
    <div class="mapEl" id="liveTrackMapEl" style="display:none; height:220px;"></div>
    <button class="btn grey" id="cancelBookingBtn">✕ বাতিল করুন</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD6qmuWkNUrskMIBHq8Z_AQ0N_WT1DL8Is",
  authDomain: "honeybee-984dd.firebaseapp.com",
  projectId: "honeybee-984dd",
  storageBucket: "honeybee-984dd.firebasestorage.app",
  messagingSenderId: "610211112501",
  appId: "1:610211112501:web:9ea40b9060d425e85b737c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function $(id){ return document.getElementById(id); }
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}
function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

let pickupMap, dropMap, pickupMarker, dropMarker;
let pickupLatLng = null, dropLatLng = null;

function initMaps(centerLatLng){
  pickupMap = L.map("pickupMapEl").setView(centerLatLng, 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap', maxZoom:19 }).addTo(pickupMap);
  pickupMarker = L.marker(centerLatLng, { draggable:true }).addTo(pickupMap);
  pickupLatLng = centerLatLng;
  pickupMarker.on("dragend", ()=>{ const p = pickupMarker.getLatLng(); pickupLatLng = [p.lat, p.lng]; });
  pickupMap.on("click", (e)=>{ pickupLatLng = [e.latlng.lat, e.latlng.lng]; pickupMarker.setLatLng(pickupLatLng); });

  dropMap = L.map("dropMapEl").setView(centerLatLng, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap', maxZoom:19 }).addTo(dropMap);
  dropMap.on("click", (e)=>{
    dropLatLng = [e.latlng.lat, e.latlng.lng];
    if(dropMarker) dropMap.removeLayer(dropMarker);
    dropMarker = L.marker(dropLatLng).addTo(dropMap).bindPopup("🏁 ড্রপ-অফ").openPopup();
  });
}

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition((pos)=>{
    initMaps([pos.coords.latitude, pos.coords.longitude]);
  }, ()=>{ initMaps([24.7136, 46.6753]); $("pickupHint").textContent = "GPS পাওয়া যায়নি — ম্যাপে ট্যাপ করে পিকআপ বসান।"; });
}else{
  initMaps([24.7136, 46.6753]);
}

let currentTripId = null, tripUnsub = null, liveTrackMap = null, driverMarker = null;

$("bookBtn").addEventListener("click", async ()=>{
  if(!pickupLatLng || !dropLatLng){ alert("পিকআপ ও ড্রপ-অফ — দুটোই বসান।"); return; }
  const distanceKm = haversineKm(pickupLatLng[0], pickupLatLng[1], dropLatLng[0], dropLatLng[1]);
  const estimatedFare = Math.round((30 + distanceKm * 15) * 100) / 100; // সহজ ভাড়া হিসাব (বেস+প্রতি কিমি) — পরে দোকান/এজেন্ট কনফিগ থেকে আনা যাবে
  const driverEarning = Math.round(estimatedFare * 0.8 * 100) / 100;

  $("bookBtn").disabled = true; $("bookBtn").textContent = "বুক হচ্ছে...";
  try{
    const tripRef = await db.collection("trips").add({
      status: "requested",
      customerName: "কাস্টমার",
      pickupLat: pickupLatLng[0], pickupLng: pickupLatLng[1], pickupAddress: `${pickupLatLng[0].toFixed(4)}, ${pickupLatLng[1].toFixed(4)}`,
      dropLat: dropLatLng[0], dropLng: dropLatLng[1], dropAddress: `${dropLatLng[0].toFixed(4)}, ${dropLatLng[1].toFixed(4)}`,
      distanceKm: Math.round(distanceKm*10)/10,
      estimatedFare, driverEarning,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    currentTripId = tripRef.id;
    $("screenBook").style.display = "none";
    $("screenStatus").style.display = "block";
    watchTrip(tripRef.id);
  }catch(e){
    alert("বুক করা যায়নি: " + e.message);
  }finally{
    $("bookBtn").disabled = false; $("bookBtn").textContent = "🚕 এখন বুক করুন";
  }
});

function watchTrip(tripId){
  if(tripUnsub) tripUnsub();
  tripUnsub = db.collection("trips").doc(tripId).onSnapshot(async (doc)=>{
    if(!doc.exists) return;
    const trip = doc.data();
    if(trip.status === "requested"){
      $("statusIcon").textContent = "🔍";
      $("statusTitle").innerHTML = '<span class="pulseDot"></span>কাছের ড্রাইভার খোঁজা হচ্ছে...';
      $("statusSub").textContent = "একটু অপেক্ষা করুন";
      $("driverInfoRow").style.display = "none";
    }else if(trip.status === "accepted" || trip.status === "ongoing"){
      $("statusIcon").textContent = trip.status === "ongoing" ? "🚗" : "✅";
      $("statusTitle").textContent = trip.status === "ongoing" ? "ট্রিপ চলছে" : "ড্রাইভার পাওয়া গেছে!";
      $("statusSub").textContent = trip.status === "ongoing" ? "আপনার দিকে আসছেন" : "ড্রাইভার পিকআপে আসছেন";
      $("driverInfoRow").style.display = "flex";
      if(trip.driverId){
        try{
          const dDoc = await db.collection("transportDrivers").doc(trip.driverId).get();
          if(dDoc.exists){
            const d = dDoc.data();
            $("statusDriverName").textContent = d.name || "ড্রাইভার";
            const v = d.vehicle || {};
            $("statusDriverMeta").textContent = [v.type, v.regNumber].filter(Boolean).join(" · ");
          }
        }catch(e){}
        showLiveTrack(trip);
      }
    }else if(trip.status === "completed"){
      $("statusIcon").textContent = "🎉";
      $("statusTitle").textContent = "ট্রিপ সম্পন্ন হয়েছে!";
      $("statusSub").textContent = "ধন্যবাদ Honey Bee Transport ব্যবহার করার জন্য";
      $("cancelBookingBtn").style.display = "none";
    }else if(trip.status === "cancelled"){
      $("statusIcon").textContent = "✕";
      $("statusTitle").textContent = "ট্রিপ বাতিল হয়ে গেছে";
      $("statusSub").textContent = "";
    }
  });
}

function showLiveTrack(trip){
  $("liveTrackMapEl").style.display = "block";
  if(!liveTrackMap){
    liveTrackMap = L.map("liveTrackMapEl").setView([trip.pickupLat, trip.pickupLng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap', maxZoom:19 }).addTo(liveTrackMap);
    L.marker([trip.pickupLat, trip.pickupLng]).addTo(liveTrackMap).bindPopup("📍 Pickup");
    if(trip.dropLat) L.marker([trip.dropLat, trip.dropLng]).addTo(liveTrackMap).bindPopup("🏁 Drop");
  }
  if(trip.driverId){
    db.collection("transportDrivers").doc(trip.driverId).onSnapshot((doc)=>{
      if(!doc.exists || !doc.data().liveLocation) return;
      const loc = doc.data().liveLocation;
      const latLng = [loc.lat, loc.lng];
      if(driverMarker) driverMarker.setLatLng(latLng);
      else driverMarker = L.marker(latLng, { icon: L.divIcon({ html:'🚑', className:'', iconSize:[26,26] }) }).addTo(liveTrackMap).bindPopup("🚑 ড্রাইভার");
    });
  }
}

$("cancelBookingBtn").addEventListener("click", async ()=>{
  if(!currentTripId) return;
  if(!confirm("বুকিং বাতিল করবেন?")) return;
  try{ await db.collection("trips").doc(currentTripId).update({ status: "cancelled" }); }catch(e){}
  location.reload();
});
</script>
</body>
</html>
