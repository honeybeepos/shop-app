<!-- ===== Honey Bee: সেলাই ঘর ডিজাইন ছবি জুম ভিউয়ার =====
     honey-bee-bazar.html এর একদম শেষে </body> এর ঠিক আগে পেস্ট করুন -->
<style>
#hbZoom{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.96);display:none;touch-action:none;overflow:hidden}
#hbZoom.open{display:block}
#hbZoomImg{position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
#hbZoomX{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;border:1px solid #d4a63a;background:#2a1f0a;color:#f5d27a;font-size:22px;z-index:2}
#hbZoomHint{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#f5d27a;font-size:14px;opacity:.85;pointer-events:none}
</style>

<div id="hbZoom">
  <button id="hbZoomX" aria-label="বন্ধ করুন">✕</button>
  <img id="hbZoomImg" alt="">
  <div id="hbZoomHint">দুই আঙুলে জুম করুন · ডাবল-ট্যাপে বড়/ছোট</div>
</div>

<script>
(function(){
  var box = document.getElementById('hbZoom');
  var im  = document.getElementById('hbZoomImg');
  var hint = document.getElementById('hbZoomHint');
  var MAX = 5;
  var s = 1, x = 0, y = 0;
  var pts = new Map();
  var startDist = 0, startS = 1, startMid = null, startX = 0, startY = 0, lastTap = 0;

  function apply(){
    im.style.transform = 'translate(calc(-50% + ' + x + 'px), calc(-50% + ' + y + 'px)) scale(' + s + ')';
  }
  function clampPos(){
    if (s <= 1){ s = 1; x = 0; y = 0; return; }
    var mx = Math.max(0, (im.offsetWidth  * s - innerWidth)  / 2);
    var my = Math.max(0, (im.offsetHeight * s - innerHeight) / 2);
    x = Math.min(mx, Math.max(-mx, x));
    y = Math.min(my, Math.max(-my, y));
  }
  function center(){ return { x: innerWidth / 2, y: innerHeight / 2 }; }
  function list(){ return Array.from(pts.values()); }
  function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
  function mid(a, b){ return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

  // দুই আঙুল / এক আঙুল শুরুর অবস্থা সেভ
  function snapshot(){
    var p = list();
    startS = s; startX = x; startY = y;
    if (p.length >= 2){ startDist = dist(p[0], p[1]); startMid = mid(p[0], p[1]); }
    else if (p.length === 1){ startMid = { x: p[0].x, y: p[0].y }; }
  }

  function open(src){
    im.src = src; s = 1; x = 0; y = 0; apply();
    hint.style.display = '';
    box.classList.add('open');
    document.body.style.overflow = 'hidden';
    history.pushState({ hbZoom: 1 }, '');
  }
  function close(fromBack){
    box.classList.remove('open');
    document.body.style.overflow = '';
    pts.clear();
    if (!fromBack && history.state && history.state.hbZoom) history.back();
  }
  window.hbOpenZoom = open; // চাইলে অন্য জায়গা থেকেও ডাকতে পারবেন

  document.getElementById('hbZoomX').addEventListener('click', function(e){ e.stopPropagation(); close(); });
  addEventListener('popstate', function(){ if (box.classList.contains('open')) close(true); }); // ফোনের Back বাটনে বন্ধ

  box.addEventListener('pointerdown', function(e){
    if (e.target.id === 'hbZoomX') return;
    box.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    hint.style.display = 'none';

    // ডাবল-ট্যাপ
    if (pts.size === 1){
      var now = Date.now();
      if (now - lastTap < 300){
        var c = center();
        if (s > 1){ s = 1; x = 0; y = 0; }
        else { s = 2.5; x = (e.clientX - c.x) * (1 - s); y = (e.clientY - c.y) * (1 - s); }
        clampPos(); apply(); lastTap = 0; snapshot(); return;
      }
      lastTap = now;
    }
    snapshot();
  });

  box.addEventListener('pointermove', function(e){
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    var p = list(), c = center();

    if (p.length >= 2 && startDist > 0){
      var m = mid(p[0], p[1]);
      var ns = Math.min(MAX, Math.max(1, startS * dist(p[0], p[1]) / startDist));
      // আঙুলের মাঝের জায়গা ধরে জুম
      x = m.x - c.x - ns * (startMid.x - c.x - startX) / startS;
      y = m.y - c.y - ns * (startMid.y - c.y - startY) / startS;
      s = ns;
      clampPos(); apply();
    } else if (p.length === 1 && s > 1){
      // জুম অবস্থায় এক আঙুলে সরানো
      x = startX + (p[0].x - startMid.x);
      y = startY + (p[0].y - startMid.y);
      clampPos(); apply();
    }
  });

  function up(e){
    pts.delete(e.pointerId);
    clampPos(); apply();
    snapshot();
  }
  box.addEventListener('pointerup', up);
  box.addEventListener('pointercancel', up);

  // সেলাই ঘরের ডিজাইন কার্ডের ছবিতে ট্যাপ করলে ভিউয়ার খুলবে
  // (যে কার্ডে "মজুরি" লেখা আছে, শুধু সেগুলোর ছবি)
  document.addEventListener('click', function(e){
    var img = e.target.closest && e.target.closest('img');
    if (!img || box.contains(img)) return;
    var el = img.parentElement, found = false;
    for (var i = 0; i < 6 && el; i++){
      if ((el.textContent || '').indexOf('মজুরি') > -1){ found = true; break; }
      el = el.parentElement;
    }
    if (!found) return;
    e.preventDefault(); e.stopPropagation();
    open(img.currentSrc || img.src);
  }, true);
})();
</script>
<!-- ===== জুম ভিউয়ার শেষ ===== -->
