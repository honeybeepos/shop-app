<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4a48">
<link rel="icon" href="icon-192.png">
<title>এডমিন প্যানেল — সব দোকান নিয়ন্ত্রণ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1a17; --paper:#f6f1e7; --line:#d8cbb0;
    --copper:#b5652f; --teal:#1f4a48; --due:#a3372c; --paid:#27633f; --card:#fffdf8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'Noto Sans Bengali','Space Mono',sans-serif;color:var(--ink);}
  header{background:var(--teal);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
  header h1{font-size:17px;margin:0;}
  header button{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#fff;padding:7px 14px;border-radius:7px;font-family:inherit;cursor:pointer;font-size:13px;}
  .wrap{max-width:920px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 0 var(--line);}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--teal);}
  textarea,input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13.5px;margin-bottom:8px;background:#fff;}
  .btn{padding:9px 16px;border:none;border-radius:8px;background:var(--copper);color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:13.5px;}
  .shop{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fffefb;}
  .shop-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
  .shop-name{font-weight:800;font-size:15px;}
  .chip{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;}
  .chip.active{background:#dcf0e8;color:var(--paid);}
  .chip.blocked{background:#f5e0dc;color:var(--due);}
  .meta{font-size:12px;color:#8a7f6c;margin:4px 0 8px;font-family:'Space Mono',monospace;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .row .btn{flex:1;min-width:110px;font-size:12.5px;padding:8px;}
  .btn.block{background:var(--due);}
  .btn.unblock{background:var(--paid);}
  .btn.ghost{background:#efe7d6;color:var(--ink);}
  .feat{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .feat label{display:flex;align-items:center;gap:5px;font-size:12px;background:#f6f1e7;padding:5px 10px;border-radius:20px;border:1px solid var(--line);}
  #loginGate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:99;}
  .members{margin-top:8px;font-size:12.5px;}
  .member-row{display:flex;justify-content:space-between;padding:5px 0;border-top:1px dashed var(--line);}
</style>
</head>
<body>

<div id="loginGate"><p>যাচাই করা হচ্ছে...</p></div>

<header>
  <h1>🛠️ সুপার-এডমিন প্যানেল</h1>
  <button id="logoutBtn">লগআউট</button>
</header>

<div class="wrap">

  <div class="card">
    <h2>📢 সব দোকানে ঘোষণা / আপডেট পাঠান</h2>
    <textarea id="announceText" rows="3" placeholder="যেমন: নতুন ফিচার যোগ হয়েছে — অ্যাপ রিফ্রেশ করুন"></textarea>
    <div class="row">
      <button class="btn" id="sendAnnounce">পাঠান (চালু করুন)</button>
      <button class="btn ghost" id="clearAnnounce">ঘোষণা বন্ধ করুন</button>
    </div>
  </div>

  <div class="card">
    <h2>🏙️ বাজার ম্যানেজমেন্ট (<span id="marketCount">0</span>)</h2>
    <input type="text" id="newMarketName" placeholder="বাজারের নাম (যেমনঃ দাম্মাম বাজার)">
    <input type="text" id="newMarketRegion" placeholder="অঞ্চল/শহর (ঐচ্ছিক)">
    <button class="btn" id="addMarketBtn">➕ নতুন বাজার যোগ করুন</button>
    <div id="marketList" style="margin-top:12px;">লোড হচ্ছে...</div>
  </div>

  <div class="card">
    <h2>🧑‍💼 এজেন্ট ম্যানেজমেন্ট (<span id="agentCount">0</span>)</h2>
    <input type="text" id="newAgentName" placeholder="এজেন্টের নাম">
    <input type="email" id="newAgentEmail" placeholder="ইমেইল (লগইনের জন্য)">
    <input type="text" id="newAgentPass" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
    <select id="newAgentMarket"><option value="">-- বাজার নির্বাচন করুন --</option></select>
    <input type="number" id="newAgentCommission" placeholder="কমিশন % (যেমনঃ 20)" value="20">
    <button class="btn" id="addAgentBtn">➕ নতুন এজেন্ট যোগ করুন</button>
    <p id="agentAddMsg" style="display:none; font-size:12.5px; margin:4px 0 0;"></p>
    <div id="agentList" style="margin-top:12px;">লোড হচ্ছে...</div>
  </div>

  <div class="card">
    <h2>🏪 সব দোকান (<span id="shopCount">0</span>)</h2>
    <div id="shopList">লোড হচ্ছে...</div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js").catch(()=>{});
}

const FEATURE_LABELS = {
  reports: "রিপোর্ট", extraIncome: "বাড়তি আয়", ops: "সাপ্লায়ার/স্টাফ/খরচ",
  monitor: "মনিটর", whatsapp: "হোয়াটসঅ্যাপ শেয়ার"
};

auth.onAuthStateChanged(async (user)=>{
  if(!user){ window.location.href = "login.html"; return; }
  const ok = await isSuperAdmin(user.uid);
  if(!ok){
    alert("আপনার সুপার-এডমিন অ্যাক্সেস নেই।");
    window.location.href = "login.html";
    return;
  }
  document.getElementById("loginGate").style.display = "none";
  loadShops();
  loadAnnouncement();
  loadMarkets();
  loadAgents();
});

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  clearSession();
  await auth.signOut();
  window.location.href = "login.html";
});

async function loadAnnouncement(){
  const snap = await db.collection("system").doc("announcement").get();
  if(snap.exists && snap.data().active){
    document.getElementById("announceText").value = snap.data().message || "";
  }
}

document.getElementById("sendAnnounce").addEventListener("click", async ()=>{
  const message = document.getElementById("announceText").value.trim();
  if(!message) return;
  await db.collection("system").doc("announcement").set({ message, active: true, updatedAt: fbNow() });
  alert("ঘোষণা পাঠানো হয়েছে — সব ব্যবহারকারী লগইন থাকা অবস্থায় সাথে সাথে দেখতে পাবে।");
});

document.getElementById("clearAnnounce").addEventListener("click", async ()=>{
  await db.collection("system").doc("announcement").set({ active: false, updatedAt: fbNow() }, { merge: true });
  document.getElementById("announceText").value = "";
});

/* ==================== 🏙️ বাজার ম্যানেজমেন্ট ==================== */
let __marketsCache = [];

async function loadMarkets(){
  const snap = await db.collection("markets").orderBy("name").get();
  __marketsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  document.getElementById("marketCount").textContent = snap.size;

  const list = document.getElementById("marketList");
  list.innerHTML = snap.empty
    ? "<p>এখনো কোনো বাজার তৈরি হয়নি।</p>"
    : __marketsCache.map(m => `
        <div class="member-row">
          <span>🏙️ ${m.name || m.id}${m.region ? " · " + m.region : ""}</span>
          <span style="font-family:'Space Mono',monospace; font-size:11px; color:#8a7f6c;">${m.id}</span>
        </div>`).join("");

  // এজেন্ট তৈরির ফর্মে বাজারের ড্রপডাউন আপডেট
  const sel = document.getElementById("newAgentMarket");
  const currentVal = sel.value;
  sel.innerHTML = '<option value="">-- বাজার নির্বাচন করুন --</option>' +
    __marketsCache.map(m => `<option value="${m.id}">${m.name || m.id}</option>`).join("");
  sel.value = currentVal;
}

document.getElementById("addMarketBtn").addEventListener("click", async ()=>{
  const name = document.getElementById("newMarketName").value.trim();
  const region = document.getElementById("newMarketRegion").value.trim();
  if(!name){ alert("বাজারের নাম দিন।"); return; }
  const btn = document.getElementById("addMarketBtn");
  btn.disabled = true; btn.textContent = "যোগ হচ্ছে...";
  try{
    await db.collection("markets").add({ name, region: region || null, createdAt: fbNow() });
    document.getElementById("newMarketName").value = "";
    document.getElementById("newMarketRegion").value = "";
    await loadMarkets();
  }catch(e){
    alert("বাজার যোগ করা যায়নি: " + e.message);
  }finally{
    btn.disabled = false; btn.textContent = "➕ নতুন বাজার যোগ করুন";
  }
});

/* ==================== 🧑‍💼 এজেন্ট ম্যানেজমেন্ট ==================== */
async function loadAgents(){
  const snap = await db.collection("agents").orderBy("createdAt","desc").get();
  document.getElementById("agentCount").textContent = snap.size;

  const list = document.getElementById("agentList");
  if(snap.empty){ list.innerHTML = "<p>এখনো কোনো এজেন্ট নিয়োগ করা হয়নি।</p>"; return; }

  list.innerHTML = "";
  for(const doc of snap.docs){
    const agent = doc.data();
    const agentId = doc.id;
    const market = __marketsCache.find(m => m.id === agent.marketId);
    const div = document.createElement("div");
    div.className = "shop";
    div.innerHTML = `
      <div class="shop-top">
        <span class="shop-name">${agent.name || "(নামহীন এজেন্ট)"}</span>
        <span class="chip ${agent.status === 'blocked' ? 'blocked' : 'active'}">${agent.status === 'blocked' ? 'ব্লকড' : 'সক্রিয়'}</span>
      </div>
      <div class="meta">${agent.email || ''} · বাজার: ${market ? (market.name || market.id) : (agent.marketId || '—')} · কমিশন: ${agent.commissionPercent != null ? agent.commissionPercent : '—'}%</div>
      <div class="row">
        ${agent.status === 'blocked'
          ? `<button class="btn unblock" data-agent-act="unblock" data-id="${agentId}">✅ আনব্লক করুন</button>`
          : `<button class="btn block" data-agent-act="block" data-id="${agentId}">⛔ ব্লক করুন</button>`}
      </div>
    `;
    list.appendChild(div);
  }
  list.querySelectorAll('[data-agent-act="block"]').forEach(b=>b.addEventListener("click", ()=>setAgentStatus(b.dataset.id,"blocked")));
  list.querySelectorAll('[data-agent-act="unblock"]').forEach(b=>b.addEventListener("click", ()=>setAgentStatus(b.dataset.id,"active")));
}

async function setAgentStatus(agentId, status){
  await db.collection("agents").doc(agentId).set({ status, updatedAt: fbNow() }, { merge: true });
  loadAgents();
}

document.getElementById("addAgentBtn").addEventListener("click", async ()=>{
  const name = document.getElementById("newAgentName").value.trim();
  const email = document.getElementById("newAgentEmail").value.trim();
  const pass = document.getElementById("newAgentPass").value;
  const marketId = document.getElementById("newAgentMarket").value;
  const commission = Number(document.getElementById("newAgentCommission").value) || 0;
  const msgEl = document.getElementById("agentAddMsg");
  msgEl.style.display = "none";

  if(!name || !email || !pass || !marketId){
    msgEl.textContent = "⚠️ নাম, ইমেইল, পাসওয়ার্ড ও বাজার — সবগুলো দিন।";
    msgEl.style.color = "var(--due)"; msgEl.style.display = "block";
    return;
  }
  if(pass.length < 6){
    msgEl.textContent = "⚠️ পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।";
    msgEl.style.color = "var(--due)"; msgEl.style.display = "block";
    return;
  }

  const btn = document.getElementById("addAgentBtn");
  btn.disabled = true; btn.textContent = "তৈরি হচ্ছে...";
  try{
    // secondaryAuth ব্যবহার করা হচ্ছে যাতে নতুন এজেন্ট তৈরি করার সময়
    // সুপার-অ্যাডমিনের নিজের লগইন সেশন নষ্ট না হয়
    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, pass);
    const newUid = cred.user.uid;
    await secondaryAuth.signOut();

    await db.collection("users").doc(newUid).set({ role: "agent", email, createdAt: fbNow() });
    await db.collection("agents").doc(newUid).set({
      name, email, marketId,
      commissionPercent: commission,
      status: "active",
      createdAt: fbNow()
    });

    document.getElementById("newAgentName").value = "";
    document.getElementById("newAgentEmail").value = "";
    document.getElementById("newAgentPass").value = "";
    document.getElementById("newAgentMarket").value = "";
    document.getElementById("newAgentCommission").value = "20";
    msgEl.textContent = "✅ এজেন্ট তৈরি হয়েছে — এখন এই ইমেইল/পাসওয়ার্ড দিয়ে Honey Bee Agent অ্যাপে লগইন করতে পারবেন।";
    msgEl.style.color = "var(--paid)"; msgEl.style.display = "block";
    await loadAgents();
  }catch(e){
    console.error(e);
    let friendly = e.message;
    if(e.code === "auth/email-already-in-use") friendly = "এই ইমেইল দিয়ে আগে থেকেই একটা অ্যাকাউন্ট আছে।";
    msgEl.textContent = "⚠️ এজেন্ট তৈরি করা যায়নি: " + friendly;
    msgEl.style.color = "var(--due)"; msgEl.style.display = "block";
  }finally{
    btn.disabled = false; btn.textContent = "➕ নতুন এজেন্ট যোগ করুন";
  }
});

async function loadShops(){
  const snap = await db.collection("shops").orderBy("createdAt","desc").get();
  document.getElementById("shopCount").textContent = snap.size;
  const list = document.getElementById("shopList");
  if(snap.empty){ list.innerHTML = "<p>এখনো কোনো দোকান নিবন্ধিত হয়নি।</p>"; return; }
  list.innerHTML = "";
  for(const doc of snap.docs){
    const shop = doc.data();
    const shopId = doc.id;
    const div = document.createElement("div");
    div.className = "shop";
    const featureBoxes = Object.keys(FEATURE_LABELS).map(key=>{
      const checked = shop.features && shop.features[key] !== false ? "checked" : "";
      return `<label><input type="checkbox" data-feat="${key}" ${checked}> ${FEATURE_LABELS[key]}</label>`;
    }).join("");
    div.innerHTML = `
      <div class="shop-top">
        <span class="shop-name">${shop.shopName || "(নামহীন)"}</span>
        <span class="chip ${shop.status === 'blocked' ? 'blocked' : 'active'}">${shop.status === 'blocked' ? 'ব্লকড' : 'সচল'}</span>
      </div>
      <div class="meta">মালিক: ${shop.ownerName || ''} · ${shop.ownerEmail || ''}${shop.blockedReason ? ' · কারণ: '+shop.blockedReason : ''}</div>
      <div class="feat">${featureBoxes}</div>
      <div class="members" id="members-${shopId}">সাব-ইউজার লোড হচ্ছে...</div>
      <div class="row">
        ${shop.status === 'blocked'
          ? `<button class="btn unblock" data-act="unblock" data-id="${shopId}">✅ আনব্লক করুন</button>`
          : `<button class="btn block" data-act="block" data-id="${shopId}">⛔ ব্লক করুন</button>`}
        <button class="btn ghost" data-act="savefeat" data-id="${shopId}">💾 ফিচার সেভ করুন</button>
      </div>
    `;
    list.appendChild(div);
    loadMembers(shopId);
  }

  list.querySelectorAll('[data-act="block"]').forEach(b=>b.addEventListener("click", ()=>setStatus(b.dataset.id,"blocked")));
  list.querySelectorAll('[data-act="unblock"]').forEach(b=>b.addEventListener("click", ()=>setStatus(b.dataset.id,"active")));
  list.querySelectorAll('[data-act="savefeat"]').forEach(b=>b.addEventListener("click", ()=>saveFeatures(b.dataset.id, b.closest(".shop"))));
}

async function loadMembers(shopId){
  const snap = await db.collection("shops").doc(shopId).collection("members").get();
  const el = document.getElementById("members-"+shopId);
  if(snap.empty){ el.innerHTML = ""; return; }
  el.innerHTML = snap.docs.map(d=>{
    const m = d.data();
    return `<div class="member-row"><span>${m.role === 'admin' ? '👑' : '🧑‍💼'} ${m.name}</span><span>${m.email}</span></div>`;
  }).join("");
}

async function setStatus(shopId, status){
  const extra = { status, updatedAt: fbNow() };
  if(status === "active"){
    extra.blockedReason = firebase.firestore.FieldValue.delete();
    // এই দোকানের সব ইউজার/সাব-ইউজারের ভুল-পাসওয়ার্ড গণনা রিসেট করা হচ্ছে,
    // নাহলে আনব্লক করার পরেও একটা ভুল চাপেই আবার ব্লক হয়ে যাবে
    const membersSnap = await db.collection("shops").doc(shopId).collection("members").get();
    const clears = membersSnap.docs
      .map(d => d.data().email)
      .filter(Boolean)
      .map(email => db.collection("loginAttempts").doc(email).delete().catch(()=>{}));
    await Promise.all(clears);
  }
  await db.collection("shops").doc(shopId).set(extra, { merge: true });
  loadShops();
}

async function saveFeatures(shopId, shopEl){
  const features = {};
  shopEl.querySelectorAll('[data-feat]').forEach(cb=>{
    features[cb.dataset.feat] = cb.checked;
  });
  await db.collection("shops").doc(shopId).set({ features, updatedAt: fbNow() }, { merge: true });
  alert("ফিচার সেটিং সেভ হয়েছে।");
}
</script>
</body>
</html>
